<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="ui-monospace, Consolas, monospace">
  <rect width="900" height="460" fill="#fbf9f4"/>

  <text x="24" y="32" font-size="18" font-weight="700" fill="#1e1b14">The Affinity Laws — Why VFDs Save So Much Pump Energy</text>

  <!-- 3 laws -->
  <g font-size="11" font-weight="700">
    <rect x="24" y="55" width="272" height="90" rx="6" fill="#eef3f7" stroke="#0e7490" stroke-width="2"/>
    <text x="160" y="90" text-anchor="middle" fill="#0e7490">Flow ∝ Speed</text>
    <text x="160" y="115" font-weight="400" font-size="9.5" text-anchor="middle" fill="#3f3a2c">Linear relationship</text>

    <rect x="314" y="55" width="272" height="90" rx="6" fill="#fdeec9" stroke="#b45309" stroke-width="2"/>
    <text x="450" y="90" text-anchor="middle" fill="#b45309">Head ∝ Speed²</text>
    <text x="450" y="115" font-weight="400" font-size="9.5" text-anchor="middle" fill="#3f3a2c">Squared relationship</text>

    <rect x="604" y="55" width="272" height="90" rx="6" fill="#fdeaea" stroke="#a4231e" stroke-width="2.5"/>
    <text x="740" y="90" text-anchor="middle" fill="#8f1f1a">Power ∝ Speed³</text>
    <text x="740" y="115" font-weight="400" font-size="9.5" text-anchor="middle" fill="#3f3a2c">Cubed — the big win</text>
  </g>

  <!-- worked example -->
  <rect x="24" y="165" width="410" height="130" rx="6" fill="#e9f4ef" stroke="#059669" stroke-width="2"/>
  <text x="38" y="188" font-size="12.5" font-weight="700" fill="#065f46">Worked example — 80% speed</text>
  <g font-size="10" font-weight="700">
    <text x="38" y="215" fill="#065f46">Flow → 80%</text>
    <text x="38" y="235" fill="#065f46">Head → 64% (0.8²)</text>
    <text x="38" y="255" fill="#065f46">Power → ~51% (0.8³)</text>
  </g>
  <text x="38" y="280" font-size="9.5" fill="#3f3a2c">A 20% speed cut nearly HALVES power draw.</text>

  <!-- VFD vs throttling -->
  <rect x="459" y="165" width="417" height="130" rx="6" fill="#fdeaea" stroke="#a4231e" stroke-width="2"/>
  <text x="473" y="188" font-size="12.5" font-weight="700" fill="#8f1f1a">Throttling vs. speed reduction</text>
  <text x="473" y="210" font-size="9.5" fill="#5c5748">Throttling a discharge valve wastes the</text>
  <text x="473" y="224" font-size="9.5" fill="#5c5748">excess energy as heat in the valve.</text>
  <rect x="473" y="236" width="380" height="26" rx="4" fill="#8f1f1a"/>
  <text x="663" y="254" font-size="9.5" font-weight="700" fill="#ffffff" text-anchor="middle">VFD speed reduction saves that energy instead</text>

  <rect x="24" y="315" width="852" height="90" rx="6" fill="#fff4e8" stroke="#d4802a" stroke-width="1.5"/>
  <text x="38" y="338" font-size="12" font-weight="700" fill="#7a3f14">Why VFDs pay for themselves on variable-demand systems</text>
  <text x="38" y="360" font-size="10" fill="#5c5748">A VFD lets pump speed track system demand continuously, keeping the operating point near BEP across</text>
  <text x="38" y="374" font-size="10" fill="#5c5748">a wide load range — the cube-law power savings compound every hour the system runs below full demand.</text>
</svg>
