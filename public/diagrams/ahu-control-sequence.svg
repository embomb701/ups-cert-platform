<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="ui-monospace, Consolas, monospace">
  <rect width="900" height="480" fill="#fbf9f4"/>

  <text x="24" y="32" font-size="18" font-weight="700" fill="#1e1b14">AHU Airflow Path and the Three Energy-Saving Sequences</text>

  <!-- airflow path -->
  <g font-size="9" font-weight="700">
    <rect x="24" y="55" width="118" height="60" rx="4" fill="#eef3f7" stroke="#0e7490" stroke-width="1.5"/><text x="83" y="76" text-anchor="middle" fill="#0e7490">OA / RA / EA</text><text x="83" y="90" font-weight="400" font-size="8" text-anchor="middle" fill="#5c5748">dampers,</text><text x="83" y="102" font-weight="400" font-size="8" text-anchor="middle" fill="#5c5748">mixed-air plenum</text>

    <rect x="154" y="55" width="100" height="60" rx="4" fill="#ffffff" stroke="#7a7256" stroke-width="1.5"/><text x="204" y="80" text-anchor="middle" fill="#1e1b14">Filters</text><text x="204" y="96" font-weight="400" font-size="8" text-anchor="middle" fill="#5c5748">pre + final</text>

    <rect x="266" y="55" width="118" height="60" rx="4" fill="#eef3f7" stroke="#0e7490" stroke-width="1.5"/><text x="325" y="76" text-anchor="middle" fill="#0e7490">Cooling coil</text><text x="325" y="90" font-weight="400" font-size="8" text-anchor="middle" fill="#5c5748">CHW or DX</text>

    <rect x="396" y="55" width="118" height="60" rx="4" fill="#fdeec9" stroke="#b45309" stroke-width="1.5"/><text x="455" y="76" text-anchor="middle" fill="#b45309">Heating coil</text><text x="455" y="90" font-weight="400" font-size="8" text-anchor="middle" fill="#5c5748">HW or electric</text>

    <rect x="526" y="55" width="130" height="60" rx="4" fill="#e9f4ef" stroke="#059669" stroke-width="2"/><text x="591" y="76" text-anchor="middle" fill="#065f46">SAT sensor</text><text x="591" y="90" font-weight="400" font-size="8" text-anchor="middle" fill="#5c5748">supply air temp</text>

    <rect x="668" y="55" width="208" height="60" rx="4" fill="#ffffff" stroke="#7a7256" stroke-width="1.5"/><text x="772" y="80" text-anchor="middle" fill="#1e1b14">Supply fan → zones</text><text x="772" y="96" font-weight="400" font-size="8" text-anchor="middle" fill="#5c5748">return/exhaust fan completes loop</text>
  </g>
  <g stroke="#1e1b14" stroke-width="1.5" marker-end="url(#ah)">
    <line x1="142" y1="85" x2="152" y2="85"/><line x1="254" y1="85" x2="264" y2="85"/>
    <line x1="384" y1="85" x2="394" y2="85"/><line x1="514" y1="85" x2="524" y2="85"/><line x1="656" y1="85" x2="666" y2="85"/>
  </g>

  <!-- SAT reset -->
  <rect x="24" y="135" width="272" height="130" rx="6" fill="#e9f4ef" stroke="#059669" stroke-width="2"/>
  <text x="38" y="158" font-size="12" font-weight="700" fill="#065f46">SAT reset</text>
  <text x="38" y="180" font-size="9.5" fill="#3f3a2c">Design SAT ≈ 55°F at full cooling</text>
  <text x="38" y="194" font-size="9.5" fill="#3f3a2c">load. When VAV boxes are nearly</text>
  <text x="38" y="208" font-size="9.5" fill="#3f3a2c">closed, raise SAT setpoint.</text>
  <text x="38" y="230" font-size="9.5" font-weight="700" fill="#065f46">Trim &amp; Respond (ASHRAE Gdln 36)</text>
  <text x="38" y="244" font-size="9.5" font-weight="700" fill="#065f46">adjusts SAT from zone requests.</text>

  <!-- economizer -->
  <rect x="314" y="135" width="272" height="130" rx="6" fill="#eef3f7" stroke="#0e7490" stroke-width="2"/>
  <text x="328" y="158" font-size="12" font-weight="700" fill="#0e7490">Economizer — free cooling</text>
  <text x="328" y="180" font-size="9.5" fill="#3f3a2c">Opens OA damper when outdoor</text>
  <text x="328" y="194" font-size="9.5" fill="#3f3a2c">air can cool without compressor.</text>
  <text x="328" y="216" font-size="9.5" font-weight="700" fill="#1f5a8f">Enthalpy-based &gt; dry-bulb — humid</text>
  <text x="328" y="230" font-size="9.5" font-weight="700" fill="#1f5a8f">cool air can still raise cooling load.</text>
  <text x="328" y="252" font-size="9" fill="#5c5748">ASHRAE 90.1 requires it on most sized AHUs</text>

  <!-- DCV -->
  <rect x="604" y="135" width="272" height="130" rx="6" fill="#fdeec9" stroke="#b45309" stroke-width="2"/>
  <text x="618" y="158" font-size="12" font-weight="700" fill="#b45309">Demand-Controlled Ventilation</text>
  <text x="618" y="180" font-size="9.5" fill="#3f3a2c">Adjusts minimum OA by CO₂ level</text>
  <text x="618" y="194" font-size="9.5" fill="#3f3a2c">instead of a fixed minimum.</text>
  <rect x="618" y="206" width="150" height="24" rx="4" fill="#b45309"/>
  <text x="693" y="222" font-size="9.5" font-weight="700" fill="#ffffff" text-anchor="middle">CO₂ setpoint: 1,000 ppm</text>
  <text x="618" y="248" font-size="9" fill="#5c5748">Saves heating/cooling energy in partially occupied spaces</text>

  <rect x="24" y="285" width="852" height="60" rx="5" fill="#ffffff" stroke="#7a7256" stroke-width="1.5"/>
  <text x="38" y="308" font-size="11" font-weight="700" fill="#1e1b14">Minimum OA per ASHRAE 62.1 is the ventilation floor</text>
  <text x="38" y="328" font-size="10" fill="#5c5748">Fixed minimum OA is simple but wastes energy; DCV trims below the fixed minimum when occupancy is low, never below code-required ventilation.</text>

  <rect x="24" y="365" width="852" height="82" rx="6" fill="#fdeaea" stroke="#a4231e" stroke-width="2"/>
  <text x="38" y="388" font-size="12" font-weight="700" fill="#8f1f1a">Why SAT reset and economizer control both save energy the same way</text>
  <text x="38" y="410" font-size="10" fill="#5c5748">Every degree of unnecessary cooling costs refrigeration energy. SAT reset avoids over-cooling supply air</text>
  <text x="38" y="424" font-size="10" fill="#5c5748">when zones don't need it; the economizer avoids running the compressor at all when outdoor air can do the job.</text>

  <defs>
    <marker id="ah" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#1e1b14"/></marker>
  </defs>
</svg>
