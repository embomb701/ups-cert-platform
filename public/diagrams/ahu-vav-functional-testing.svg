<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="ui-monospace, Consolas, monospace">
  <rect width="900" height="460" fill="#fbf9f4"/>

  <text x="24" y="32" font-size="18" font-weight="700" fill="#1e1b14">Air-Side Commissioning — Where 40-60% of Building Energy Use Lives</text>

  <!-- AHU FPT scope -->
  <rect x="24" y="55" width="852" height="105" rx="6" fill="#eef3f7" stroke="#0e7490" stroke-width="2"/>
  <text x="38" y="78" font-size="12.5" font-weight="700" fill="#0e7490">AHU functional test scope</text>
  <g font-size="9" font-weight="700" fill="#1f5a8f">
    <text x="50" y="102">• Supply fan speed 0-100% via VFD</text>
    <text x="300" y="102">• Return/exhaust fan tracking (pressurization)</text>
    <text x="600" y="102">• Mixed air damper sequence</text>
    <text x="50" y="120">• Heating/cooling coil control loops</text>
    <text x="330" y="120">• Min OA position (measured, not assumed)</text>
    <text x="640" y="120">• Economizer sequence</text>
  </g>
  <text x="38" y="142" font-size="9.5" font-weight="700" fill="#0e7490">All safety shutdowns tested: smoke detector, freeze stat, high/low static pressure.</text>

  <!-- VAV deficiencies -->
  <rect x="24" y="175" width="410" height="130" rx="6" fill="#fdeaea" stroke="#a4231e" stroke-width="2"/>
  <text x="38" y="198" font-size="12" font-weight="700" fill="#8f1f1a">VAV boxes — the highest deficiency count</text>
  <text x="38" y="220" font-size="9.5" fill="#5c5748">Airflow sensor calibration errors, min/max</text>
  <text x="38" y="234" font-size="9.5" fill="#5c5748">setpoint mistakes, heating coil malfunction,</text>
  <text x="38" y="248" font-size="9.5" fill="#5c5748">broken heating/cooling changeover.</text>
  <text x="38" y="270" font-size="9.5" font-weight="700" fill="#8f1f1a">Sensor error test: compare DDC-reported</text>
  <text x="38" y="284" font-size="9.5" font-weight="700" fill="#8f1f1a">airflow to an independent field measurement.</text>

  <!-- economizer value -->
  <rect x="459" y="175" width="417" height="130" rx="6" fill="#e9f4ef" stroke="#059669" stroke-width="2"/>
  <text x="473" y="198" font-size="12" font-weight="700" fill="#065f46">Economizer — the highest-value item</text>
  <rect x="473" y="210" width="380" height="26" rx="4" fill="#059669"/>
  <text x="663" y="228" font-size="9.5" font-weight="700" fill="#ffffff" text-anchor="middle">Properly working: 20-50% cooling energy saved</text>
  <text x="473" y="252" font-size="9.5" fill="#3f3a2c">Failure modes: stuck closed (no free cooling),</text>
  <text x="473" y="266" font-size="9.5" fill="#3f3a2c">stuck open (overcooling, humidity loss),</text>
  <text x="473" y="280" font-size="9.5" fill="#3f3a2c">miscalibrated enthalpy control.</text>

  <rect x="24" y="320" width="852" height="80" rx="6" fill="#fff4e8" stroke="#d4802a" stroke-width="1.5"/>
  <text x="38" y="343" font-size="12" font-weight="700" fill="#7a3f14">A stuck-closed economizer is one of the costliest deficiencies in new construction</text>
  <text x="38" y="365" font-size="10" fill="#5c5748">The AHU runs mechanical cooling year-round even when outdoor air is cool enough for free cooling —</text>
  <text x="38" y="379" font-size="10" fill="#5c5748">often worth thousands of dollars per year per AHU, and it never trips an alarm on its own.</text>
</svg>
