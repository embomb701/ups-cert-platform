<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="ui-monospace, Consolas, monospace">
  <rect width="900" height="480" fill="#fbf9f4"/>

  <text x="24" y="32" font-size="18" font-weight="700" fill="#1e1b14">Ammonia (R-717) — 7× Less Refrigerant, and Why It Rises Instead of Falls</text>

  <!-- properties -->
  <rect x="24" y="55" width="410" height="150" rx="6" fill="#e7f4f7" stroke="#0891b2" stroke-width="2"/>
  <text x="38" y="78" font-size="12.5" font-weight="700" fill="#0e6e85">Thermodynamic advantage</text>
  <rect x="38" y="90" width="358" height="30" rx="4" fill="#0891b2"/>
  <text x="217" y="110" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">561 BTU/lb latent heat vs. 82 for R-134a</text>
  <text x="38" y="140" font-size="9.5" fill="#3f3a2c">~7× less refrigerant mass circulated for the</text>
  <text x="38" y="154" font-size="9.5" fill="#3f3a2c">same cooling duty — smaller pipes, lower</text>
  <text x="38" y="168" font-size="9.5" fill="#3f3a2c">pumping cost, faster response.</text>
  <text x="38" y="190" font-size="9" font-weight="700" fill="#0e6e85">Zero GWP, excellent heat transfer, very low viscosity.</text>

  <!-- vapor density -->
  <rect x="459" y="55" width="417" height="150" rx="6" fill="#fdeaea" stroke="#a4231e" stroke-width="2"/>
  <text x="473" y="78" font-size="12.5" font-weight="700" fill="#8f1f1a">Vapor density — opposite of HFCs</text>
  <text x="473" y="100" font-size="9.5" fill="#5c5748">Specific gravity 0.59 — LIGHTER than air.</text>
  <rect x="473" y="112" width="380" height="30" rx="4" fill="#8f1f1a"/>
  <text x="663" y="132" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">Detectors mount near the CEILING</text>
  <text x="473" y="162" font-size="9.5" fill="#5c5748">HFC refrigerants are heavier than air and</text>
  <text x="473" y="176" font-size="9.5" fill="#5c5748">sink — ammonia rises and pools at the</text>
  <text x="473" y="190" font-size="9.5" fill="#5c5748">ceiling and in roof voids instead.</text>

  <!-- two-stage compression chain -->
  <g font-size="9" font-weight="700">
    <rect x="24" y="225" width="195" height="55" rx="4" fill="#fdeec9" stroke="#b45309" stroke-width="2"/><text x="121" y="248" text-anchor="middle" fill="#b45309">Low-stage compressor</text><text x="121" y="264" font-weight="400" font-size="8" text-anchor="middle" fill="#5c5748">from -40°F suction</text>

    <rect x="239" y="225" width="195" height="55" rx="4" fill="#e7f4f7" stroke="#0891b2" stroke-width="2.5"/><text x="336" y="248" text-anchor="middle" fill="#0e6e85">Intercooler</text><text x="336" y="264" font-weight="400" font-size="8" text-anchor="middle" fill="#5c5748">flash gas cools intermediate gas</text>

    <rect x="454" y="225" width="195" height="55" rx="4" fill="#fdeec9" stroke="#b45309" stroke-width="2"/><text x="551" y="248" text-anchor="middle" fill="#b45309">High-stage compressor</text><text x="551" y="264" font-weight="400" font-size="8" text-anchor="middle" fill="#5c5748">to +86°F condensing</text>

    <rect x="669" y="225" width="207" height="55" rx="4" fill="#e9f4ef" stroke="#059669" stroke-width="2"/><text x="772" y="248" text-anchor="middle" fill="#065f46">Condenser</text><text x="772" y="264" font-weight="400" font-size="8" text-anchor="middle" fill="#3f3a2c">liquid subcooled by intercooler</text>
  </g>
  <g stroke="#1e1b14" stroke-width="1.5" marker-end="url(#am)">
    <line x1="219" y1="252" x2="237" y2="252"/><line x1="434" y1="252" x2="452" y2="252"/><line x1="649" y1="252" x2="667" y2="252"/>
  </g>

  <rect x="24" y="300" width="852" height="80" rx="6" fill="#fdeec9" stroke="#b45309" stroke-width="2"/>
  <text x="38" y="323" font-size="12" font-weight="700" fill="#b45309">Why two stages instead of one</text>
  <text x="38" y="345" font-size="10" fill="#5c5748">Single-stage compression from -40°F to +86°F exceeds 7:1 ratio — high discharge temps, poor volumetric</text>
  <text x="38" y="359" font-size="10" fill="#5c5748">efficiency, mechanical stress. Two-stage splits the ratio and improves efficiency by 15-25%.</text>

  <rect x="24" y="392" width="852" height="70" rx="6" fill="#ffffff" stroke="#1e1b14" stroke-width="2"/>
  <text x="38" y="411" font-size="11.5" font-weight="700" fill="#1e1b14">Flash intercooler — the most common type</text>
  <text x="38" y="430" font-size="10" fill="#5c5748">High-pressure liquid partially flashes through a float valve into the intercooler at intermediate</text>
  <text x="38" y="444" font-size="10" fill="#5c5748">pressure — cooling the low-stage discharge gas and subcooling liquid to the low-pressure evaporators.</text>

  <defs>
    <marker id="am" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#1e1b14"/></marker>
  </defs>
</svg>
