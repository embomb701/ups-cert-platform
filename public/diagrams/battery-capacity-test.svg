<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="ui-monospace, Consolas, monospace">
  <rect width="900" height="480" fill="#fbf9f4"/>

  <text x="24" y="32" font-size="18" font-weight="700" fill="#1e1b14">Voltage Is Not Capacity — the Capacity Test Is Ground Truth</text>

  <rect x="24" y="55" width="852" height="90" rx="6" fill="#fdeaea" stroke="#a4231e" stroke-width="2"/>
  <text x="38" y="79" font-size="12.5" font-weight="700" fill="#8f1f1a">The most dangerous silent failure in critical power</text>
  <text x="38" y="99" font-size="10.5" fill="#5c5748">A string at 54.5V (normal float), all cells equal — but only 40% of rated capacity. Every volt looks</text>
  <text x="38" y="115" font-size="10.5" fill="#5c5748">normal until load is applied, and the cells exhaust in minutes instead of hours. It fails during the outage.</text>
  <text x="38" y="133" font-size="10.5" font-weight="700" fill="#8f1f1a">OCV tracks state of charge — not whether the battery can actually deliver rated reserve time.</text>

  <!-- test steps -->
  <text x="24" y="175" font-size="13" font-weight="700" fill="#1e1b14">IEEE 450 (vented) / IEEE 1188 (VRLA) — the procedure</text>

  <g font-size="9.5">
    <rect x="24" y="188" width="200" height="40" rx="4" fill="#e9f2fb" stroke="#0e7490" stroke-width="1.5"/><text x="34" y="204" font-weight="700" fill="#0e7490">1. Full charge</text><text x="34" y="218" fill="#5c5748">24h+ on float after equalization</text>

    <rect x="234" y="188" width="200" height="40" rx="4" fill="#e9f2fb" stroke="#0e7490" stroke-width="1.5"/><text x="244" y="204" font-weight="700" fill="#0e7490">2. Constant load</text><text x="244" y="218" fill="#5c5748">C₈ rate through a load bank</text>

    <rect x="444" y="188" width="200" height="40" rx="4" fill="#e9f2fb" stroke="#0e7490" stroke-width="1.5"/><text x="454" y="204" font-weight="700" fill="#0e7490">3. Record readings</text><text x="454" y="218" fill="#5c5748">cell/string V, current every 30min</text>

    <rect x="654" y="188" width="222" height="40" rx="4" fill="#fdeec9" stroke="#b45309" stroke-width="1.5"/><text x="664" y="204" font-weight="700" fill="#b45309">4. To cutoff</text><text x="664" y="218" fill="#5c5748">1.75V/cell (lead-acid) or BMS cutoff</text>

    <rect x="24" y="238" width="200" height="40" rx="4" fill="#fdeec9" stroke="#b45309" stroke-width="1.5"/><text x="34" y="254" font-weight="700" fill="#b45309">5. Calculate Ah</text><text x="34" y="268" fill="#5c5748">avg current × elapsed hours</text>

    <rect x="234" y="238" width="200" height="40" rx="4" fill="#fdeec9" stroke="#b45309" stroke-width="1.5"/><text x="244" y="254" font-weight="700" fill="#b45309">6. Compare</text><text x="244" y="268" fill="#5c5748">actual Ah vs. rated Ah</text>

    <rect x="444" y="238" width="200" height="40" rx="4" fill="#fdeec9" stroke="#b45309" stroke-width="1.5"/><text x="454" y="254" font-weight="700" fill="#b45309">7. Temp correction</text><text x="454" y="268" fill="#5c5748">10°C battery ≈ 80% of rated</text>

    <rect x="654" y="238" width="222" height="40" rx="4" fill="#fdeaea" stroke="#a4231e" stroke-width="2"/><text x="664" y="254" font-weight="700" fill="#a4231e">8. Pass: ≥80% Ah</text><text x="664" y="268" fill="#5c5748">below 80% at corrected rate = replace</text>
  </g>
  <g stroke="#1e1b14" stroke-width="1.3" marker-end="url(#dc)">
    <line x1="224" y1="208" x2="232" y2="208"/><line x1="434" y1="208" x2="442" y2="208"/><line x1="644" y1="208" x2="652" y2="208"/>
    <line x1="824" y1="228" x2="824" y2="236"/>
    <line x1="654" y1="258" x2="644" y2="258" transform="translate(0,0)"/>
  </g>
  <path d="M 654 258 L 644 258" stroke="#1e1b14" stroke-width="1.3"/>
  <path d="M 444 258 L 434 258" stroke="#1e1b14" stroke-width="1.3"/>
  <path d="M 234 258 L 224 258" stroke="#1e1b14" stroke-width="1.3"/>

  <!-- residual capacity warning -->
  <rect x="24" y="300" width="852" height="100" rx="6" fill="#fdeec9" stroke="#b45309" stroke-width="2"/>
  <text x="38" y="323" font-size="12.5" font-weight="700" fill="#b45309">Residual capacity warning — the test removes protection</text>
  <text x="38" y="346" font-size="10.5" fill="#5c5748">During the test, the battery is off float and discharging — the critical load it backs has NO battery</text>
  <text x="38" y="362" font-size="10.5" fill="#5c5748">protection until the test concludes and it recharges. A utility outage during the test = immediate load loss.</text>
  <text x="38" y="384" font-size="10.5" font-weight="700" fill="#8a5010">Schedule during low-risk windows with a backup path — second string, utility hold, manual monitoring.</text>

  <rect x="24" y="415" width="852" height="45" rx="5" fill="#ffffff" stroke="#1e1b14" stroke-width="2"/>
  <text x="38" y="442" font-size="11" font-weight="700" fill="#1e1b14">Never perform a capacity test on a system with no backup path for the load during the test period.</text>

  <defs>
    <marker id="dc" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#1e1b14"/>
    </marker>
  </defs>
</svg>
