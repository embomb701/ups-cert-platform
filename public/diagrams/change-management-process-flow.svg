<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="ui-monospace, Consolas, monospace">
  <rect width="900" height="480" fill="#fbf9f4"/>

  <text x="24" y="32" font-size="18" font-weight="700" fill="#1e1b14">Change Management — the Discipline That Prevents the #1 Cause of Outages</text>

  <!-- process flow -->
  <g font-size="8" font-weight="700">
    <rect x="24" y="55" width="118" height="50" rx="4" fill="#eef3f7" stroke="#0e7490" stroke-width="1.5"/><text x="83" y="76" text-anchor="middle" fill="#0e7490">Request</text><text x="83" y="90" font-weight="400" font-size="7" text-anchor="middle" fill="#5c5748">scope, risk, rollback</text>

    <rect x="152" y="55" width="118" height="50" rx="4" fill="#eef3f7" stroke="#0e7490" stroke-width="1.5"/><text x="211" y="76" text-anchor="middle" fill="#0e7490">CAB Review</text><text x="211" y="90" font-weight="400" font-size="7" text-anchor="middle" fill="#5c5748">risk, scheduling</text>

    <rect x="280" y="55" width="118" height="50" rx="4" fill="#fdeec9" stroke="#b45309" stroke-width="1.5"/><text x="339" y="76" text-anchor="middle" fill="#b45309">Approval</text><text x="339" y="90" font-weight="400" font-size="7" text-anchor="middle" fill="#5c5748">sign-off by risk tier</text>

    <rect x="408" y="55" width="118" height="50" rx="4" fill="#fdeec9" stroke="#b45309" stroke-width="1.5"/><text x="467" y="76" text-anchor="middle" fill="#b45309">Schedule</text><text x="467" y="90" font-weight="400" font-size="7" text-anchor="middle" fill="#5c5748">low-risk window</text>

    <rect x="536" y="55" width="118" height="50" rx="4" fill="#fdeaea" stroke="#a4231e" stroke-width="1.5"/><text x="595" y="76" text-anchor="middle" fill="#8f1f1a">Execute</text><text x="595" y="90" font-weight="400" font-size="7" text-anchor="middle" fill="#5c5748">2nd-person verify</text>

    <rect x="664" y="55" width="118" height="50" rx="4" fill="#fdeaea" stroke="#a4231e" stroke-width="1.5"/><text x="723" y="76" text-anchor="middle" fill="#8f1f1a">Verify</text><text x="723" y="90" font-weight="400" font-size="7" text-anchor="middle" fill="#5c5748">confirm correct op</text>

    <rect x="792" y="55" width="84" height="50" rx="4" fill="#e9f4ef" stroke="#059669" stroke-width="1.5"/><text x="834" y="76" text-anchor="middle" fill="#065f46">Close</text><text x="834" y="90" font-weight="400" font-size="7" text-anchor="middle" fill="#3f3a2c">as-found/as-left</text>
  </g>
  <g stroke="#1e1b14" stroke-width="1.2" marker-end="url(#cm)">
    <line x1="142" y1="80" x2="150" y2="80"/><line x1="270" y1="80" x2="278" y2="80"/><line x1="398" y1="80" x2="406" y2="80"/>
    <line x1="526" y1="80" x2="534" y2="80"/><line x1="654" y1="80" x2="662" y2="80"/><line x1="782" y1="80" x2="790" y2="80"/>
  </g>

  <!-- risk tiers -->
  <rect x="24" y="130" width="852" height="120" rx="6" fill="#ffffff" stroke="#7a7256" stroke-width="1.5"/>
  <text x="38" y="153" font-size="12" font-weight="700" fill="#1e1b14">Risk classification sets how much process a change needs</text>
  <g font-size="9.5" font-weight="700">
    <rect x="38" y="165" width="260" height="65" rx="4" fill="#e9f4ef" stroke="#059669"/><text x="168" y="185" text-anchor="middle" fill="#065f46">Standard</text><text x="168" y="200" font-weight="400" font-size="8" text-anchor="middle" fill="#3f3a2c">Pre-approved, low risk</text><text x="168" y="212" font-weight="400" font-size="8" text-anchor="middle" fill="#3f3a2c">disk swap, dual-corded add</text>

    <rect x="308" y="165" width="260" height="65" rx="4" fill="#fdeec9" stroke="#b45309"/><text x="438" y="185" text-anchor="middle" fill="#b45309">Normal</text><text x="438" y="200" font-weight="400" font-size="8" text-anchor="middle" fill="#8a5010">CAB review required</text><text x="438" y="212" font-weight="400" font-size="8" text-anchor="middle" fill="#8a5010">PDU replace, HVAC PM shutdown</text>

    <rect x="578" y="165" width="260" height="65" rx="4" fill="#fdeaea" stroke="#a4231e" stroke-width="2"/><text x="708" y="185" text-anchor="middle" fill="#8f1f1a">Emergency</text><text x="708" y="200" font-weight="400" font-size="8" text-anchor="middle" fill="#8f1f1a">Expedited, doc concurrent</text><text x="708" y="212" font-weight="400" font-size="8" text-anchor="middle" fill="#8f1f1a">failing UPS module</text>
  </g>

  <!-- CMDB -->
  <rect x="24" y="265" width="852" height="105" rx="6" fill="#eef3f7" stroke="#0e7490" stroke-width="2"/>
  <text x="38" y="288" font-size="12.5" font-weight="700" fill="#0e7490">CMDB — the map that answers the critical question</text>
  <text x="38" y="310" font-size="10" fill="#3f3a2c">The Configuration Management Database records every component and its relationships: which UPS</text>
  <text x="38" y="324" font-size="10" fill="#3f3a2c">feeds which PDU, which PDU feeds which rack, which rack holds which server.</text>
  <rect x="38" y="336" width="500" height="26" rx="4" fill="#0e7490"/>
  <text x="288" y="354" font-size="9.5" font-weight="700" fill="#ffffff" text-anchor="middle">"What's affected, and does it have an alternate path?"</text>

  <rect x="24" y="385" width="852" height="70" rx="6" fill="#fdeaea" stroke="#a4231e" stroke-width="2"/>
  <text x="38" y="408" font-size="12" font-weight="700" fill="#8f1f1a">The #1 cause of data center outages is human, not hardware</text>
  <text x="38" y="430" font-size="10" fill="#5c5748">Uptime Institute studies consistently find uncontrolled changes — not equipment failure — as the leading cause of downtime.</text>

  <defs>
    <marker id="cm" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#1e1b14"/></marker>
  </defs>
</svg>
