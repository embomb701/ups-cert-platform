<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="ui-monospace, Consolas, monospace">
  <rect width="900" height="480" fill="#fbf9f4"/>

  <text x="24" y="32" font-size="18" font-weight="700" fill="#1e1b14">IT Load Is the Cooling Load — the Chilled Water Plant</text>

  <!-- equation -->
  <rect x="24" y="55" width="852" height="45" rx="5" fill="#fff4e8" stroke="#d4802a" stroke-width="1.5"/>
  <text x="38" y="83" font-size="11.5" font-weight="700" fill="#7a3f14">Design cooling load ≈ IT load × (1 + overhead fraction 0.05–0.10) — the PUE target is baked in from the first calculation.</text>

  <!-- chiller selection -->
  <rect x="24" y="115" width="410" height="180" rx="6" fill="#e9f2fb" stroke="#0e7490" stroke-width="2"/>
  <text x="38" y="138" font-size="12.5" font-weight="700" fill="#0e7490">Chiller selection — 4 decisions</text>
  <text x="38" y="160" font-size="10" font-weight="700" fill="#1e1b14">Capacity</text>
  <text x="105" y="160" font-size="9.5" fill="#5c5748">tons of refrigeration, N+1</text>
  <text x="38" y="178" font-size="10" font-weight="700" fill="#1e1b14">Efficiency</text>
  <text x="115" y="178" font-size="9.5" fill="#5c5748">COP + IPLV (part-load)</text>
  <text x="38" y="196" font-size="10" font-weight="700" fill="#1e1b14">Refrigerant</text>
  <text x="130" y="196" font-size="9.5" fill="#5c5748">low-GWP transition</text>
  <text x="38" y="214" font-size="10" font-weight="700" fill="#1e1b14">Condenser</text>
  <text x="120" y="214" font-size="9.5" fill="#5c5748">air vs. water-cooled</text>
  <text x="38" y="238" font-size="9.5" font-weight="700" fill="#1f5a8f">IPLV beats design-point COP for DC</text>
  <text x="38" y="252" font-size="9.5" font-weight="700" fill="#1f5a8f">specs — most operating hours are part-load.</text>
  <text x="38" y="274" font-size="9" fill="#5c5748">Modern centrifugal chillers: COP 6.5–7.5 at design conditions</text>

  <!-- cooling towers -->
  <rect x="459" y="115" width="417" height="180" rx="6" fill="#fdeec9" stroke="#b45309" stroke-width="2"/>
  <text x="473" y="138" font-size="12.5" font-weight="700" fill="#b45309">Cooling towers</text>
  <text x="473" y="160" font-size="10" font-weight="700" fill="#1e1b14">Approach temp</text>
  <text x="580" y="160" font-size="9.5" fill="#5c5748">3–7°F, smaller = pricier tower</text>
  <text x="473" y="178" font-size="10" font-weight="700" fill="#1e1b14">Range</text>
  <text x="530" y="178" font-size="9.5" fill="#5c5748">≈10°F entering vs. leaving</text>
  <text x="473" y="196" font-size="10" font-weight="700" fill="#1e1b14">Drift eliminators</text>
  <text x="600" y="196" font-size="9.5" fill="#5c5748">Legionella control</text>
  <text x="473" y="220" font-size="9.5" font-weight="700" fill="#8a5010">Water treatment (biocide, corrosion/</text>
  <text x="473" y="234" font-size="9.5" font-weight="700" fill="#8a5010">scale inhibitor, pH) is active chemical</text>
  <text x="473" y="248" font-size="9.5" font-weight="700" fill="#8a5010">management, not a set-and-forget system.</text>
  <text x="473" y="270" font-size="9" fill="#5c5748">ASHRAE Guideline 12 + ASHRAE 188 (Legionella) are the references</text>

  <!-- primary-secondary -->
  <text x="24" y="325" font-size="13" font-weight="700" fill="#1e1b14">Primary-Secondary Pumping — the data center standard</text>

  <g font-size="9.5" font-weight="700">
    <rect x="24" y="338" width="180" height="50" rx="4" fill="#eef3f7" stroke="#6d28d9" stroke-width="2"/><text x="34" y="358" fill="#6d28d9">Primary pumps</text><text x="34" y="373" font-weight="400" font-size="8.5" fill="#5c5748">constant flow through chillers</text>

    <rect x="234" y="338" width="180" height="50" rx="4" fill="#eef3f7" stroke="#6d28d9" stroke-width="2"/><text x="244" y="358" fill="#6d28d9">Secondary pumps</text><text x="244" y="373" font-weight="400" font-size="8.5" fill="#5c5748">VSD, variable flow to CRAC/CRAH</text>

    <rect x="444" y="338" width="200" height="50" rx="4" fill="#fdeec9" stroke="#b45309" stroke-width="2"/><text x="454" y="358" fill="#b45309">ΔP sensor (far end)</text><text x="454" y="373" font-weight="400" font-size="8.5" fill="#5c5748">controls secondary VSD speed</text>

    <rect x="664" y="338" width="212" height="50" rx="4" fill="#fdeec9" stroke="#b45309" stroke-width="2"/><text x="674" y="358" fill="#b45309">Bypass valve</text><text x="674" y="373" font-weight="400" font-size="8.5" fill="#5c5748">balances flow at low demand</text>
  </g>
  <g stroke="#1e1b14" stroke-width="1.5" marker-end="url(#cw)">
    <line x1="204" y1="363" x2="232" y2="363"/><line x1="414" y1="363" x2="442" y2="363"/><line x1="644" y1="363" x2="662" y2="363"/>
  </g>

  <rect x="24" y="405" width="852" height="55" rx="5" fill="#ffffff" stroke="#1e1b14" stroke-width="2"/>
  <text x="38" y="428" font-size="10.5" font-weight="700" fill="#1e1b14">Chillers need stable constant flow to avoid freeze-protection trips — this architecture lets individual</text>
  <text x="38" y="444" font-size="10.5" font-weight="700" fill="#1e1b14">chillers isolate for maintenance while the plant serves load: concurrent maintainability at plant level.</text>

  <defs>
    <marker id="cw" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#1e1b14"/>
    </marker>
  </defs>
</svg>
