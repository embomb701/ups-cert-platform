<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="ui-monospace, Consolas, monospace">
  <rect width="900" height="460" fill="#fbf9f4"/>

  <text x="24" y="32" font-size="18" font-weight="700" fill="#1e1b14">The OPR-BOD Chain — Commissioning Starts Before Design, Not After</text>

  <!-- chain -->
  <g font-size="9.5" font-weight="700">
    <rect x="24" y="55" width="205" height="55" rx="4" fill="#e9f4ef" stroke="#059669" stroke-width="2.5"/><text x="126" y="76" text-anchor="middle" fill="#065f46">OPR</text><text x="126" y="92" font-weight="400" font-size="8" text-anchor="middle" fill="#3f3a2c">owner's requirements, pre-design</text>

    <rect x="239" y="55" width="205" height="55" rx="4" fill="#eef3f7" stroke="#0e7490" stroke-width="2"/><text x="341" y="76" text-anchor="middle" fill="#0e7490">BOD</text><text x="341" y="92" font-weight="400" font-size="8" text-anchor="middle" fill="#3f3a2c">design team's response</text>

    <rect x="454" y="55" width="205" height="55" rx="4" fill="#fdeec9" stroke="#b45309" stroke-width="2"/><text x="556" y="76" text-anchor="middle" fill="#b45309">CxA design review</text><text x="556" y="92" font-weight="400" font-size="8" text-anchor="middle" fill="#8a5010">confirms BOD satisfies OPR</text>

    <rect x="669" y="55" width="207" height="55" rx="4" fill="#ffffff" stroke="#7a7256" stroke-width="1.5"/><text x="772" y="76" text-anchor="middle" fill="#1e1b14">Commissioning plan</text><text x="772" y="92" font-weight="400" font-size="8" text-anchor="middle" fill="#5c5748">scope, roles, schedule</text>
  </g>
  <g stroke="#1e1b14" stroke-width="1.5" marker-end="url(#cx)">
    <line x1="229" y1="82" x2="237" y2="82"/><line x1="444" y1="82" x2="452" y2="82"/><line x1="659" y1="82" x2="667" y2="82"/>
  </g>

  <!-- OPR is the benchmark -->
  <rect x="24" y="135" width="852" height="70" rx="6" fill="#e9f4ef" stroke="#059669" stroke-width="2"/>
  <text x="38" y="158" font-size="12" font-weight="700" fill="#065f46">The OPR is the benchmark — not the drawings</text>
  <text x="38" y="180" font-size="10" fill="#3f3a2c">A system that operates correctly per the construction drawings but doesn't satisfy the OPR has NOT been</text>
  <text x="38" y="194" font-size="10" fill="#3f3a2c">successfully commissioned. Everything is measured against what the owner actually needed.</text>

  <!-- cost escalation -->
  <rect x="24" y="220" width="852" height="130" rx="6" fill="#fdeaea" stroke="#a4231e" stroke-width="2"/>
  <text x="38" y="243" font-size="12.5" font-weight="700" fill="#8f1f1a">Why design-phase review is the highest-leverage Cx activity</text>
  <g font-size="9.5" font-weight="700">
    <rect x="38" y="255" width="255" height="55" rx="4" fill="#ffffff" stroke="#a4231e"/><text x="165" y="277" text-anchor="middle" fill="#8f1f1a">Design phase</text><text x="165" y="293" font-weight="400" font-size="9" text-anchor="middle" fill="#5c5748">a drawing markup — cheap</text>

    <rect x="313" y="255" width="255" height="55" rx="4" fill="#fdeec9" stroke="#b45309"/><text x="440" y="277" text-anchor="middle" fill="#b45309">Field discovery</text><text x="440" y="293" font-weight="400" font-size="9" text-anchor="middle" fill="#8a5010">change order — expensive</text>

    <rect x="588" y="255" width="266" height="55" rx="4" fill="#8f1f1a"/><text x="721" y="277" text-anchor="middle" fill="#ffffff">After occupancy</text><text x="721" y="293" font-weight="400" font-size="9" text-anchor="middle" fill="#ffffff">retrofit — most expensive</text>
  </g>
  <text x="38" y="332" font-size="9.5" font-weight="700" fill="#8f1f1a">Same deficiency, three costs — the earlier it's caught, the cheaper it is to fix.</text>

  <rect x="24" y="365" width="852" height="80" rx="6" fill="#ffffff" stroke="#7a7256" stroke-width="1.5"/>
  <text x="38" y="386" font-size="11.5" font-weight="700" fill="#1e1b14">The commissioning plan is a living document</text>
  <text x="38" y="406" font-size="10" fill="#5c5748">Written during design, updated throughout the project as systems and schedules evolve — it names the</text>
  <text x="38" y="420" font-size="10" fill="#5c5748">systems commissioned, team roles, documentation requirements, and schedule.</text>

  <defs>
    <marker id="cx" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#1e1b14"/></marker>
  </defs>
</svg>
