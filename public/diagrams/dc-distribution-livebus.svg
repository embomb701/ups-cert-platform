<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="ui-monospace, Consolas, monospace">
  <rect width="900" height="470" fill="#fbf9f4"/>

  <text x="24" y="32" font-size="18" font-weight="700" fill="#1e1b14">DC Distribution — the Bus Never Goes Dead</text>

  <!-- distribution hierarchy -->
  <g font-size="10" font-weight="700">
    <rect x="24" y="55" width="200" height="46" rx="4" fill="#eef3f7" stroke="#6d28d9" stroke-width="2.5"/><text x="34" y="75" fill="#6d28d9">Rectifier bus</text><text x="34" y="90" font-weight="400" font-size="8.5" fill="#5c5748">-48V, battery strings</text>

    <rect x="264" y="55" width="200" height="46" rx="4" fill="#e9f2fb" stroke="#0e7490" stroke-width="2.5"/><text x="274" y="75" fill="#0e7490">MBDFB</text><text x="274" y="90" font-weight="400" font-size="8.5" fill="#5c5748">main distribution fuse board</text>

    <rect x="504" y="55" width="200" height="46" rx="4" fill="#fdeec9" stroke="#b45309" stroke-width="2.5"/><text x="514" y="75" fill="#b45309">BDFB / BDCBB</text><text x="514" y="90" font-weight="400" font-size="8.5" fill="#5c5748">per-frame fuses/breakers</text>

    <rect x="744" y="55" width="132" height="46" rx="4" fill="#fdeaea" stroke="#a4231e" stroke-width="2.5"/><text x="754" y="75" fill="#a4231e">Equipment</text><text x="754" y="90" font-weight="400" font-size="8.5" fill="#5c5748">frame</text>
  </g>
  <g stroke="#1e1b14" stroke-width="1.5" marker-end="url(#dp)">
    <line x1="224" y1="78" x2="262" y2="78"/><line x1="464" y1="78" x2="502" y2="78"/><line x1="704" y1="78" x2="742" y2="78"/>
  </g>

  <rect x="24" y="115" width="852" height="35" rx="4" fill="#fff4e8" stroke="#d4802a" stroke-width="1.5"/>
  <text x="38" y="137" font-size="10.5" font-weight="700" fill="#7a3f14">Read the one-line MBDFB → BDFB → frame to find exactly which fuse isolates any load — never the main disconnect.</text>

  <!-- live bus rules -->
  <text x="24" y="180" font-size="13" font-weight="700" fill="#1e1b14">Live-bus work rules — the bus is ALWAYS energized while batteries are connected</text>

  <g font-size="10">
    <rect x="24" y="195" width="410" height="34" fill="#fdeaea" stroke="#a4231e" stroke-width="1"/>
    <text x="34" y="216" font-weight="700" fill="#8f1f1a">1. Insulated tools only</text>
    <text x="230" y="216" font-size="9" fill="#5c5748">a bare tool across bus bars = a welder</text>

    <rect x="24" y="229" width="410" height="34" fill="#fdf2f2" stroke="#a4231e" stroke-width="1"/>
    <text x="34" y="250" font-weight="700" fill="#8f1f1a">2. One conductor at a time</text>
    <text x="240" y="250" fill="#5c5748">cover before touching the next</text>

    <rect x="24" y="263" width="410" height="34" fill="#fdeaea" stroke="#a4231e" stroke-width="1"/>
    <text x="34" y="284" font-weight="700" fill="#8f1f1a">3. Remove jewelry</text>
    <text x="180" y="284" fill="#5c5748">rings/watchbands conduct hundreds of amps</text>

    <rect x="444" y="195" width="410" height="34" fill="#fdf2f2" stroke="#a4231e" stroke-width="1"/>
    <text x="454" y="216" font-weight="700" fill="#8f1f1a">4. Verify polarity</text>
    <text x="590" y="216" fill="#5c5748">reversed polarity destroys equipment instantly</text>

    <rect x="444" y="229" width="410" height="34" fill="#fdeaea" stroke="#a4231e" stroke-width="1"/>
    <text x="454" y="250" font-weight="700" fill="#8f1f1a">5. Insulate adjacent conductors</text>
    <text x="700" y="250" fill="#5c5748">mats/caps</text>
  </g>

  <!-- fuse warning -->
  <rect x="444" y="263" width="410" height="34" rx="0" fill="#fdeec9" stroke="#b45309" stroke-width="1.5"/>
  <text x="454" y="284" font-size="9.5" font-weight="700" fill="#7a3f14">DC fuses ≠ AC fuses — DC arcs never self-extinguish at zero</text>

  <!-- diagnosis callouts -->
  <rect x="24" y="320" width="410" height="130" rx="6" fill="#ffffff" stroke="#1e1b14" stroke-width="2"/>
  <text x="38" y="343" font-size="12" font-weight="700" fill="#1e1b14">Blown fuse diagnosis</text>
  <text x="38" y="365" font-size="10" fill="#5c5748">Clears once, then runs normal = transient</text>
  <text x="38" y="379" font-size="10" fill="#5c5748">(cold-start surge, lightning).</text>
  <text x="38" y="401" font-size="10" font-weight="700" fill="#7a3f14">Clears repeatedly = real overload or short —</text>
  <text x="38" y="415" font-size="10" font-weight="700" fill="#7a3f14">measure load resistance before replacing again.</text>
  <text x="38" y="437" font-size="9" fill="#5c5748">Fuse at 125% of maximum expected load current.</text>

  <rect x="459" y="320" width="417" height="130" rx="6" fill="#fdeaea" stroke="#a4231e" stroke-width="2"/>
  <text x="473" y="343" font-size="12" font-weight="700" fill="#8f1f1a">A watchband across the bus</text>
  <text x="473" y="365" font-size="10" fill="#5c5748">54V DC with battery capacity behind it drives</text>
  <text x="473" y="379" font-size="10" fill="#5c5748">hundreds to thousands of amps through jewelry</text>
  <text x="473" y="393" font-size="10" fill="#5c5748">with NO fuse protection between the bus and</text>
  <text x="473" y="407" font-size="10" fill="#5c5748">the contact point.</text>
  <text x="473" y="429" font-size="10" font-weight="700" fill="#8f1f1a">Severe, instantaneous arc burn.</text>
  <defs>
    <marker id="dp" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#1e1b14"/>
    </marker>
  </defs>
</svg>
