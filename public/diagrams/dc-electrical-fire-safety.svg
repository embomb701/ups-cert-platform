<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="ui-monospace, Consolas, monospace">
  <rect width="900" height="480" fill="#fbf9f4"/>

  <text x="24" y="32" font-size="18" font-weight="700" fill="#1e1b14">Electrical &amp; Fire Safety — Three Codes the Ops Manager Owns</text>

  <!-- arc flash -->
  <rect x="24" y="55" width="410" height="150" rx="6" fill="#fdeaea" stroke="#a4231e" stroke-width="2"/>
  <text x="38" y="78" font-size="12.5" font-weight="700" fill="#8f1f1a">NFPA 70E — arc flash PPE categories</text>
  <g font-size="9" font-weight="700">
    <rect x="38" y="90" width="90" height="24" rx="4" fill="#7a7256"/><text x="83" y="106" text-anchor="middle" fill="#ffffff">Cat 1: 4 cal</text>
    <rect x="134" y="90" width="90" height="24" rx="4" fill="#b45309"/><text x="179" y="106" text-anchor="middle" fill="#ffffff">Cat 2: 8 cal</text>
    <rect x="230" y="90" width="90" height="24" rx="4" fill="#8f1f1a"/><text x="275" y="106" text-anchor="middle" fill="#ffffff">Cat 3: 25 cal</text>
    <rect x="326" y="90" width="88" height="24" rx="4" fill="#5c1a17"/><text x="370" y="106" text-anchor="middle" fill="#ffffff">Cat 4: 40+ cal</text>
  </g>
  <text x="38" y="136" font-size="9.5" fill="#5c5748">Incident energy at each working distance</text>
  <text x="38" y="150" font-size="9.5" fill="#5c5748">determines the category — labeled, trained,</text>
  <text x="38" y="164" font-size="9.5" fill="#5c5748">PPE inspected and serviceable.</text>
  <text x="38" y="186" font-size="9" font-weight="700" fill="#8f1f1a">Category is calculated, not chosen at the panel.</text>

  <!-- fire suppression -->
  <rect x="459" y="55" width="417" height="150" rx="6" fill="#fdeec9" stroke="#b45309" stroke-width="2"/>
  <text x="473" y="78" font-size="12.5" font-weight="700" fill="#b45309">NFPA 75/76 — fire suppression</text>
  <text x="473" y="100" font-size="9.5" fill="#3f3a2c">Clean agent (FM-200, NOVEC 1230) —</text>
  <text x="473" y="114" font-size="9.5" fill="#3f3a2c">no residue, safe for electronics.</text>
  <text x="473" y="132" font-size="9.5" fill="#3f3a2c">Inert gas (IG-541/Inergen) — reduces</text>
  <text x="473" y="146" font-size="9.5" fill="#3f3a2c">oxygen below combustion threshold.</text>
  <rect x="473" y="158" width="380" height="26" rx="4" fill="#b45309"/>
  <text x="663" y="176" font-size="9.5" font-weight="700" fill="#ffffff" text-anchor="middle">Know the abort procedure — always</text>

  <!-- NFPA 110 -->
  <rect x="24" y="220" width="852" height="115" rx="6" fill="#eef3f7" stroke="#0e7490" stroke-width="2"/>
  <text x="38" y="243" font-size="12.5" font-weight="700" fill="#0e7490">NFPA 110 — emergency power testing requirements</text>
  <g font-size="9.5" font-weight="700">
    <rect x="38" y="255" width="260" height="50" rx="4" fill="#ffffff" stroke="#0e7490"/><text x="168" y="273" text-anchor="middle" fill="#0e7490">Monthly generator</text><text x="168" y="288" font-weight="400" font-size="8" text-anchor="middle" fill="#3f3a2c">load exercise (or annual load bank)</text>

    <rect x="308" y="255" width="260" height="50" rx="4" fill="#ffffff" stroke="#0e7490"/><text x="438" y="273" text-anchor="middle" fill="#0e7490">Monthly ATS</text><text x="438" y="288" font-weight="400" font-size="8" text-anchor="middle" fill="#3f3a2c">operation verification</text>

    <rect x="578" y="255" width="260" height="50" rx="4" fill="#ffffff" stroke="#0e7490"/><text x="708" y="273" text-anchor="middle" fill="#0e7490">Annual fuel test</text><text x="708" y="288" font-weight="400" font-size="8" text-anchor="middle" fill="#3f3a2c">quality + documentation</text>
  </g>

  <rect x="24" y="350" width="852" height="70" rx="6" fill="#fdeaea" stroke="#a4231e" stroke-width="2"/>
  <text x="38" y="373" font-size="12" font-weight="700" fill="#8f1f1a">A false-alarm discharge is a real incident</text>
  <text x="38" y="395" font-size="10" fill="#5c5748">Accidental suppression release evacuates the room, requires hours of cleanup and recharge, and can</text>
  <text x="38" y="409" font-size="10" fill="#5c5748">injure personnel — abort procedure knowledge is a daily-relevant skill, not a rarely-used footnote.</text>

  <rect x="24" y="430" width="852" height="38" rx="5" fill="#ffffff" stroke="#1e1b14" stroke-width="2"/>
  <text x="38" y="454" font-size="10" font-weight="700" fill="#1e1b14">Missing NFPA 110 documentation is a compliance liability that can void insurance coverage for generator-related incidents.</text>
</svg>
