<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="ui-monospace, Consolas, monospace">
  <rect width="900" height="470" fill="#fbf9f4"/>

  <text x="24" y="32" font-size="18" font-weight="700" fill="#1e1b14">Every IT Watt Is a Heat Watt — CRAC/CRAH and the Airflow Circuit</text>
  <text x="24" y="52" font-size="12" fill="#5c5748">Cooling is a closed loop: cold air out, hot air back — every gap in the loop is lost capacity.</text>

  <!-- airflow chain -->
  <g font-size="10" font-weight="700">
    <rect x="24" y="64" width="159" height="62" rx="4" fill="#eef3f7" stroke="#6d28d9" stroke-width="2"/><text x="34" y="84" fill="#6d28d9">CRAC / CRAH</text><text x="34" y="99" font-weight="400" font-size="8.5" fill="#4a2a9e">discharges cold air</text><text x="34" y="111" font-weight="400" font-size="8.5" fill="#4a2a9e">down into the space</text>

    <rect x="197" y="64" width="159" height="62" rx="4" fill="#eef3f7" stroke="#7a7256" stroke-width="2"/><text x="207" y="84" fill="#5c5748">Raised-floor plenum</text><text x="207" y="99" font-weight="400" font-size="8.5" fill="#7a7256">pressurizes the space</text><text x="207" y="111" font-weight="400" font-size="8.5" fill="#7a7256">under the floor</text>

    <rect x="370" y="64" width="159" height="62" rx="4" fill="#e9f2fb" stroke="#0e7490" stroke-width="2"/><text x="380" y="84" fill="#0e7490">Perforated tiles</text><text x="380" y="99" font-weight="400" font-size="8.5" fill="#4a6d8a">cold-aisle delivery —</text><text x="380" y="111" font-weight="400" font-size="8.5" fill="#4a6d8a">only above racks</text>

    <rect x="543" y="64" width="159" height="62" rx="4" fill="#fdeec9" stroke="#b45309" stroke-width="2"/><text x="553" y="84" fill="#b45309">Racks</text><text x="553" y="99" font-weight="400" font-size="8.5" fill="#8a5010">cold intake at the front,</text><text x="553" y="111" font-weight="400" font-size="8.5" fill="#8a5010">hot exhaust at the back</text>

    <rect x="716" y="64" width="159" height="62" rx="4" fill="#fdeaea" stroke="#a4231e" stroke-width="2.5"/><text x="726" y="84" fill="#8f1f1a">Hot aisle</text><text x="726" y="99" font-weight="400" font-size="8.5" fill="#8f1f1a">exhaust returns up</text><text x="726" y="111" font-weight="400" font-size="8.5" fill="#8f1f1a">to the CRAC/CRAH</text>
  </g>
  <g stroke="#1e1b14" stroke-width="1.5" marker-end="url(#du)">
    <line x1="183" y1="95" x2="195" y2="95"/><line x1="356" y1="95" x2="368" y2="95"/>
    <line x1="529" y1="95" x2="541" y2="95"/><line x1="702" y1="95" x2="714" y2="95"/>
  </g>

  <!-- callout boxes -->
  <rect x="24" y="140" width="410" height="105" rx="6" fill="#fdeaea" stroke="#a4231e" stroke-width="2"/>
  <text x="38" y="163" font-size="12" font-weight="700" fill="#8f1f1a">Twin airflow sins</text>
  <text x="38" y="185" font-size="10" fill="#5c5748">BYPASS — cold air returns to the</text>
  <text x="38" y="199" font-size="10" fill="#5c5748">CRAH without touching a server.</text>
  <text x="38" y="220" font-size="10" fill="#5c5748">RECIRCULATION — hot exhaust</text>
  <text x="38" y="234" font-size="10" fill="#5c5748">re-enters a server's cold intake.</text>

  <rect x="459" y="140" width="417" height="105" rx="6" fill="#eef3f7" stroke="#6d28d9" stroke-width="2"/>
  <text x="473" y="163" font-size="12" font-weight="700" fill="#6d28d9">CRAC vs. CRAH</text>
  <text x="473" y="185" font-size="10" fill="#5c5748">CRAC — DX refrigeration in the cabinet</text>
  <text x="473" y="199" font-size="10" fill="#5c5748">(compressors, its own refrigerant circuit).</text>
  <text x="473" y="220" font-size="10" fill="#5c5748">CRAH — chilled-water coil fed by a central</text>
  <text x="473" y="234" font-size="9.5" font-weight="700" fill="#4a2a9e">plant, no compressors of its own.</text>

  <rect x="24" y="265" width="852" height="140" rx="6" fill="#ffffff" stroke="#1e1b14" stroke-width="2"/>
  <text x="38" y="288" font-size="12.5" font-weight="700" fill="#1e1b14">Diagnostic: rack overheats in a room full of cold air</text>
  <text x="38" y="311" font-size="10.5" fill="#5c5748">Almost always an airflow-path problem, not a capacity problem — tiles in the hot aisle (a classic</text>
  <text x="38" y="327" font-size="10.5" fill="#5c5748">misconfiguration cooling nobody), underfloor cable dams starving racks like crushed ducts.</text>
  <text x="38" y="351" font-size="10.5" font-weight="700" fill="#b45309">Fleet tuning: one CRAH humidifying while its neighbor dehumidifies wastes capacity invisibly —</text>
  <text x="38" y="367" font-size="10.5" font-weight="700" fill="#b45309">units sharing one air mass need aligned setpoints/deadbands.</text>
  <text x="38" y="390" font-size="9.5" fill="#5c5748">Cooling is ~1/3 of a facility's power bill — co-equal with the power chain in this job.</text>

  <defs>
    <marker id="du" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#1e1b14"/></marker>
  </defs>
</svg>
