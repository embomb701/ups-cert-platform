<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="ui-monospace, Consolas, monospace">
  <rect width="900" height="460" fill="#fbf9f4"/>

  <text x="24" y="32" font-size="18" font-weight="700" fill="#1e1b14">A Data Center Watches Itself Through Three Stacks</text>

  <rect x="24" y="60" width="270" height="160" rx="6" fill="#fdeaea" stroke="#a4231e" stroke-width="2.5"/>
  <text x="38" y="85" font-size="13" font-weight="700" fill="#a4231e">EPMS</text>
  <text x="38" y="102" font-size="9.5" fill="#5c5748">Electrical Power Monitoring</text>
  <text x="38" y="125" font-size="10" fill="#1e1b14">Utility, switchgear, generators,</text>
  <text x="38" y="139" font-size="10" fill="#1e1b14">UPS, PDUs, busways, branch</text>
  <text x="38" y="153" font-size="10" fill="#1e1b14">circuits — live one-lines, per-</text>
  <text x="38" y="167" font-size="10" fill="#1e1b14">device metering, alarm streams.</text>
  <text x="38" y="190" font-size="9.5" font-weight="700" fill="#8f1f1a">Module 7's drawings, live.</text>
  <text x="38" y="204" font-size="9.5" font-weight="700" fill="#8f1f1a">Walk the chain on glass.</text>

  <rect x="315" y="60" width="270" height="160" rx="6" fill="#e9f2fb" stroke="#0e7490" stroke-width="2.5"/>
  <text x="329" y="85" font-size="13" font-weight="700" fill="#0e7490">BMS</text>
  <text x="329" y="102" font-size="9.5" fill="#5c5748">Building Management (= BAS)</text>
  <text x="329" y="125" font-size="10" fill="#1e1b14">Runs and monitors the</text>
  <text x="329" y="139" font-size="10" fill="#1e1b14">mechanical plant: chillers,</text>
  <text x="329" y="153" font-size="10" fill="#1e1b14">CRAHs, pumps, towers,</text>
  <text x="329" y="167" font-size="10" fill="#1e1b14">dampers, sensors.</text>
  <text x="329" y="190" font-size="9.5" font-weight="700" fill="#1f5a8f">Command-vs-reality: the</text>
  <text x="329" y="204" font-size="9.5" font-weight="700" fill="#1f5a8f">graphic says open — is it?</text>

  <rect x="606" y="60" width="270" height="160" rx="6" fill="#eef3f7" stroke="#6d28d9" stroke-width="2.5"/>
  <text x="620" y="85" font-size="13" font-weight="700" fill="#6d28d9">DCIM</text>
  <text x="620" y="102" font-size="9.5" fill="#5c5748">Data Center Infra. Management</text>
  <text x="620" y="125" font-size="10" fill="#1e1b14">Sits above both, plus IT layer:</text>
  <text x="620" y="139" font-size="10" fill="#1e1b14">rack-level capacity, asset</text>
  <text x="620" y="153" font-size="10" fill="#1e1b14">tracking, environmental</text>
  <text x="620" y="167" font-size="10" fill="#1e1b14">sensors, planning views.</text>
  <text x="620" y="190" font-size="9.5" font-weight="700" fill="#4a2a9e">Decides where the next</text>
  <text x="620" y="204" font-size="9.5" font-weight="700" fill="#4a2a9e">server lands.</text>

  <!-- sensor truth callout -->
  <rect x="24" y="240" width="410" height="130" rx="6" fill="#fdeec9" stroke="#b45309" stroke-width="2"/>
  <text x="38" y="263" font-size="12.5" font-weight="700" fill="#b45309">Sensor truth is the eternal law</text>
  <text x="38" y="285" font-size="10" fill="#5c5748">A branch-circuit CT reading garbage, a</text>
  <text x="38" y="299" font-size="10" fill="#5c5748">stuck damper feedback, a drifted probe —</text>
  <text x="38" y="313" font-size="10" fill="#5c5748">each corrupts the decisions and alarms</text>
  <text x="38" y="327" font-size="10" fill="#5c5748">built on them.</text>
  <text x="38" y="350" font-size="9.5" font-weight="700" fill="#8a5010">Meters beat databases — verify physically.</text>

  <!-- working relationship -->
  <rect x="459" y="240" width="417" height="130" rx="6" fill="#ffffff" stroke="#1e1b14" stroke-width="2"/>
  <text x="473" y="263" font-size="12.5" font-weight="700" fill="#1e1b14">Your working relationship with the stacks</text>
  <text x="473" y="286" font-size="10" font-weight="700" fill="#a4231e">READ</text>
  <text x="510" y="286" font-size="10" fill="#5c5748">constantly — rounds increasingly happen on glass</text>
  <text x="473" y="305" font-size="10" font-weight="700" fill="#0e7490">VERIFY</text>
  <text x="520" y="305" font-size="10" fill="#5c5748">physically — walk the floor, meters in hand</text>
  <text x="473" y="324" font-size="10" font-weight="700" fill="#6d28d9">FEED</text>
  <text x="505" y="324" font-size="10" fill="#5c5748">honestly — work orders and readings become history</text>
  <text x="473" y="350" font-size="9.5" fill="#5c5748">the next tech's diagnosis leans on</text>

  <rect x="24" y="390" width="852" height="55" rx="5" fill="#fff4e8" stroke="#d4802a" stroke-width="1.5"/>
  <text x="38" y="412" font-size="10.5" font-weight="700" fill="#7a3f14">The EPMS live one-line's greatest diagnostic value: showing which stage of the power chain</text>
  <text x="38" y="428" font-size="10.5" font-weight="700" fill="#7a3f14">the abnormality entered — utility → gear → generator/ATS → UPS → distribution → floor.</text>
</svg>
