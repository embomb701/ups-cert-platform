<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="ui-monospace, Consolas, monospace">
  <rect width="900" height="480" fill="#fbf9f4"/>

  <text x="24" y="32" font-size="18" font-weight="700" fill="#1e1b14">DCFC Architecture — the UPS Power Chain, Aimed at a Vehicle</text>

  <!-- power chain -->
  <g font-size="9.5" font-weight="700">
    <rect x="24" y="55" width="195" height="55" rx="4" fill="#eef3f7" stroke="#0e7490" stroke-width="2"/><text x="121" y="78" text-anchor="middle" fill="#0e7490">3-phase AC in</text><text x="121" y="94" font-weight="400" font-size="8.5" text-anchor="middle" fill="#5c5748">480V (commercial)</text>

    <rect x="239" y="55" width="195" height="55" rx="4" fill="#fdeec9" stroke="#b45309" stroke-width="2"/><text x="336" y="78" text-anchor="middle" fill="#b45309">PFC / Rectifier</text><text x="336" y="94" font-weight="400" font-size="8.5" text-anchor="middle" fill="#5c5748">AC → intermediate DC bus</text>

    <rect x="454" y="55" width="195" height="55" rx="4" fill="#fdeec9" stroke="#b45309" stroke-width="2"/><text x="551" y="78" text-anchor="middle" fill="#b45309">DC bus</text><text x="551" y="94" font-weight="400" font-size="8.5" text-anchor="middle" fill="#5c5748">650–800V DC internal</text>

    <rect x="669" y="55" width="207" height="55" rx="4" fill="#e9f4ef" stroke="#16a34a" stroke-width="2.5"/><text x="772" y="78" text-anchor="middle" fill="#166534">Isolated DC-DC</text><text x="772" y="94" font-weight="400" font-size="8.5" text-anchor="middle" fill="#5c5748">150–1000V to vehicle</text>
  </g>
  <g stroke="#1e1b14" stroke-width="1.5" marker-end="url(#dc)">
    <line x1="219" y1="82" x2="237" y2="82"/><line x1="434" y1="82" x2="452" y2="82"/><line x1="649" y1="82" x2="667" y2="82"/>
  </g>
  <text x="24" y="128" font-size="9.5" font-weight="700" fill="#8f1f1a">Same DC-bus-capacitor discipline from the UPS course applies here, voltage-scaled — verify discharge before touch.</text>

  <!-- modular bricks -->
  <rect x="24" y="150" width="410" height="150" rx="6" fill="#e9f4ef" stroke="#16a34a" stroke-width="2"/>
  <text x="38" y="173" font-size="12.5" font-weight="700" fill="#166534">Modular power module "bricks"</text>
  <text x="38" y="195" font-size="9.5" fill="#3f3a2c">10–50 kW modules paralleled to reach</text>
  <text x="38" y="209" font-size="9.5" fill="#3f3a2c">rated output — 180 kW = six 30 kW bricks.</text>
  <rect x="38" y="221" width="358" height="46" rx="4" fill="#166534"/>
  <text x="217" y="240" font-size="9.5" font-weight="700" fill="#ffffff" text-anchor="middle">Sick-brick pattern: one failed module</text>
  <text x="217" y="256" font-size="9.5" font-weight="700" fill="#ffffff" text-anchor="middle">derates output, doesn't kill the charger</text>
  <text x="38" y="284" font-size="9" fill="#3f3a2c">Same reasoning as UPS N+1 — check per-module status before opening the cabinet.</text>

  <!-- cooling -->
  <rect x="459" y="150" width="417" height="150" rx="6" fill="#fdeec9" stroke="#b45309" stroke-width="2"/>
  <text x="473" y="173" font-size="12.5" font-weight="700" fill="#b45309">Cooling — the other module story</text>
  <text x="473" y="195" font-size="9.5" fill="#3f3a2c">Air-cooled at lower power; liquid-cooling</text>
  <text x="473" y="209" font-size="9.5" fill="#3f3a2c">loops standard above ~150 kW, universal at 350 kW+.</text>
  <rect x="473" y="221" width="230" height="26" rx="4" fill="#b45309"/>
  <text x="588" y="238" font-size="9.5" font-weight="700" fill="#ffffff" text-anchor="middle">Target inlet coolant &lt;40°C</text>
  <text x="473" y="266" font-size="9.5" font-weight="700" fill="#8a5010">Pump failure, coolant leaks, restricted flow,</text>
  <text x="473" y="280" font-size="9.5" font-weight="700" fill="#8a5010">or air in the loop all cause derating.</text>

  <rect x="24" y="310" width="852" height="75" rx="6" fill="#ffffff" stroke="#7a7256" stroke-width="1.5"/>
  <text x="38" y="332" font-size="11.5" font-weight="700" fill="#1e1b14">Elevated inlet temp is a symptom, not the cause</text>
  <text x="38" y="352" font-size="10" fill="#5c5748">55°C at the inlet against a 40°C spec means investigate the cooling loop — pump, heat exchanger,</text>
  <text x="38" y="368" font-size="10" fill="#5c5748">coolant level, glycol mix — before touching the power modules.</text>

  <rect x="24" y="393" width="852" height="46" rx="5" fill="#fff4e8" stroke="#d4802a" stroke-width="1.5"/>
  <text x="38" y="421" font-size="10.5" font-weight="700" fill="#7a3f14">Electronics die of heat — the cooling path deserves the first walkaround check, every time, on every course.</text>

  <defs>
    <marker id="dc" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#1e1b14"/></marker>
  </defs>
</svg>
