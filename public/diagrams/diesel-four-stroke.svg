<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="ui-monospace, Consolas, monospace">
  <rect width="900" height="460" fill="#fbf9f4"/>

  <text x="24" y="32" font-size="18" font-weight="700" fill="#1e1b14">Compression Ignition — No Spark Plug Anywhere</text>
  <text x="24" y="52" font-size="12" fill="#5c5748">Four strokes, one ignition source: heat from compression alone.</text>

  <!-- four strokes -->
  <g font-size="12" font-weight="700">
    <rect x="24" y="66" width="204" height="90" rx="6" fill="#e9f2fb" stroke="#0e7490" stroke-width="2.5"/>
    <text x="38" y="90" fill="#0e7490">1. INTAKE</text>
    <text x="38" y="112" font-weight="400" font-size="9.5" fill="#4a6d8a">Piston moves down —</text>
    <text x="38" y="126" font-weight="400" font-size="9.5" fill="#4a6d8a">air only, no fuel yet.</text>
    <text x="38" y="144" font-weight="400" font-size="9" fill="#7a7256">Valve draws air in.</text>

    <rect x="243" y="66" width="204" height="90" rx="6" fill="#fdeec9" stroke="#b45309" stroke-width="2.5"/>
    <text x="257" y="90" fill="#b45309">2. COMPRESSION</text>
    <text x="257" y="112" font-weight="400" font-size="9.5" fill="#8a5010">Piston moves up — air</text>
    <text x="257" y="126" font-weight="400" font-size="9.5" fill="#8a5010">compressed 15–20:1.</text>
    <text x="257" y="144" font-weight="400" font-size="9" fill="#8a5010">Air temperature hits ≈1,000°F.</text>

    <rect x="462" y="66" width="204" height="90" rx="6" fill="#fdeaea" stroke="#a4231e" stroke-width="2.5"/>
    <text x="476" y="90" fill="#a4231e">3. POWER</text>
    <text x="476" y="112" font-weight="400" font-size="9.5" fill="#8f1f1a">Fuel injected into the hot,</text>
    <text x="476" y="126" font-weight="400" font-size="9.5" fill="#8f1f1a">compressed air — ignites itself.</text>
    <text x="476" y="144" font-weight="400" font-size="9" fill="#8f1f1a">No spark plug anywhere in the process.</text>

    <rect x="681" y="66" width="195" height="90" rx="6" fill="#eef3f7" stroke="#2a5f8f" stroke-width="2.5"/>
    <text x="695" y="90" fill="#2a5f8f">4. EXHAUST</text>
    <text x="695" y="112" font-weight="400" font-size="9.5" fill="#4a6d8a">Piston moves up again —</text>
    <text x="695" y="126" font-weight="400" font-size="9.5" fill="#4a6d8a">spent gases pushed out.</text>
    <text x="695" y="144" font-weight="400" font-size="9" fill="#7a7256">Valve opens to the exhaust manifold.</text>
  </g>
  <g stroke="#1e1b14" stroke-width="1.5" marker-end="url(#ad)">
    <line x1="228" y1="111" x2="241" y2="111"/><line x1="447" y1="111" x2="460" y2="111"/><line x1="666" y1="111" x2="679" y2="111"/>
  </g>

  <rect x="24" y="168" width="852" height="30" rx="4" fill="#fff4e8" stroke="#d4802a" stroke-width="1.2"/>
  <text x="38" y="188" font-size="10.5" font-weight="700" fill="#7a3f14">Two revolutions per power stroke — cylinders are phased so the crankshaft gets continuous power.</text>

  <!-- 3 things diesel needs -->
  <rect x="24" y="212" width="410" height="150" rx="6" fill="#ffffff" stroke="#1e1b14" stroke-width="2"/>
  <text x="38" y="236" font-size="13" font-weight="700" fill="#1e1b14">Cranks but won&apos;t fire — 3 things diesel needs</text>
  <text x="38" y="259" font-size="11" font-weight="700" fill="#a4231e">1. FUEL — clean, timed, atomized (check first)</text>
  <text x="38" y="279" font-size="11" font-weight="700" fill="#0e7490">2. AIR — clean, abundant (filters, turbo)</text>
  <text x="38" y="299" font-size="11" font-weight="700" fill="#b45309">3. COMPRESSION — rings, valves (leak-down test)</text>
  <text x="38" y="323" font-size="9.5" fill="#5c5748">Interrogation order: fuel (most common), then air,</text>
  <text x="38" y="337" font-size="9.5" fill="#5c5748">then compression — hinted at by white smoke/blow-by.</text>

  <!-- turbo callout -->
  <rect x="459" y="212" width="417" height="150" rx="6" fill="#fdeaea" stroke="#a4231e" stroke-width="2"/>
  <text x="473" y="236" font-size="13" font-weight="700" fill="#8f1f1a">Turbocharger discipline</text>
  <text x="473" y="257" font-size="10.5" fill="#5c5748">Exhaust-driven compressor force-feeding the</text>
  <text x="473" y="272" font-size="10.5" fill="#5c5748">cylinders — listen for the healthy whistle,</text>
  <text x="473" y="287" font-size="10.5" fill="#5c5748">watch for oil leaks at the shaft.</text>
  <text x="473" y="309" font-size="10.5" font-weight="700" fill="#8f1f1a">Never shut down a worked turbo without a</text>
  <text x="473" y="324" font-size="10.5" font-weight="700" fill="#8f1f1a">cooldown idle — its bearings cook in stagnant oil.</text>
  <text x="473" y="345" font-size="9.5" fill="#5c5748">Oil pressure right after start is vital sign #1.</text>

  <rect x="24" y="380" width="852" height="60" rx="6" fill="#fff4e8" stroke="#d4802a" stroke-width="1.5"/>
  <text x="38" y="405" font-size="10.5" font-weight="700" fill="#7a3f14">Fuel, air, and compression are the only three inputs the engine needs — every hard-start</text>
  <text x="38" y="422" font-size="10.5" font-weight="700" fill="#7a3f14">diagnosis reduces to ruling these three in or out, in that order.</text>

  <defs>
    <marker id="ad" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#1e1b14"/>
    </marker>
  </defs>
</svg>
