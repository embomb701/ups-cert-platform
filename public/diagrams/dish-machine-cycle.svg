<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="ui-monospace, Consolas, monospace">
  <rect width="900" height="480" fill="#fbf9f4"/>

  <text x="24" y="32" font-size="18" font-weight="700" fill="#1e1b14">Commercial Dish Machine — Wash Cycle &amp; Sanitizing Method</text>
  <text x="24" y="52" font-size="12" fill="#5c5748">High-temp problems are heat problems. Low-temp problems are chemistry problems.</text>

  <!-- wash cycle chain -->
  <g font-size="10" font-weight="700">
    <rect x="24" y="68" width="195" height="50" rx="4" fill="#eef3f7" stroke="#2a5f8f" stroke-width="2"/><text x="34" y="90" fill="#2a5f8f">Rack loaded</text><text x="34" y="105" font-weight="400" font-size="8.5" fill="#4a6d8a">plates or conveyor track</text>

    <rect x="243" y="68" width="195" height="50" rx="4" fill="#eef3f7" stroke="#2a5f8f" stroke-width="2"/><text x="253" y="90" fill="#2a5f8f">Wash</text><text x="253" y="105" font-weight="400" font-size="8.5" fill="#4a6d8a">upper &amp; lower arms recirculate</text><text x="253" y="116" font-weight="400" font-size="8.5" fill="#4a6d8a">heated detergent water via pump</text>

    <rect x="462" y="68" width="195" height="50" rx="4" fill="#fff4e8" stroke="#7a3f14" stroke-width="2"/><text x="472" y="90" fill="#7a3f14">Final rinse</text><text x="472" y="105" font-weight="400" font-size="8.5" fill="#8a5010">fresh water in — every cycle,</text><text x="472" y="116" font-weight="400" font-size="8.5" fill="#8a5010">never recirculated</text>

    <rect x="681" y="68" width="195" height="50" rx="4" fill="#fdeec9" stroke="#7a3f14" stroke-width="2.5"/><text x="691" y="90" fill="#7a3f14">Sanitize</text><text x="691" y="105" font-weight="400" font-size="8.5" fill="#8a5010">heat (high-temp) or</text><text x="691" y="116" font-weight="400" font-size="8.5" fill="#8a5010">chemical (low-temp)</text>
  </g>
  <g stroke="#1e1b14" stroke-width="1.5" marker-end="url(#dm)">
    <line x1="219" y1="93" x2="241" y2="93"/><line x1="438" y1="93" x2="460" y2="93"/><line x1="657" y1="93" x2="679" y2="93"/>
  </g>

  <!-- high-temp panel -->
  <rect x="24" y="135" width="410" height="195" rx="6" fill="#fdeec9" stroke="#7a3f14" stroke-width="2"/>
  <text x="38" y="158" font-size="13" font-weight="700" fill="#7a3f14">HIGH-TEMP</text>
  <line x1="38" y1="168" x2="420" y2="168" stroke="#7a3f14" stroke-width="1"/>
  <text x="38" y="190" font-size="9.5" fill="#5c5748">Sanitizer:</text><text x="130" y="190" font-size="10" font-weight="700" fill="#1e1b14">180°F final rinse (160°F min at the dish)</text>
  <text x="38" y="211" font-size="9.5" fill="#5c5748">Key hardware:</text><text x="130" y="211" font-size="10" font-weight="700" fill="#1e1b14">Booster heater</text>
  <text x="38" y="232" font-size="9.5" fill="#5c5748">Verification:</text><text x="130" y="232" font-size="10" font-weight="700" fill="#1e1b14">Thermolabel or max-reg thermometer</text>
  <text x="38" y="253" font-size="9.5" fill="#5c5748">Classic failure:</text><text x="130" y="253" font-size="10" font-weight="700" fill="#1e1b14">Booster heater underperforms</text>
  <text x="38" y="280" font-size="9.5" fill="#7a3f14">High-temp problems are heat problems —</text>
  <text x="38" y="295" font-size="9.5" fill="#7a3f14">chase the booster and the incoming supply temperature first.</text>
  <text x="38" y="316" font-size="9" fill="#8a5010">A cold pre-rinse feed drags the booster below its recovery capacity.</text>

  <!-- low-temp panel -->
  <rect x="459" y="135" width="417" height="195" rx="6" fill="#e9f2fb" stroke="#2a5f8f" stroke-width="2"/>
  <text x="473" y="158" font-size="13" font-weight="700" fill="#2a5f8f">LOW-TEMP (chemical)</text>
  <line x1="473" y1="168" x2="862" y2="168" stroke="#2a5f8f" stroke-width="1"/>
  <text x="473" y="190" font-size="9.5" fill="#5c5748">Sanitizer:</text><text x="565" y="190" font-size="10" font-weight="700" fill="#1e1b14">50–100 ppm chlorine, 120–140°F rinse</text>
  <text x="473" y="211" font-size="9.5" fill="#5c5748">Key hardware:</text><text x="565" y="211" font-size="10" font-weight="700" fill="#1e1b14">Sanitizer dosing pump</text>
  <text x="473" y="232" font-size="9.5" fill="#5c5748">Verification:</text><text x="565" y="232" font-size="10" font-weight="700" fill="#1e1b14">Chlorine test strips</text>
  <text x="473" y="253" font-size="9.5" fill="#5c5748">Classic failure:</text><text x="565" y="253" font-size="10" font-weight="700" fill="#1e1b14">Empty product / airlocked dosing pump</text>
  <text x="473" y="280" font-size="9.5" fill="#1f5a8f">Low-temp problems are chemistry problems —</text>
  <text x="473" y="295" font-size="9.5" fill="#1f5a8f">verify concentration with test strips before suspecting the machine.</text>
  <text x="473" y="316" font-size="9" fill="#4a6d8a">A dosing pump that primes but doesn't feed is usually air-locked, not empty.</text>

  <rect x="24" y="345" width="852" height="75" rx="6" fill="#fff4e8" stroke="#d4802a" stroke-width="1.5"/>
  <text x="38" y="370" font-size="11.5" font-weight="700" fill="#7a3f14">Sort every complaint into one of three buckets: results · cycle · leak/mechanical</text>
  <text x="38" y="392" font-size="10" fill="#5c5748">Spots and filming point to results (sanitizer/water quality); a machine that won't start or complete a</text>
  <text x="38" y="406" font-size="10" fill="#5c5748">cycle points to controls; standing water or dripping points to mechanical — diagnose in that order.</text>

  <defs>
    <marker id="dm" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#1e1b14"/>
    </marker>
  </defs>
</svg>
