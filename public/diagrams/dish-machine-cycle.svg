<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="ui-monospace, Consolas, monospace">
  <rect width="900" height="480" fill="#fbf9f4"/>

  <text x="24" y="32" font-size="18" font-weight="700" fill="#1e1b14">Commercial Dish Machine — Anatomy &amp; Sanitizing</text>

  <!-- Machine cutaway -->
  <rect x="60" y="80" width="340" height="330" rx="6" fill="#ffffff" stroke="#1e1b14" stroke-width="4"/>
  <!-- hood -->
  <path d="M 60 80 L 60 40 L 400 40 L 400 80" fill="none" stroke="#1e1b14" stroke-width="4"/>
  <text x="70" y="60" font-size="11" fill="#5c5748">Hood (pulls down over rack)</text>

  <!-- spray arms -->
  <line x1="90" y1="150" x2="370" y2="150" stroke="#2a5f8f" stroke-width="4"/>
  <circle cx="130" cy="150" r="4" fill="#2a5f8f"/><circle cx="180" cy="150" r="4" fill="#2a5f8f"/>
  <circle cx="230" cy="150" r="4" fill="#2a5f8f"/><circle cx="280" cy="150" r="4" fill="#2a5f8f"/><circle cx="330" cy="150" r="4" fill="#2a5f8f"/>
  <text x="95" y="143" font-size="10.5" font-weight="700" fill="#2a5f8f">Upper spray arm</text>

  <line x1="90" y1="230" x2="370" y2="230" stroke="#2a5f8f" stroke-width="4"/>
  <circle cx="130" cy="230" r="4" fill="#2a5f8f"/><circle cx="180" cy="230" r="4" fill="#2a5f8f"/>
  <circle cx="230" cy="230" r="4" fill="#2a5f8f"/><circle cx="280" cy="230" r="4" fill="#2a5f8f"/><circle cx="330" cy="230" r="4" fill="#2a5f8f"/>
  <text x="95" y="248" font-size="10.5" font-weight="700" fill="#2a5f8f">Lower spray arm</text>

  <!-- rack -->
  <rect x="110" y="175" width="240" height="40" fill="none" stroke="#7a7256" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="188" y="199" font-size="10.5" fill="#7a7256">Rack (plates / conveyor)</text>

  <!-- wash tank -->
  <path d="M 80 280 L 380 280 L 360 380 L 100 380 Z" fill="#e9f2fb" stroke="#2a5f8f" stroke-width="2.5"/>
  <text x="140" y="335" font-size="12" font-weight="700" fill="#2a5f8f">Wash tank</text>
  <text x="140" y="350" font-size="10" fill="#4a6d8a">recirculated detergent</text>
  <text x="140" y="363" font-size="10" fill="#4a6d8a">water + heater</text>

  <!-- pump -->
  <circle cx="360" cy="360" r="16" fill="#fff4e8" stroke="#7a3f14" stroke-width="2"/>
  <path d="M 360 348 L 364 360 M 350 360 L 370 360 M 360 372 L 356 360" stroke="#7a3f14" stroke-width="1.5"/>
  <text x="330" y="405" font-size="10.5" font-weight="700" fill="#7a3f14">Wash pump</text>

  <!-- final rinse -->
  <line x1="90" y1="105" x2="130" y2="105" stroke="#d4802a" stroke-width="4"/>
  <text x="140" y="109" font-size="11" font-weight="700" fill="#d4802a">Final rinse — fresh water in, every cycle</text>

  <!-- comparison card -->
  <text x="460" y="70" font-size="13" font-weight="700" fill="#1e1b14">High-temp problems are heat problems.</text>
  <text x="460" y="87" font-size="13" font-weight="700" fill="#1e1b14">Low-temp problems are chemistry problems.</text>

  <rect x="460" y="105" width="200" height="230" rx="6" fill="#fdeec9" stroke="#7a3f14" stroke-width="2"/>
  <text x="475" y="130" font-size="13" font-weight="700" fill="#7a3f14">HIGH-TEMP</text>
  <line x1="475" y1="140" x2="645" y2="140" stroke="#7a3f14" stroke-width="1"/>
  <text x="475" y="163" font-size="11" fill="#5c5748">Sanitizer:</text>
  <text x="475" y="178" font-size="11" font-weight="700" fill="#1e1b14">180°F final rinse</text>
  <text x="475" y="192" font-size="10.5" fill="#5c5748">(160°F min at the dish)</text>
  <text x="475" y="215" font-size="11" fill="#5c5748">Key hardware:</text>
  <text x="475" y="230" font-size="11" font-weight="700" fill="#1e1b14">Booster heater</text>
  <text x="475" y="253" font-size="11" fill="#5c5748">Verification:</text>
  <text x="475" y="268" font-size="11" font-weight="700" fill="#1e1b14">Thermolabel or</text>
  <text x="475" y="282" font-size="11" font-weight="700" fill="#1e1b14">max-reg thermometer</text>
  <text x="475" y="305" font-size="11" fill="#5c5748">Classic failure:</text>
  <text x="475" y="320" font-size="11" font-weight="700" fill="#1e1b14">Booster underperforms</text>

  <rect x="670" y="105" width="200" height="230" rx="6" fill="#e9f2fb" stroke="#2a5f8f" stroke-width="2"/>
  <text x="685" y="130" font-size="13" font-weight="700" fill="#2a5f8f">LOW-TEMP (chemical)</text>
  <line x1="685" y1="140" x2="855" y2="140" stroke="#2a5f8f" stroke-width="1"/>
  <text x="685" y="163" font-size="11" fill="#5c5748">Sanitizer:</text>
  <text x="685" y="178" font-size="11" font-weight="700" fill="#1e1b14">50–100 ppm chlorine</text>
  <text x="685" y="192" font-size="10.5" fill="#5c5748">120–140°F rinse</text>
  <text x="685" y="215" font-size="11" fill="#5c5748">Key hardware:</text>
  <text x="685" y="230" font-size="11" font-weight="700" fill="#1e1b14">Sanitizer dosing pump</text>
  <text x="685" y="253" font-size="11" fill="#5c5748">Verification:</text>
  <text x="685" y="268" font-size="11" font-weight="700" fill="#1e1b14">Chlorine test strips</text>
  <text x="685" y="298" font-size="11" fill="#5c5748">Classic failure:</text>
  <text x="685" y="312" font-size="10.5" font-weight="700" fill="#1e1b14">Empty product / failed or</text>
  <text x="685" y="325" font-size="10.5" font-weight="700" fill="#1e1b14">airlocked dosing pump</text>

  <rect x="460" y="355" width="410" height="55" rx="5" fill="#fff" stroke="#c9c2ab" stroke-width="1.5"/>
  <text x="472" y="376" font-size="11" fill="#5c5748">Sort every complaint into one of three buckets:</text>
  <text x="472" y="393" font-size="11" font-weight="700" fill="#1e1b14">results · cycle · leak/mechanical</text>
</svg>
