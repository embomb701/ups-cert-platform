<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="ui-monospace, Consolas, monospace">
  <rect width="900" height="480" fill="#fbf9f4"/>

  <text x="24" y="32" font-size="18" font-weight="700" fill="#1e1b14">Electric Fryer — Tank &amp; Control Chain</text>
  <text x="24" y="52" font-size="12" fill="#5c5748">Immersion elements heat the oil directly; two probes stand between a set-point and a fire.</text>

  <!-- control chain -->
  <g font-size="10" font-weight="700">
    <rect x="24" y="68" width="160" height="50" rx="4" fill="#eef3f7" stroke="#2a5f8f" stroke-width="2"/><text x="34" y="90" fill="#2a5f8f">Thermostat</text><text x="34" y="105" font-weight="400" font-size="8.5" fill="#4a6d8a">senses oil temperature</text>

    <rect x="199" y="68" width="160" height="50" rx="4" fill="#eef3f7" stroke="#2a5f8f" stroke-width="2"/><text x="209" y="90" fill="#2a5f8f">High-limit (reset)</text><text x="209" y="105" font-weight="400" font-size="8.5" fill="#4a6d8a">last line before a fire</text>

    <rect x="374" y="68" width="160" height="50" rx="4" fill="#fff4e8" stroke="#7a3f14" stroke-width="2.5"/><text x="384" y="90" fill="#7a3f14">Contactor coil</text><text x="384" y="105" font-weight="400" font-size="8.5" fill="#8a5010">control circuit output</text>

    <rect x="549" y="68" width="160" height="50" rx="4" fill="#fdeec9" stroke="#7a3f14" stroke-width="2"/><text x="559" y="90" fill="#7a3f14">Contactor contacts</text><text x="559" y="105" font-weight="400" font-size="8.5" fill="#8a5010">closes under coil pull-in</text>

    <rect x="724" y="68" width="152" height="50" rx="4" fill="#fdeec9" stroke="#7a3f14" stroke-width="2.5"/><text x="734" y="90" fill="#7a3f14">Elements (L1/L2)</text><text x="734" y="105" font-weight="400" font-size="8.5" fill="#8a5010">load circuit — heavy current</text>
  </g>
  <g stroke="#1e1b14" stroke-width="1.5" marker-end="url(#ef)">
    <line x1="184" y1="93" x2="197" y2="93"/><line x1="359" y1="93" x2="372" y2="93"/>
    <line x1="534" y1="93" x2="547" y2="93"/><line x1="709" y1="93" x2="722" y2="93"/>
  </g>
  <text x="24" y="140" font-size="9.5" fill="#7a7256">Thermostat and high-limit are the control circuit — low voltage, decides. Contactor and elements are the load circuit — heavy current, does.</text>

  <!-- oil tank / sensors panel -->
  <rect x="24" y="165" width="410" height="155" rx="6" fill="#eef3f7" stroke="#2a5f8f" stroke-width="2"/>
  <text x="38" y="188" font-size="12.5" font-weight="700" fill="#2a5f8f">Oil tank &amp; sensors</text>
  <text x="38" y="211" font-size="10" fill="#1e1b14">Immersion elements sit directly in the oil —</text>
  <text x="38" y="225" font-size="10" fill="#1e1b14">a shorted or grounded element heats the oil</text>
  <text x="38" y="239" font-size="10" fill="#1e1b14">whether or not the thermostat calls for it.</text>
  <text x="38" y="261" font-size="10" font-weight="700" fill="#1e1b14">Thermostat probe sets the cook temperature;</text>
  <text x="38" y="275" font-size="10" font-weight="700" fill="#1e1b14">high-limit probe is a separate, independent</text>
  <text x="38" y="289" font-size="10" font-weight="700" fill="#1e1b14">safety — it does not share the thermostat&apos;s sensor.</text>
  <text x="38" y="309" font-size="9" fill="#5c5748">A high-limit that trips repeatedly means the thermostat has already failed open.</text>

  <!-- hazard panel -->
  <rect x="459" y="165" width="417" height="155" rx="6" fill="#fdeaea" stroke="#a4231e" stroke-width="2"/>
  <text x="473" y="188" font-size="12.5" font-weight="700" fill="#8f1f1a">350°F oil is a life-safety hazard</text>
  <text x="473" y="211" font-size="10" fill="#5c5748">350°F oil causes instant deep burns on</text>
  <text x="473" y="225" font-size="10" fill="#5c5748">contact — far hotter than boiling water.</text>
  <text x="473" y="247" font-size="10" font-weight="700" fill="#8f1f1a">Water introduced into hot oil erupts</text>
  <text x="473" y="261" font-size="10" font-weight="700" fill="#8f1f1a">violently — never rinse or top off a fryer</text>
  <text x="473" y="275" font-size="10" font-weight="700" fill="#8f1f1a">with a wet vessel.</text>
  <text x="473" y="297" font-size="9.5" fill="#8f1f1a">Never lean directly over an open fryer while it is heating or filtering.</text>

  <rect x="24" y="340" width="852" height="85" rx="6" fill="#fff4e8" stroke="#d4802a" stroke-width="1.5"/>
  <text x="38" y="365" font-size="11.5" font-weight="700" fill="#7a3f14">Welded contacts are the most dangerous fryer failure</text>
  <text x="38" y="387" font-size="10" fill="#5c5748">If the contactor contacts weld shut, the elements stay energized regardless of the thermostat or the</text>
  <text x="38" y="401" font-size="10" fill="#5c5748">high-limit call — uncontrolled heating with no electrical way to stop it. Pull the unit from service immediately.</text>

  <defs>
    <marker id="ef" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#1e1b14"/>
    </marker>
  </defs>
</svg>
