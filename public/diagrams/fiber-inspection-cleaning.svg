<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="ui-monospace, Consolas, monospace">
  <rect width="900" height="480" fill="#fbf9f4"/>

  <text x="24" y="32" font-size="18" font-weight="700" fill="#1e1b14">Inspect Before You Connect — One Dust Particle Costs 1-2 dB</text>

  <rect x="24" y="52" width="852" height="42" rx="5" fill="#fdeaea" stroke="#a4231e" stroke-width="1.5"/>
  <text x="38" y="77" font-size="10.5" font-weight="700" fill="#8f1f1a">Connector contamination is the #1 cause of fiber link failures — a single dust particle can equal hundreds of meters of cable loss.</text>

  <!-- 4 zones -->
  <rect x="24" y="108" width="852" height="120" rx="6" fill="#ffffff" stroke="#7a7256" stroke-width="1.5"/>
  <text x="38" y="131" font-size="12" font-weight="700" fill="#1e1b14">IEC 61300-3-35 — four inspection zones</text>
  <g font-size="9.5" font-weight="700">
    <rect x="38" y="143" width="195" height="70" rx="4" fill="#fdeaea" stroke="#a4231e" stroke-width="2.5"/><text x="135" y="163" text-anchor="middle" fill="#8f1f1a">Zone A — Core</text><text x="135" y="180" font-weight="400" font-size="8" text-anchor="middle" fill="#5c5748">most critical — even tiny</text><text x="135" y="192" font-weight="400" font-size="8" text-anchor="middle" fill="#5c5748">contamination causes loss</text>

    <rect x="242" y="143" width="195" height="70" rx="4" fill="#fdeec9" stroke="#b45309"/><text x="339" y="163" text-anchor="middle" fill="#b45309">Zone B — Cladding</text>

    <rect x="446" y="143" width="195" height="70" rx="4" fill="#eef3f7" stroke="#0e7490"/><text x="543" y="163" text-anchor="middle" fill="#0e7490">Zone C — Contact/adhesive</text>

    <rect x="650" y="143" width="206" height="70" rx="4" fill="#e9f4ef" stroke="#059669"/><text x="753" y="163" text-anchor="middle" fill="#065f46">Zone D — Ferrule</text>
  </g>

  <!-- cleaning sequence -->
  <g font-size="9.5" font-weight="700">
    <rect x="24" y="245" width="272" height="80" rx="4" fill="#eef3f7" stroke="#0e7490" stroke-width="2"/><text x="160" y="270" text-anchor="middle" fill="#0e7490">1. Dry clean</text><text x="160" y="288" font-weight="400" font-size="8.5" text-anchor="middle" fill="#3f3a2c">one-stroke stick or cassette</text><text x="160" y="302" font-weight="400" font-size="8.5" text-anchor="middle" fill="#3f3a2c">— always the first attempt</text>

    <rect x="314" y="245" width="272" height="80" rx="4" fill="#fdeec9" stroke="#b45309" stroke-width="2"/><text x="450" y="270" text-anchor="middle" fill="#b45309">2. Wet clean if needed</text><text x="450" y="288" font-weight="400" font-size="8.5" text-anchor="middle" fill="#8a5010">lint-free wipe + optical-grade</text><text x="450" y="302" font-weight="400" font-size="8.5" text-anchor="middle" fill="#8a5010">IPA (≥99% pure)</text>

    <rect x="604" y="245" width="272" height="80" rx="4" fill="#e9f4ef" stroke="#059669" stroke-width="2"/><text x="740" y="270" text-anchor="middle" fill="#065f46">3. Dry finish</text><text x="740" y="288" font-weight="400" font-size="8.5" text-anchor="middle" fill="#3f3a2c">immediately after wet clean</text><text x="740" y="302" font-weight="400" font-size="8.5" text-anchor="middle" fill="#3f3a2c">— never touch with fingers</text>
  </g>
  <g stroke="#1e1b14" stroke-width="1.5" marker-end="url(#fi)">
    <line x1="296" y1="285" x2="312" y2="285"/><line x1="586" y1="285" x2="602" y2="285"/>
  </g>

  <rect x="24" y="345" width="852" height="90" rx="6" fill="#fdeaea" stroke="#a4231e" stroke-width="2"/>
  <text x="38" y="368" font-size="12.5" font-weight="700" fill="#8f1f1a">Inspect BOTH sides of every mated pair, always</text>
  <text x="38" y="390" font-size="10" fill="#5c5748">A dirty connector pressed against a clean one contaminates the clean end-face — and hard particles can</text>
  <text x="38" y="404" font-size="10" fill="#5c5748">permanently scratch the core. Check the launch connector before OTDR testing too — a dirty instrument</text>
  <text x="38" y="418" font-size="10" fill="#5c5748">end reads as a fiber problem that isn't actually in the fiber.</text>

  <defs>
    <marker id="fi" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#1e1b14"/></marker>
  </defs>
</svg>
