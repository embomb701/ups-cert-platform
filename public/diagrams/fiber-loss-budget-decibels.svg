<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="ui-monospace, Consolas, monospace">
  <rect width="900" height="480" fill="#fbf9f4"/>

  <text x="24" y="32" font-size="18" font-weight="700" fill="#1e1b14">The Decibel — Logarithmic Loss, Additive Along the Link</text>

  <!-- dB scale -->
  <rect x="24" y="55" width="852" height="70" rx="6" fill="#eef3f7" stroke="#7c3aed" stroke-width="2"/>
  <g font-size="10" font-weight="700">
    <rect x="38" y="70" width="180" height="26" rx="4" fill="#7c3aed"/><text x="128" y="88" text-anchor="middle" fill="#ffffff">3 dB = half power</text>
    <rect x="230" y="70" width="220" height="26" rx="4" fill="#5b21b6"/><text x="340" y="88" text-anchor="middle" fill="#ffffff">10 dB = one-tenth power</text>
    <rect x="462" y="70" width="270" height="26" rx="4" fill="#3f1c8f"/><text x="597" y="88" text-anchor="middle" fill="#ffffff">20 dB = one-hundredth power</text>
  </g>
  <text x="38" y="112" font-size="9" fill="#5c5748">Loss is additive in dB — 0.1 dB/splice + 0.35 dB/km × 5 km = 1.85 dB from cable alone, before connectors.</text>

  <!-- typical losses table -->
  <rect x="24" y="140" width="852" height="105" rx="6" fill="#ffffff" stroke="#7a7256" stroke-width="1.5"/>
  <text x="38" y="163" font-size="12" font-weight="700" fill="#1e1b14">Typical passive losses</text>
  <g font-size="9.5" font-weight="700">
    <rect x="38" y="175" width="260" height="50" rx="4" fill="#e9f4ef" stroke="#059669"/><text x="168" y="195" text-anchor="middle" fill="#065f46">Fusion splice</text><text x="168" y="211" font-weight="400" font-size="8.5" text-anchor="middle" fill="#3f3a2c">0.02–0.10 dB (good)</text>

    <rect x="308" y="175" width="260" height="50" rx="4" fill="#fdeec9" stroke="#b45309"/><text x="438" y="195" text-anchor="middle" fill="#b45309">Connector pair</text><text x="438" y="211" font-weight="400" font-size="8.5" text-anchor="middle" fill="#8a5010">0.1–0.75 dB</text>

    <rect x="578" y="175" width="260" height="50" rx="4" fill="#eef3f7" stroke="#0e7490"/><text x="708" y="195" text-anchor="middle" fill="#0e7490">SMF cable</text><text x="708" y="211" font-weight="400" font-size="8.5" text-anchor="middle" fill="#1f5a8f">0.20–0.35 dB/km</text>
  </g>

  <!-- worked example -->
  <rect x="24" y="260" width="852" height="130" rx="6" fill="#fdeec9" stroke="#b45309" stroke-width="2"/>
  <text x="38" y="283" font-size="12.5" font-weight="700" fill="#b45309">Worked loss budget — Tx -3 dBm, Rx sensitivity -25 dBm</text>
  <rect x="38" y="295" width="230" height="26" rx="4" fill="#b45309"/>
  <text x="153" y="313" font-size="9.5" font-weight="700" fill="#ffffff" text-anchor="middle">Available budget: 22 dB</text>
  <text x="38" y="342" font-size="10" fill="#5c5748">5 km cable: 1.75 dB + 4 connector pairs: 1.2 dB + 6 splices: 0.3 dB = 3.25 dB total loss</text>
  <rect x="38" y="352" width="290" height="26" rx="4" fill="#059669"/>
  <text x="183" y="370" font-size="9.5" font-weight="700" fill="#ffffff" text-anchor="middle">Margin: 22 - 3.25 = 18.75 dB — link works</text>

  <rect x="24" y="405" width="852" height="55" rx="5" fill="#fff4e8" stroke="#d4802a" stroke-width="1.5"/>
  <text x="38" y="428" font-size="10.5" font-weight="700" fill="#7a3f14">OLTS measures end-to-end loss and compares against the budget; the OTDR then locates WHERE excess</text>
  <text x="38" y="444" font-size="10.5" font-weight="700" fill="#7a3f14">loss occurs when measured loss exceeds the budget — two instruments, two different jobs.</text>
</svg>
