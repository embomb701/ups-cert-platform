<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="ui-monospace, Consolas, monospace">
  <rect width="900" height="470" fill="#fbf9f4"/>

  <text x="24" y="32" font-size="18" font-weight="700" fill="#1e1b14">Proving Flame: Two Ways Gas Equipment Does It</text>

  <!-- LEFT: standing pilot / thermocouple -->
  <rect x="40" y="55" width="400" height="390" rx="6" fill="#ffffff" stroke="#1e1b14" stroke-width="2.5"/>
  <text x="60" y="85" font-size="14" font-weight="700" fill="#1e1b14">Standing Pilot + Thermocouple</text>

  <!-- pilot flame -->
  <path d="M 130 200 C 118 180 118 160 130 140 C 142 160 142 180 130 200 Z" fill="#f7c948" stroke="#c9861a" stroke-width="1.5"/>
  <path d="M 130 190 C 124 178 124 165 130 152 C 136 165 136 178 130 190 Z" fill="#e0562a"/>
  <text x="95" y="222" font-size="11" fill="#5c5748">Pilot flame</text>

  <!-- thermocouple probe in flame -->
  <line x1="150" y1="230" x2="150" y2="170" stroke="#1e1b14" stroke-width="4"/>
  <circle cx="150" cy="165" r="7" fill="#a4231e"/>
  <text x="165" y="163" font-size="10" font-weight="700" fill="#a4231e">bimetal junction</text>
  <text x="165" y="176" font-size="10" fill="#5c5748">(heated by pilot)</text>

  <!-- wire down to valve -->
  <line x1="150" y1="230" x2="150" y2="300" stroke="#1e1b14" stroke-width="2.5"/>
  <rect x="105" y="300" width="90" height="26" rx="4" fill="#eef3f7" stroke="#2a5f8f" stroke-width="2"/>
  <text x="112" y="317" font-size="10" font-weight="700" fill="#2a5f8f">~25–30 mV</text>

  <!-- magnetic safety valve -->
  <rect x="90" y="345" width="145" height="55" rx="5" fill="#fdeec9" stroke="#7a3f14" stroke-width="2.5"/>
  <text x="100" y="365" font-size="10.5" font-weight="700" fill="#7a3f14">Magnetic safety valve</text>
  <text x="100" y="379" font-size="10" fill="#5c5748">held open by the</text>
  <text x="100" y="392" font-size="10" fill="#5c5748">millivolt signal</text>

  <rect x="270" y="130" width="150" height="140" rx="5" fill="#fdeaea" stroke="#a4231e" stroke-width="1.5"/>
  <text x="280" y="150" font-size="10.5" font-weight="700" fill="#8f1f1a">If under ~20mV:</text>
  <text x="280" y="166" font-size="10" fill="#5c5748">weak thermocouple,</text>
  <text x="280" y="180" font-size="10" fill="#5c5748">or pilot not bathing</text>
  <text x="280" y="194" font-size="10" fill="#5c5748">it — valve snaps shut</text>
  <text x="280" y="208" font-size="10" fill="#5c5748">on release.</text>
  <text x="280" y="232" font-size="10" fill="#5c5748">Thermopiles (stacked,</text>
  <text x="280" y="246" font-size="10" fill="#5c5748">250–750mV) run whole</text>
  <text x="280" y="260" font-size="10" fill="#5c5748">millivolt systems.</text>

  <rect x="60" y="410" width="360" height="26" rx="4" fill="#fff4e8" stroke="#d4802a" stroke-width="1.2"/>
  <text x="72" y="427" font-size="10.5" font-weight="700" fill="#7a3f14">Pilot out → millivolts die → valve snaps shut</text>

  <!-- RIGHT: flame rectification -->
  <rect x="460" y="55" width="400" height="390" rx="6" fill="#ffffff" stroke="#1e1b14" stroke-width="2.5"/>
  <text x="480" y="85" font-size="14" font-weight="700" fill="#1e1b14">Electronic — Flame Rectification</text>

  <!-- burner flame -->
  <path d="M 550 200 C 538 180 538 160 550 140 C 562 160 562 180 550 200 Z" fill="#f7c948" stroke="#c9861a" stroke-width="1.5"/>
  <path d="M 550 190 C 544 178 544 165 550 152 C 556 165 556 178 550 190 Z" fill="#e0562a"/>
  <text x="500" y="222" font-size="11" fill="#5c5748">Burner flame (ionized)</text>

  <!-- sensor rod -->
  <line x1="580" y1="230" x2="580" y2="155" stroke="#1e1b14" stroke-width="3"/>
  <text x="595" y="163" font-size="10" font-weight="700" fill="#1e1b14">Flame sensor rod</text>
  <text x="595" y="176" font-size="10" fill="#5c5748">(AC voltage here)</text>

  <!-- asymmetric conduction path -->
  <path d="M 580 230 C 605 248 598 268 580 285" fill="none" stroke="#2a5f8f" stroke-width="2.5" stroke-dasharray="4 3"/>
  <text x="606" y="255" font-size="9.5" fill="#2a5f8f">conducts to</text>
  <text x="606" y="267" font-size="9.5" fill="#2a5f8f">ground via flame</text>

  <!-- control board -->
  <rect x="510" y="345" width="120" height="55" rx="5" fill="#eef3f7" stroke="#2a5f8f" stroke-width="2.5"/>
  <text x="520" y="368" font-size="11" font-weight="700" fill="#2a5f8f">Control board</text>
  <text x="520" y="382" font-size="10" fill="#5c5748">needs minimum</text>
  <text x="520" y="395" font-size="10" fill="#5c5748">microamp DC signal</text>

  <line x1="580" y1="300" x2="580" y2="345" stroke="#1e1b14" stroke-width="2.5"/>

  <rect x="690" y="130" width="150" height="150" rx="5" fill="#fdeaea" stroke="#a4231e" stroke-width="1.5"/>
  <text x="700" y="150" font-size="10.5" font-weight="700" fill="#8f1f1a">Signature failure:</text>
  <text x="700" y="166" font-size="10" fill="#5c5748">Rod coated in oxide/</text>
  <text x="700" y="180" font-size="10" fill="#5c5748">grime — flame present,</text>
  <text x="700" y="194" font-size="10" fill="#5c5748">current too low, locks</text>
  <text x="700" y="208" font-size="10" fill="#5c5748">out after ~10 sec.</text>
  <text x="700" y="232" font-size="10" fill="#5c5748">Fix: clean the rod,</text>
  <text x="700" y="246" font-size="10" fill="#5c5748">check porcelain, verify</text>
  <text x="700" y="260" font-size="10" fill="#5c5748">burner ground path.</text>

  <rect x="480" y="410" width="360" height="26" rx="4" fill="#fff4e8" stroke="#d4802a" stroke-width="1.2"/>
  <text x="492" y="427" font-size="10.5" font-weight="700" fill="#7a3f14">Never bypass flame proving — lockouts prevent gas buildup</text>
</svg>
