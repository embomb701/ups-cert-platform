<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="ui-monospace, Consolas, monospace">
  <rect width="900" height="480" fill="#fbf9f4"/>

  <text x="24" y="32" font-size="18" font-weight="700" fill="#1e1b14">LVRT and the Lightning Path — Staying Connected, Staying Grounded</text>

  <!-- LVRT -->
  <rect x="24" y="55" width="410" height="150" rx="6" fill="#fdeaea" stroke="#a4231e" stroke-width="2"/>
  <text x="38" y="78" font-size="12.5" font-weight="700" fill="#8f1f1a">Low Voltage Ride-Through (LVRT)</text>
  <text x="38" y="100" font-size="9.5" fill="#5c5748">NERC FAR 003-4: turbines must stay</text>
  <text x="38" y="114" font-size="9.5" fill="#5c5748">connected through a voltage dip —</text>
  <text x="38" y="128" font-size="9.5" fill="#5c5748">typically 0% voltage for 150–625 ms.</text>
  <rect x="38" y="140" width="358" height="46" rx="4" fill="#8f1f1a"/>
  <text x="217" y="159" font-size="9.5" font-weight="700" fill="#ffffff" text-anchor="middle">Inject reactive current: ≥2% rated</text>
  <text x="217" y="175" font-size="9.5" font-weight="700" fill="#ffffff" text-anchor="middle">reactive current per 1% voltage drop</text>

  <!-- transformer -->
  <rect x="459" y="55" width="417" height="150" rx="6" fill="#eef3f7" stroke="#0e7490" stroke-width="2"/>
  <text x="473" y="78" font-size="12.5" font-weight="700" fill="#0e7490">Nacelle transformer</text>
  <text x="473" y="100" font-size="9.5" fill="#3f3a2c">Steps up generator output (690V or 1kV)</text>
  <text x="473" y="114" font-size="9.5" fill="#3f3a2c">to the 34.5kV collection system.</text>
  <text x="473" y="136" font-size="9.5" font-weight="700" fill="#1f5a8f">Protection: differential relay (internal</text>
  <text x="473" y="150" font-size="9.5" font-weight="700" fill="#1f5a8f">fault, &lt;30ms), overcurrent, buchholz relay.</text>
  <text x="473" y="172" font-size="9" fill="#5c5748">Differential trips on primary/secondary current mismatch beyond magnetizing current.</text>

  <!-- lightning path -->
  <rect x="24" y="220" width="852" height="130" rx="6" fill="#e9f4ef" stroke="#059669" stroke-width="2"/>
  <text x="38" y="243" font-size="12.5" font-weight="700" fill="#065f46">Lightning path — receptor to earth</text>
  <g font-size="9.5" font-weight="700">
    <rect x="38" y="255" width="150" height="34" rx="4" fill="#059669"/><text x="113" y="276" text-anchor="middle" fill="#ffffff">Blade receptor</text>
    <rect x="204" y="255" width="150" height="34" rx="4" fill="#059669"/><text x="279" y="276" text-anchor="middle" fill="#ffffff">Pitch bearing</text>
    <rect x="370" y="255" width="150" height="34" rx="4" fill="#059669"/><text x="445" y="276" text-anchor="middle" fill="#ffffff">Main shaft</text>
    <rect x="536" y="255" width="150" height="34" rx="4" fill="#059669"/><text x="611" y="276" text-anchor="middle" fill="#ffffff">Tower</text>
    <rect x="702" y="255" width="150" height="34" rx="4" fill="#166534"/><text x="777" y="276" text-anchor="middle" fill="#ffffff">Earth ground</text>
  </g>
  <g stroke="#1e1b14" stroke-width="1.5" marker-end="url(#lp)">
    <line x1="188" y1="272" x2="202" y2="272"/><line x1="354" y1="272" x2="368" y2="272"/>
    <line x1="520" y1="272" x2="534" y2="272"/><line x1="686" y1="272" x2="700" y2="272"/>
  </g>
  <text x="38" y="315" font-size="9.5" fill="#3f3a2c">Insulated shaft couplings or bypass brushes route strike current around bearings — otherwise the</text>
  <text x="38" y="332" font-size="9.5" fill="#3f3a2c">current pits bearing races on its way to the ground grid at the tower foundation.</text>

  <rect x="24" y="365" width="852" height="95" rx="6" fill="#fff4e8" stroke="#d4802a" stroke-width="1.5"/>
  <text x="38" y="388" font-size="12" font-weight="700" fill="#7a3f14">Why LVRT exists — the lesson grid operators learned the hard way</text>
  <text x="38" y="410" font-size="10" fill="#5c5748">Tripping offline during a voltage dip removes generation exactly when the grid needs support most —</text>
  <text x="38" y="424" font-size="10" fill="#5c5748">real grid disturbances where wind farms tripped en masse accelerated cascading blackouts, which is</text>
  <text x="38" y="438" font-size="10" fill="#5c5748">why the ride-through-and-support requirement is now written into grid interconnection codes.</text>

  <defs>
    <marker id="lp" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#1e1b14"/></marker>
  </defs>
</svg>
