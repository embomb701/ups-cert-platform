<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="ui-monospace, Consolas, monospace">
  <rect width="900" height="480" fill="#fbf9f4"/>

  <text x="24" y="32" font-size="18" font-weight="700" fill="#1e1b14">Ice Machines — Two Ways to Freeze</text>
  <text x="24" y="52" font-size="12" fill="#5c5748">Cube machines cycle in two steps; flake and nugget machines scrape ice continuously.</text>

  <!-- cube freeze/harvest chain -->
  <g font-size="12" font-weight="700">
    <rect x="24" y="66" width="395" height="65" rx="5" fill="#e9f2fb" stroke="#2a5f8f" stroke-width="2.5"/>
    <text x="38" y="88" fill="#2a5f8f">1. FREEZE</text>
    <text x="38" y="105" font-weight="400" font-size="9.5" fill="#4a6d8a">Water films over a cold grid or plate evaporator —</text>
    <text x="38" y="118" font-weight="400" font-size="9.5" fill="#4a6d8a">layers freeze until a thickness sensor says it&apos;s ready.</text>

    <rect x="435" y="66" width="395" height="65" rx="5" fill="#fdeec9" stroke="#7a3f14" stroke-width="2.5"/>
    <text x="449" y="88" fill="#7a3f14">2. HARVEST</text>
    <text x="449" y="105" font-weight="400" font-size="9.5" fill="#8a5010">Hot discharge gas warms the evaporator plate just</text>
    <text x="449" y="118" font-weight="400" font-size="9.5" fill="#8a5010">enough to release the ice into the bin.</text>
  </g>
  <line x1="419" y1="98" x2="433" y2="98" stroke="#1e1b14" stroke-width="2" marker-end="url(#ic)"/>
  <path d="M 700 131 C 700 150 150 150 150 131" fill="none" stroke="#1e1b14" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ic)"/>
  <text x="24" y="163" font-size="9.5" fill="#7a7256">Loop repeats: freeze → harvest → freeze, until the bin sensor calls the machine off.</text>

  <!-- bin control panel -->
  <rect x="24" y="168" width="410" height="100" rx="6" fill="#ffffff" stroke="#1e1b14" stroke-width="2"/>
  <text x="38" y="191" font-size="12.5" font-weight="700" fill="#1e1b14">Bin control</text>
  <text x="38" y="213" font-size="10" fill="#5c5748">Shuts the machine off when ice backs</text>
  <text x="38" y="227" font-size="10" fill="#5c5748">up to a sensor — thermostat bulb,</text>
  <text x="38" y="241" font-size="10" fill="#5c5748">mechanical flap, or photo-eye.</text>
  <text x="38" y="258" font-size="9" font-weight="700" fill="#1e1b14">Watch one full cycle before diagnosing anything else.</text>

  <!-- flake/nugget panel -->
  <rect x="459" y="168" width="417" height="100" rx="6" fill="#eef3f7" stroke="#2a5f8f" stroke-width="2"/>
  <text x="473" y="191" font-size="12.5" font-weight="700" fill="#2a5f8f">Flake / Nugget — continuous auger</text>
  <text x="473" y="213" font-size="10" fill="#1e1b14">A rotating auger scrapes ice continuously</text>
  <text x="473" y="227" font-size="10" fill="#1e1b14">off the wall of a cylindrical evaporator —</text>
  <text x="473" y="241" font-size="10" fill="#1e1b14">no separate freeze/harvest cycle.</text>
  <text x="473" y="258" font-size="9" fill="#5c5748">Flake: soft, display/healthcare. Nugget: compressed, "chewable ice."</text>

  <!-- diagnostics -->
  <rect x="24" y="285" width="410" height="65" rx="6" fill="#fdeaea" stroke="#a4231e" stroke-width="1.5"/>
  <text x="38" y="308" font-size="10.5" font-weight="700" fill="#8f1f1a">A "dead" machine is often just a dirty bin sensor</text>
  <text x="38" y="324" font-size="10.5" font-weight="700" fill="#8f1f1a">or fouled photo-eye — a 30-second fix</text>
  <text x="38" y="340" font-size="9" fill="#5c5748">Check the sensor before chasing refrigerant.</text>

  <rect x="459" y="285" width="417" height="65" rx="6" fill="#fdeaea" stroke="#a4231e" stroke-width="1.5"/>
  <text x="473" y="308" font-size="10.5" font-weight="700" fill="#8f1f1a">Rumbling, squealing, or metal flakes in the ice</text>
  <text x="473" y="324" font-size="10.5" font-weight="700" fill="#8f1f1a">= auger/bearing wear</text>
  <text x="473" y="340" font-size="9" fill="#5c5748">A seized auger takes the gearbox with it — service now.</text>

  <rect x="24" y="365" width="852" height="60" rx="6" fill="#fff4e8" stroke="#d4802a" stroke-width="1.5"/>
  <text x="38" y="390" font-size="11" font-weight="700" fill="#7a3f14">No harvest cycle on flake/nugget machines — but the gearmotor and auger bearing live under</text>
  <text x="38" y="408" font-size="11" font-weight="700" fill="#7a3f14">constant load, which is exactly why they wear differently than a cube machine's evaporator.</text>

  <defs>
    <marker id="ic" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#1e1b14"/>
    </marker>
  </defs>
</svg>
