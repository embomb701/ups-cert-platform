<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="ui-monospace, Consolas, monospace">
  <rect width="900" height="460" fill="#fbf9f4"/>

  <text x="24" y="32" font-size="18" font-weight="700" fill="#1e1b14">Ice Machines — Two Ways to Freeze</text>

  <!-- LEFT: cube machine freeze/harvest loop -->
  <text x="60" y="65" font-size="14" font-weight="700" fill="#1e1b14">Cube Machines — Freeze / Harvest Cycle</text>

  <!-- Freeze box -->
  <rect x="70" y="90" width="170" height="110" rx="6" fill="#e9f2fb" stroke="#2a5f8f" stroke-width="2.5"/>
  <text x="85" y="115" font-size="12.5" font-weight="700" fill="#2a5f8f">1. FREEZE</text>
  <text x="85" y="135" font-size="10" fill="#4a6d8a">Water films over a cold</text>
  <text x="85" y="148" font-size="10" fill="#4a6d8a">grid or plate evaporator</text>
  <text x="85" y="166" font-size="10" fill="#4a6d8a">Layers freeze until a</text>
  <text x="85" y="179" font-size="10" fill="#4a6d8a">thickness sensor says</text>
  <text x="85" y="192" font-size="10" fill="#4a6d8a">the slab is ready</text>

  <!-- arrow right -->
  <path d="M 245 145 L 285 145" stroke="#1e1b14" stroke-width="2.5" marker-end="url(#a1)"/>

  <!-- Harvest box -->
  <rect x="290" y="90" width="170" height="110" rx="6" fill="#fdeec9" stroke="#7a3f14" stroke-width="2.5"/>
  <text x="305" y="115" font-size="12.5" font-weight="700" fill="#7a3f14">2. HARVEST</text>
  <text x="305" y="135" font-size="10" fill="#5c5748">Hot discharge gas</text>
  <text x="305" y="148" font-size="10" fill="#5c5748">routed through the</text>
  <text x="305" y="161" font-size="10" fill="#5c5748">evaporator warms the</text>
  <text x="305" y="174" font-size="10" fill="#5c5748">plate just enough to</text>
  <text x="305" y="187" font-size="10" fill="#5c5748">release the ice into the bin</text>

  <!-- loop back arrow -->
  <path d="M 375 200 C 375 240 130 240 130 200" fill="none" stroke="#1e1b14" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a1)"/>
  <text x="185" y="255" font-size="10.5" fill="#7a7256">repeat</text>

  <!-- bin sensor -->
  <rect x="70" y="280" width="390" height="70" rx="5" fill="#ffffff" stroke="#1e1b14" stroke-width="2"/>
  <text x="85" y="302" font-size="11.5" font-weight="700" fill="#1e1b14">Bin control shuts the machine off when</text>
  <text x="85" y="318" font-size="11.5" font-weight="700" fill="#1e1b14">ice backs up to a sensor</text>
  <text x="85" y="336" font-size="10" fill="#5c5748">thermostat bulb · mechanical flap · photo-eye</text>

  <rect x="70" y="365" width="390" height="60" rx="5" fill="#fdeaea" stroke="#a4231e" stroke-width="1.5"/>
  <text x="82" y="386" font-size="10.5" font-weight="700" fill="#8f1f1a">A "dead" machine is often just a dirty bin</text>
  <text x="82" y="402" font-size="10.5" font-weight="700" fill="#8f1f1a">sensor or fouled photo-eye — a 30-second fix</text>
  <text x="82" y="416" font-size="9.5" fill="#5c5748">Watch one full cycle before diagnosing anything else</text>

  <!-- RIGHT: flake/nugget auger -->
  <text x="520" y="65" font-size="14" font-weight="700" fill="#1e1b14">Flake / Nugget — Continuous Auger</text>

  <rect x="520" y="90" width="340" height="180" rx="6" fill="#ffffff" stroke="#1e1b14" stroke-width="2.5"/>

  <!-- cylindrical evaporator -->
  <rect x="560" y="120" width="70" height="120" rx="10" fill="#eef3f7" stroke="#2a5f8f" stroke-width="2.5"/>
  <!-- auger spiral suggestion -->
  <path d="M 565 125 Q 620 140 565 155 Q 620 170 565 185 Q 620 200 565 215 Q 620 230 565 235" fill="none" stroke="#7a3f14" stroke-width="2"/>
  <text x="645" y="140" font-size="10.5" font-weight="700" fill="#2a5f8f">Cylindrical</text>
  <text x="645" y="153" font-size="10.5" font-weight="700" fill="#2a5f8f">evaporator</text>
  <text x="645" y="176" font-size="10.5" font-weight="700" fill="#7a3f14">Rotating auger</text>
  <text x="645" y="189" font-size="10.5" fill="#5c5748">scrapes ice off</text>
  <text x="645" y="202" font-size="10.5" fill="#5c5748">the wall continuously</text>

  <text x="530" y="253" font-size="10" fill="#5c5748">Flake: soft, for display/healthcare.</text>
  <text x="530" y="266" font-size="10" fill="#5c5748">Nugget: compressed, "chewable ice."</text>

  <rect x="520" y="285" width="340" height="70" rx="5" fill="#fdeaea" stroke="#a4231e" stroke-width="1.5"/>
  <text x="532" y="307" font-size="10.5" font-weight="700" fill="#8f1f1a">Rumbling, squealing, or metal flakes in</text>
  <text x="532" y="323" font-size="10.5" font-weight="700" fill="#8f1f1a">the ice = auger/bearing wear</text>
  <text x="532" y="340" font-size="9.5" fill="#5c5748">A seized auger takes the gearbox with it — service now</text>

  <text x="520" y="385" font-size="10.5" font-weight="700" fill="#1e1b14">No harvest cycle — but the gearmotor</text>
  <text x="520" y="400" font-size="10.5" font-weight="700" fill="#1e1b14">and auger bearing live under constant load</text>

  <defs>
    <marker id="a1" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1e1b14"/>
    </marker>
  </defs>
</svg>
