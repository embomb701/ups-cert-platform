<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="ui-monospace, Consolas, monospace">
  <rect width="900" height="460" fill="#fbf9f4"/>

  <text x="24" y="32" font-size="18" font-weight="700" fill="#1e1b14">Four Detector Technologies — Trading Simplicity for False-Alarm Resistance</text>

  <g font-size="10" font-weight="700">
    <rect x="24" y="55" width="205" height="150" rx="6" fill="#eef3f7" stroke="#0e7490" stroke-width="2"/>
    <text x="38" y="78" fill="#0e7490">PIR</text>
    <text x="38" y="100" font-weight="400" font-size="9" fill="#3f3a2c">Senses body-heat movement</text>
    <text x="38" y="113" font-weight="400" font-size="9" fill="#3f3a2c">across the detection pattern.</text>
    <text x="38" y="140" font-weight="700" font-size="9" fill="#1f5a8f">Susceptible to HVAC drafts</text>
    <text x="38" y="153" font-weight="700" font-size="9" fill="#1f5a8f">and direct sunlight.</text>
    <text x="38" y="178" font-weight="400" font-size="8.5" fill="#5c5748">Cheapest, most common.</text>

    <rect x="239" y="55" width="205" height="150" rx="6" fill="#7c3aed" fill-opacity="0.1" stroke="#7c3aed" stroke-width="2.5"/>
    <text x="253" y="78" fill="#5b21b6">Dual-tech</text>
    <text x="253" y="100" font-weight="400" font-size="9" fill="#3f3a2c">PIR + microwave (or ultrasonic)</text>
    <text x="253" y="113" font-weight="400" font-size="9" fill="#3f3a2c">— both must trigger together.</text>
    <text x="253" y="140" font-weight="700" font-size="9" fill="#5b21b6">Dramatically fewer false</text>
    <text x="253" y="153" font-weight="700" font-size="9" fill="#5b21b6">alarms in tough environments.</text>
    <text x="253" y="178" font-weight="400" font-size="8.5" fill="#5c5748">HVAC vents, moving curtains handled.</text>

    <rect x="454" y="55" width="205" height="150" rx="6" fill="#fdeec9" stroke="#b45309" stroke-width="2"/>
    <text x="468" y="78" fill="#b45309">Glass break</text>
    <text x="468" y="100" font-weight="400" font-size="9" fill="#3f3a2c">Acoustic analysis identifies</text>
    <text x="468" y="113" font-weight="400" font-size="9" fill="#3f3a2c">breaking glass's signature.</text>
    <text x="468" y="140" font-weight="700" font-size="9" fill="#8a5010">&lt;10kHz thud +</text>
    <text x="468" y="153" font-weight="700" font-size="9" fill="#8a5010">&gt;10kHz tinkle, within 150ms</text>

    <rect x="669" y="55" width="207" height="150" rx="6" fill="#ffffff" stroke="#7a7256" stroke-width="1.5"/>
    <text x="683" y="78" fill="#1e1b14">Door/window contact</text>
    <text x="683" y="100" font-weight="400" font-size="9" fill="#5c5748">NC magnetic contact opens</text>
    <text x="683" y="113" font-weight="400" font-size="9" fill="#5c5748">when the door opens.</text>
    <text x="683" y="140" font-weight="700" font-size="9" fill="#1e1b14">Simplest and most</text>
    <text x="683" y="153" font-weight="700" font-size="9" fill="#1e1b14">reliable detector type.</text>
  </g>

  <rect x="24" y="225" width="852" height="95" rx="6" fill="#e9f4ef" stroke="#059669" stroke-width="2"/>
  <text x="38" y="248" font-size="12.5" font-weight="700" fill="#065f46">Why dual-tech beats PIR alone</text>
  <text x="38" y="270" font-size="10" fill="#3f3a2c">HVAC air movement can trigger a PIR sensor's heat-motion detection alone — but it won't trigger the</text>
  <text x="38" y="284" font-size="10" fill="#3f3a2c">microwave channel simultaneously. Requiring BOTH channels to fire at once filters out that entire class of nuisance alarm.</text>

  <rect x="24" y="335" width="852" height="105" rx="6" fill="#fff4e8" stroke="#d4802a" stroke-width="1.5"/>
  <text x="38" y="358" font-size="12" font-weight="700" fill="#7a3f14">Matching the technology to the threat and the environment</text>
  <text x="38" y="380" font-size="10" fill="#5c5748">A quiet office with stable HVAC can run single-tech PIR reliably. A warehouse with drafts, forklifts, and</text>
  <text x="38" y="394" font-size="10" fill="#5c5748">temperature swings needs dual-tech. Ground-floor glass storefronts add glass break coverage. Every</text>
  <text x="38" y="408" font-size="10" fill="#5c5748">perimeter door still gets a contact — it's the cheapest, most dependable layer in the whole system.</text>
</svg>
