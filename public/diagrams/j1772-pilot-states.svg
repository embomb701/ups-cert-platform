<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="ui-monospace, Consolas, monospace">
  <rect width="900" height="480" fill="#fbf9f4"/>

  <text x="24" y="32" font-size="18" font-weight="700" fill="#1e1b14">The Control Pilot — the Invisible Handshake That Makes Charging Safe</text>

  <rect x="24" y="52" width="852" height="42" rx="5" fill="#e9f4ef" stroke="#16a34a" stroke-width="1.5"/>
  <text x="38" y="78" font-size="11" font-weight="700" fill="#166534">1 kHz square wave, ±12V, generated by the EVSE — the vehicle answers by loading a resistor across the pilot pin.</text>

  <!-- state ladder -->
  <g font-size="9.5" font-weight="700">
    <rect x="24" y="110" width="195" height="80" rx="4" fill="#ffffff" stroke="#7a7256" stroke-width="1.5"/><text x="38" y="132" fill="#1e1b14">State A · +12V</text><text x="38" y="152" font-weight="400" font-size="9" fill="#5c5748">Standby — no vehicle</text><text x="38" y="165" font-weight="400" font-size="9" fill="#5c5748">connected.</text>

    <rect x="229" y="110" width="195" height="80" rx="4" fill="#eef3f7" stroke="#0e7490" stroke-width="1.5"/><text x="243" y="132" fill="#0e7490">State B · ±9V</text><text x="243" y="152" font-weight="400" font-size="9" fill="#3f3a2c">Vehicle connected,</text><text x="243" y="165" font-weight="400" font-size="9" fill="#3f3a2c">not yet ready.</text>

    <rect x="434" y="110" width="195" height="80" rx="4" fill="#e9f4ef" stroke="#16a34a" stroke-width="2.5"/><text x="448" y="132" fill="#166534">State C · ±6V</text><text x="448" y="152" font-weight="400" font-size="9" fill="#166534">Ready to charge —</text><text x="448" y="165" font-weight="400" font-size="9" fill="#166534">EVSE may close contactor.</text>

    <rect x="639" y="110" width="213" height="80" rx="4" fill="#fdeec9" stroke="#b45309" stroke-width="1.5"/><text x="653" y="132" fill="#b45309">State D · ±3V</text><text x="653" y="152" font-weight="400" font-size="9" fill="#5c5748">Ventilation required —</text><text x="653" y="165" font-weight="400" font-size="9" fill="#5c5748">rare for BEVs, some PHEVs.</text>
  </g>

  <!-- fault states -->
  <rect x="24" y="204" width="410" height="80" rx="6" fill="#fdeaea" stroke="#a4231e" stroke-width="2"/>
  <text x="38" y="227" font-size="11.5" font-weight="700" fill="#8f1f1a">States E / F — fault conditions</text>
  <text x="38" y="249" font-size="9.5" fill="#5c5748">State E: pilot short to ground (vehicle</text>
  <text x="38" y="263" font-size="9.5" fill="#5c5748">ground fault or EVSE error). State F: EVSE</text>
  <text x="38" y="277" font-size="9.5" fill="#5c5748">indicates a fault — no pilot signal at all.</text>

  <!-- duty cycle -->
  <rect x="459" y="204" width="417" height="80" rx="6" fill="#eef3f7" stroke="#0e7490" stroke-width="2"/>
  <text x="473" y="227" font-size="11.5" font-weight="700" fill="#0e7490">Duty cycle = max current offer</text>
  <text x="473" y="249" font-size="9.5" fill="#3f3a2c">The pilot's PWM duty cycle encodes the</text>
  <text x="473" y="263" font-size="9.5" fill="#3f3a2c">EVSE's max current: 50% duty ≈ 25A per</text>
  <text x="473" y="277" font-size="9.5" fill="#3f3a2c">the J1772 encoding table.</text>

  <!-- service shortcut -->
  <rect x="24" y="300" width="852" height="65" rx="6" fill="#fff4e8" stroke="#d4802a" stroke-width="1.5"/>
  <text x="38" y="323" font-size="12" font-weight="700" fill="#7a3f14">Service shortcut</text>
  <text x="38" y="345" font-size="10" fill="#5c5748">A session that connects (State B) but never transitions to State C is the pilot circuit's signature —</text>
  <text x="38" y="359" font-size="10" fill="#5c5748">check pilot board output and pilot pin condition before opening anything else.</text>

  <!-- DCFC comms -->
  <rect x="24" y="381" width="852" height="80" rx="6" fill="#fdeec9" stroke="#b45309" stroke-width="2"/>
  <text x="38" y="404" font-size="12" font-weight="700" fill="#b45309">DCFC uses a different layer entirely</text>
  <text x="38" y="426" font-size="10" fill="#5c5748">ISO 15118 (PLC over pilot) for CCS/NACS, CHAdeMO's own CAN protocol — the charger negotiates a</text>
  <text x="38" y="440" font-size="10" fill="#5c5748">voltage/current target with the vehicle's BMS. Communication faults are a distinct fault family from power hardware.</text>
</svg>
