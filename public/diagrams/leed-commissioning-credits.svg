<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="ui-monospace, Consolas, monospace">
  <rect width="900" height="460" fill="#fbf9f4"/>

  <text x="24" y="32" font-size="18" font-weight="700" fill="#1e1b14">LEED EA Commissioning — Fundamental Required, Enhanced Optional</text>

  <!-- fundamental -->
  <rect x="24" y="55" width="410" height="180" rx="6" fill="#eef3f7" stroke="#0e7490" stroke-width="2"/>
  <text x="38" y="78" font-size="12.5" font-weight="700" fill="#0e7490">EA Prerequisite — Fundamental Cx</text>
  <text x="38" y="100" font-size="9.5" font-weight="700" fill="#1f5a8f">Required for ALL LEED projects.</text>
  <text x="38" y="122" font-size="9.5" fill="#3f3a2c">Cx plan before DD, OPR review, design</text>
  <text x="38" y="136" font-size="9.5" fill="#3f3a2c">review, back-check, installer training,</text>
  <text x="38" y="150" font-size="9.5" fill="#3f3a2c">Cx through occupancy.</text>
  <rect x="38" y="162" width="358" height="26" rx="4" fill="#0e7490"/>
  <text x="217" y="180" font-size="9.5" font-weight="700" fill="#ffffff" text-anchor="middle">CxA can be a project team member</text>
  <text x="38" y="212" font-size="9" fill="#5c5748">Independence NOT required at this level.</text>

  <!-- enhanced -->
  <rect x="459" y="55" width="417" height="180" rx="6" fill="#e9f4ef" stroke="#059669" stroke-width="2"/>
  <text x="473" y="78" font-size="12.5" font-weight="700" fill="#065f46">EA Credit — Enhanced Cx (2-6 points)</text>
  <text x="473" y="100" font-size="9.5" font-weight="700" fill="#065f46">Optional, heavily weighted.</text>
  <g font-size="9" font-weight="700" fill="#3f3a2c">
    <text x="485" y="122">• Truly INDEPENDENT CxA</text>
    <text x="485" y="138">• Design review at all 3 stages (SD/DD/CD)</text>
    <text x="485" y="154">• Systems manual + submittal review</text>
    <text x="485" y="170">• Post-occupancy review at 10 months</text>
  </g>
  <rect x="473" y="182" width="380" height="26" rx="4" fill="#059669"/>
  <text x="663" y="200" font-size="9.5" font-weight="700" fill="#ffffff" text-anchor="middle">Top tier adds Monitoring-Based Cx (MBCx)</text>

  <!-- documentation -->
  <rect x="24" y="250" width="852" height="100" rx="6" fill="#fdeec9" stroke="#b45309" stroke-width="2"/>
  <text x="38" y="273" font-size="12" font-weight="700" fill="#b45309">GBCI documentation requirements</text>
  <text x="38" y="295" font-size="10" fill="#5c5748">OPR, BOD, Cx plan, design review comments + back-checks, prefunctional checklists, FPT procedures</text>
  <text x="38" y="309" font-size="10" fill="#5c5748">and results, issues log with resolutions, training documentation, final commissioning report.</text>
  <text x="38" y="331" font-size="9.5" font-weight="700" fill="#8a5010">GBCI reviewers verify the paper trail, not just the technical outcome.</text>

  <rect x="24" y="365" width="852" height="75" rx="6" fill="#fdeaea" stroke="#a4231e" stroke-width="2"/>
  <text x="38" y="388" font-size="12" font-weight="700" fill="#8f1f1a">Documentation gaps can deny credit even with flawless commissioning</text>
  <text x="38" y="410" font-size="10" fill="#5c5748">If the paperwork doesn't demonstrate the required process was followed, technically excellent field</text>
  <text x="38" y="424" font-size="10" fill="#5c5748">work doesn't satisfy LEED — the documentation package is graded, not just the building's performance.</text>
</svg>
