<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="ui-monospace, Consolas, monospace">
  <rect width="900" height="470" fill="#fbf9f4"/>

  <text x="24" y="32" font-size="18" font-weight="700" fill="#1e1b14">Lithium Is a Family, Not One Chemistry</text>

  <!-- LFP vs NMC -->
  <rect x="24" y="55" width="415" height="200" rx="6" fill="#e9f2fb" stroke="#0e7490" stroke-width="2.5"/>
  <text x="38" y="79" font-size="13" font-weight="700" fill="#0e7490">LFP — Lithium Iron Phosphate</text>
  <text x="38" y="100" font-size="10" fill="#5c5748">Stable crystal structure resists thermal</text>
  <text x="38" y="114" font-size="10" fill="#5c5748">runaway — oxygen covalently bonded to</text>
  <text x="38" y="128" font-size="10" fill="#5c5748">phosphorus, not easily released under abuse.</text>
  <text x="38" y="152" font-size="10" fill="#1e1b14">90–160 Wh/kg · 3.2–3.3V nominal</text>
  <text x="38" y="168" font-size="10" fill="#1e1b14">2,000–6,000+ cycles to 80% capacity</text>
  <text x="38" y="190" font-size="9.5" font-weight="700" fill="#1f5a8f">Flat discharge curve — SOC by voltage</text>
  <text x="38" y="204" font-size="9.5" font-weight="700" fill="#1f5a8f">is nearly impossible without a BMS.</text>
  <text x="38" y="228" font-size="9.5" font-weight="700" fill="#0e7490">First choice: stationary BESS, UPS, telecom</text>

  <rect x="459" y="55" width="417" height="200" rx="6" fill="#fdeaea" stroke="#a4231e" stroke-width="2.5"/>
  <text x="473" y="79" font-size="13" font-weight="700" fill="#a4231e">NMC — Nickel Manganese Cobalt</text>
  <text x="473" y="100" font-size="10" fill="#5c5748">Cathodes can release oxygen when</text>
  <text x="473" y="114" font-size="10" fill="#5c5748">overheated or overcharged — enables</text>
  <text x="473" y="128" font-size="10" fill="#5c5748">exothermic reactions and fire.</text>
  <text x="473" y="152" font-size="10" fill="#1e1b14">150–250 Wh/kg · 3.6–3.7V nominal</text>
  <text x="473" y="168" font-size="10" fill="#1e1b14">Higher energy density than LFP</text>
  <text x="473" y="190" font-size="9.5" font-weight="700" fill="#8f1f1a">Requires more sophisticated BMS</text>
  <text x="473" y="204" font-size="9.5" font-weight="700" fill="#8f1f1a">protection and thermal management.</text>
  <text x="473" y="228" font-size="9.5" font-weight="700" fill="#a4231e">Dominant chemistry for EV traction batteries</text>

  <!-- rule -->
  <rect x="24" y="270" width="852" height="50" rx="5" fill="#fdeec9" stroke="#b45309" stroke-width="1.5"/>
  <text x="38" y="292" font-size="11" font-weight="700" fill="#7a3f14">Battery technician rule: assume every lithium system requires BMS-governed charging. Never</text>
  <text x="38" y="308" font-size="11" font-weight="700" fill="#7a3f14">charge a lithium cell with a lead-acid charger or any charger not specified for the pack.</text>

  <!-- hierarchy -->
  <text x="24" y="352" font-size="13" font-weight="700" fill="#1e1b14">Cell → Module → Pack Hierarchy</text>

  <g font-size="10" font-weight="700">
    <rect x="24" y="365" width="180" height="70" rx="5" fill="#eef3f7" stroke="#6d28d9" stroke-width="2"/><text x="38" y="390" fill="#6d28d9">CELL</text><text x="38" y="406" font-weight="400" font-size="9" fill="#5c5748">cylindrical, prismatic,</text><text x="38" y="418" font-weight="400" font-size="9" fill="#5c5748">or pouch</text>

    <rect x="234" y="365" width="180" height="70" rx="5" fill="#eef3f7" stroke="#6d28d9" stroke-width="2"/><text x="248" y="390" fill="#6d28d9">MODULE</text><text x="248" y="406" font-weight="400" font-size="9" fill="#5c5748">series/parallel cells,</text><text x="248" y="418" font-weight="400" font-size="9" fill="#5c5748">cell-level fusing</text>

    <rect x="444" y="365" width="180" height="70" rx="5" fill="#eef3f7" stroke="#6d28d9" stroke-width="2"/><text x="458" y="390" fill="#6d28d9">PACK</text><text x="458" y="406" font-weight="400" font-size="9" fill="#5c5748">modules for system</text><text x="458" y="418" font-weight="400" font-size="9" fill="#5c5748">voltage + capacity</text>

    <rect x="654" y="365" width="222" height="70" rx="5" fill="#fdeaea" stroke="#a4231e" stroke-width="2.5"/><text x="668" y="390" fill="#a4231e">BMS</text><text x="668" y="406" font-weight="400" font-size="9" fill="#5c5748">governs the whole pack —</text><text x="668" y="418" font-weight="400" font-size="9" fill="#5c5748">safety + state + comms</text>
  </g>
  <g stroke="#1e1b14" stroke-width="2" marker-end="url(#dh)">
    <line x1="204" y1="400" x2="232" y2="400"/><line x1="414" y1="400" x2="442" y2="400"/><line x1="624" y1="400" x2="652" y2="400"/>
  </g>

  <text x="24" y="460" font-size="10" font-weight="700" fill="#8f1f1a">A lithium battery without a functioning BMS is a fire waiting for a trigger.</text>

  <defs>
    <marker id="dh" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#1e1b14"/>
    </marker>
  </defs>
</svg>
