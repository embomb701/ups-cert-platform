<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="ui-monospace, Consolas, monospace">
  <rect width="900" height="480" fill="#fbf9f4"/>

  <text x="24" y="32" font-size="18" font-weight="700" fill="#1e1b14">MRI Zones I–IV — Screening Gets Stricter as the Field Gets Real</text>

  <!-- zones -->
  <g font-size="10" font-weight="700">
    <rect x="24" y="55" width="200" height="90" rx="4" fill="#e9f4ef" stroke="#059669" stroke-width="2"/><text x="124" y="78" text-anchor="middle" fill="#065f46">Zone I</text><text x="124" y="96" font-weight="400" font-size="8.5" text-anchor="middle" fill="#5c5748">Publicly accessible</text><text x="124" y="110" font-weight="400" font-size="8.5" text-anchor="middle" fill="#5c5748">no screening</text>

    <rect x="234" y="55" width="200" height="90" rx="4" fill="#eef3f7" stroke="#0e7490" stroke-width="2"/><text x="334" y="78" text-anchor="middle" fill="#0e7490">Zone II</text><text x="334" y="96" font-weight="400" font-size="8.5" text-anchor="middle" fill="#3f3a2c">Transition — screening</text><text x="334" y="110" font-weight="400" font-size="8.5" text-anchor="middle" fill="#3f3a2c">occurs here</text>

    <rect x="444" y="55" width="200" height="90" rx="4" fill="#fdeec9" stroke="#b45309" stroke-width="2"/><text x="544" y="78" text-anchor="middle" fill="#b45309">Zone III</text><text x="544" y="96" font-weight="400" font-size="8.5" text-anchor="middle" fill="#8a5010">Controlled access —</text><text x="544" y="110" font-weight="400" font-size="8.5" text-anchor="middle" fill="#8a5010">screened individuals only</text>

    <rect x="654" y="55" width="222" height="90" rx="4" fill="#fdeaea" stroke="#a4231e" stroke-width="2.5"/><text x="765" y="78" text-anchor="middle" fill="#8f1f1a">Zone IV</text><text x="765" y="96" font-weight="400" font-size="8.5" text-anchor="middle" fill="#8f1f1a">The magnet room —</text><text x="765" y="110" font-weight="400" font-size="8.5" text-anchor="middle" fill="#8f1f1a">field is ALWAYS on</text>
  </g>
  <g stroke="#1e1b14" stroke-width="1.5" marker-end="url(#mr)">
    <line x1="224" y1="100" x2="232" y2="100"/><line x1="434" y1="100" x2="442" y2="100"/><line x1="644" y1="100" x2="652" y2="100"/>
  </g>

  <!-- 3 risks -->
  <rect x="24" y="165" width="852" height="105" rx="6" fill="#ffffff" stroke="#7a7256" stroke-width="1.5"/>
  <text x="38" y="188" font-size="12" font-weight="700" fill="#1e1b14">Three physics, three hazard types</text>
  <g font-size="9.5" font-weight="700">
    <rect x="38" y="200" width="260" height="50" rx="4" fill="#fdeaea" stroke="#a4231e"/><text x="168" y="220" text-anchor="middle" fill="#8f1f1a">Projectile risk</text><text x="168" y="236" font-weight="400" font-size="8" text-anchor="middle" fill="#5c5748">static field pulls ferromagnetic objects</text>

    <rect x="308" y="200" width="260" height="50" rx="4" fill="#fdeec9" stroke="#b45309"/><text x="438" y="220" text-anchor="middle" fill="#b45309">RF implant heating</text><text x="438" y="236" font-weight="400" font-size="8" text-anchor="middle" fill="#5c5748">conductive implants absorb RF energy</text>

    <rect x="578" y="200" width="260" height="50" rx="4" fill="#eef3f7" stroke="#0e7490"/><text x="708" y="220" text-anchor="middle" fill="#0e7490">Nerve stimulation</text><text x="708" y="236" font-weight="400" font-size="8" text-anchor="middle" fill="#5c5748">gradient field induces currents</text>
  </g>

  <!-- MRI conditional vs unsafe -->
  <rect x="24" y="285" width="852" height="95" rx="6" fill="#fdeaea" stroke="#a4231e" stroke-width="2"/>
  <text x="38" y="308" font-size="12.5" font-weight="700" fill="#8f1f1a">MRI-conditional vs. MRI-unsafe</text>
  <text x="38" y="330" font-size="10" fill="#5c5748">Conditional: tested and safe under DEFINED conditions (field strength, gradient limits, positioning).</text>
  <text x="38" y="344" font-size="10" fill="#5c5748">Unsafe: strictly prohibited from the MRI suite — no exceptions, no conditions that make it acceptable.</text>
  <text x="38" y="366" font-size="9.5" font-weight="700" fill="#8f1f1a">Never bring tools, carts, or O2 cylinders into Zone IV without verifying MRI-safe or MRI-conditional status first.</text>

  <rect x="24" y="395" width="852" height="55" rx="5" fill="#fff4e8" stroke="#d4802a" stroke-width="1.5"/>
  <text x="38" y="418" font-size="10.5" font-weight="700" fill="#7a3f14">The Zone IV field is continuously on, even when the scanner isn't actively imaging — the screening</text>
  <text x="38" y="434" font-size="10.5" font-weight="700" fill="#7a3f14">rule applies every time, not just during a scan.</text>

  <defs>
    <marker id="mr" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#1e1b14"/></marker>
  </defs>
</svg>
