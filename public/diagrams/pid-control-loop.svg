<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="ui-monospace, Consolas, monospace">
  <rect width="900" height="480" fill="#fbf9f4"/>

  <text x="24" y="32" font-size="18" font-weight="700" fill="#1e1b14">The Control Loop — Setpoint, Error, and Three Ways to Respond</text>

  <!-- loop diagram -->
  <g font-size="9.5" font-weight="700">
    <rect x="24" y="55" width="150" height="50" rx="4" fill="#eef3f7" stroke="#0e7490" stroke-width="2"/><text x="99" y="76" text-anchor="middle" fill="#0e7490">Setpoint</text><text x="99" y="92" font-weight="400" font-size="8.5" text-anchor="middle" fill="#5c5748">target value</text>

    <rect x="204" y="55" width="150" height="50" rx="4" fill="#fdeaea" stroke="#a4231e" stroke-width="2"/><text x="279" y="76" text-anchor="middle" fill="#a4231e">Error</text><text x="279" y="92" font-weight="400" font-size="8.5" text-anchor="middle" fill="#5c5748">setpoint − measured</text>

    <rect x="384" y="55" width="150" height="50" rx="4" fill="#fdeec9" stroke="#b45309" stroke-width="2"/><text x="459" y="76" text-anchor="middle" fill="#b45309">PID Controller</text><text x="459" y="92" font-weight="400" font-size="8.5" text-anchor="middle" fill="#5c5748">computes output</text>

    <rect x="564" y="55" width="150" height="50" rx="4" fill="#e9f4ef" stroke="#059669" stroke-width="2"/><text x="639" y="76" text-anchor="middle" fill="#065f46">Output</text><text x="639" y="92" font-weight="400" font-size="8.5" text-anchor="middle" fill="#5c5748">e.g. valve position</text>

    <rect x="744" y="55" width="132" height="50" rx="4" fill="#ffffff" stroke="#7a7256" stroke-width="1.5"/><text x="810" y="76" text-anchor="middle" fill="#1e1b14">Process</text><text x="810" y="92" font-weight="400" font-size="8.5" text-anchor="middle" fill="#5c5748">room temp</text>
  </g>
  <g stroke="#1e1b14" stroke-width="1.5" marker-end="url(#pl)">
    <line x1="174" y1="80" x2="202" y2="80"/><line x1="354" y1="80" x2="382" y2="80"/>
    <line x1="534" y1="80" x2="562" y2="80"/><line x1="714" y1="80" x2="742" y2="80"/>
  </g>
  <path d="M810,105 L810,130 L99,130 L99,107" fill="none" stroke="#5c5748" stroke-width="1.5" stroke-dasharray="3 2" marker-end="url(#pl2)"/>
  <text x="440" y="124" font-size="8.5" fill="#5c5748" text-anchor="middle">feedback — measured value returns to compare against setpoint</text>

  <!-- three modes -->
  <rect x="24" y="150" width="272" height="150" rx="6" fill="#eef3f7" stroke="#0e7490" stroke-width="2"/>
  <text x="38" y="173" font-size="12.5" font-weight="700" fill="#0e7490">P — Proportional</text>
  <text x="38" y="195" font-size="9.5" fill="#5c5748">Output ∝ error. Large error → large</text>
  <text x="38" y="209" font-size="9.5" fill="#5c5748">action; small error → small action.</text>
  <text x="38" y="231" font-size="9.5" font-weight="700" fill="#1f5a8f">Always has steady-state offset —</text>
  <text x="38" y="245" font-size="9.5" font-weight="700" fill="#1f5a8f">some error must exist to produce</text>
  <text x="38" y="259" font-size="9.5" font-weight="700" fill="#1f5a8f">any output at all.</text>

  <rect x="314" y="150" width="272" height="150" rx="6" fill="#fdeec9" stroke="#b45309" stroke-width="2"/>
  <text x="328" y="173" font-size="12.5" font-weight="700" fill="#b45309">I — Integral</text>
  <text x="328" y="195" font-size="9.5" fill="#5c5748">Sums error over time — eliminates</text>
  <text x="328" y="209" font-size="9.5" fill="#5c5748">the P-only steady-state offset.</text>
  <text x="328" y="231" font-size="9.5" font-weight="700" fill="#8a5010">Windup risk: accumulates while</text>
  <text x="328" y="245" font-size="9.5" font-weight="700" fill="#8a5010">output is saturated → overshoot</text>
  <text x="328" y="259" font-size="9.5" font-weight="700" fill="#8a5010">when control is restored.</text>

  <rect x="604" y="150" width="272" height="150" rx="6" fill="#fdeaea" stroke="#a4231e" stroke-width="2"/>
  <text x="618" y="173" font-size="12.5" font-weight="700" fill="#8f1f1a">D — Derivative</text>
  <text x="618" y="195" font-size="9.5" fill="#5c5748">Responds to rate of change of</text>
  <text x="618" y="209" font-size="9.5" fill="#5c5748">error — predictive "braking."</text>
  <text x="618" y="231" font-size="9.5" font-weight="700" fill="#8f1f1a">Sensitive to sensor noise —</text>
  <text x="618" y="245" font-size="9.5" font-weight="700" fill="#8f1f1a">needs filtering; rarely used in</text>
  <text x="618" y="259" font-size="9.5" font-weight="700" fill="#8f1f1a">slow, noisy HVAC processes.</text>

  <rect x="24" y="325" width="852" height="60" rx="5" fill="#e9f4ef" stroke="#059669" stroke-width="2"/>
  <text x="38" y="349" font-size="11.5" font-weight="700" fill="#065f46">Most HVAC control loops use PI, not PID</text>
  <text x="38" y="368" font-size="10" fill="#3f3a2c">HVAC processes are slow and noisy — the D term adds instability without meaningful benefit. Fast, precise loops (chilled water temp) may add D.</text>

  <rect x="24" y="400" width="852" height="64" rx="5" fill="#fff4e8" stroke="#d4802a" stroke-width="1.5"/>
  <text x="38" y="424" font-size="10.5" font-weight="700" fill="#7a3f14">Anti-windup clamps the integral term while output is saturated — without it, a long saturation period</text>
  <text x="38" y="440" font-size="10.5" font-weight="700" fill="#7a3f14">(e.g., a stuck valve at 100% open) bakes in a huge overshoot the moment the fault clears.</text>

  <defs>
    <marker id="pl" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#1e1b14"/></marker>
    <marker id="pl2" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#5c5748"/></marker>
  </defs>
</svg>
