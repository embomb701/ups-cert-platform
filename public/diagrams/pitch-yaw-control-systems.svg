<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="ui-monospace, Consolas, monospace">
  <rect width="900" height="480" fill="#fbf9f4"/>

  <text x="24" y="32" font-size="18" font-weight="700" fill="#1e1b14">Pitch and Yaw — the Two Systems That Aim and Regulate the Rotor</text>

  <!-- pitch -->
  <rect x="24" y="55" width="410" height="180" rx="6" fill="#eef3f7" stroke="#0e7490" stroke-width="2"/>
  <text x="38" y="78" font-size="12.5" font-weight="700" fill="#0e7490">Pitch control</text>
  <text x="38" y="100" font-size="9.5" fill="#3f3a2c">Below rated wind: fine pitch (≈0°) for</text>
  <text x="38" y="114" font-size="9.5" fill="#3f3a2c">maximum Cp. Above rated: feathers toward</text>
  <text x="38" y="128" font-size="9.5" fill="#3f3a2c">90° to hold constant rated power.</text>
  <rect x="38" y="140" width="358" height="46" rx="4" fill="#8f1f1a"/>
  <text x="217" y="159" font-size="9.5" font-weight="700" fill="#ffffff" text-anchor="middle">Emergency feather to 90° on controller</text>
  <text x="217" y="175" font-size="9.5" font-weight="700" fill="#ffffff" text-anchor="middle">fault, overspeed, or grid loss</text>
  <text x="38" y="204" font-size="9.5" font-weight="700" fill="#0e7490">Battery/supercap backup ensures feathering</text>
  <text x="38" y="218" font-size="9.5" font-weight="700" fill="#0e7490">works with zero grid power — verified every PM.</text>

  <!-- yaw -->
  <rect x="459" y="55" width="417" height="180" rx="6" fill="#fdeec9" stroke="#b45309" stroke-width="2"/>
  <text x="473" y="78" font-size="12.5" font-weight="700" fill="#b45309">Yaw control</text>
  <text x="473" y="100" font-size="9.5" fill="#3f3a2c">Wind vane / ultrasonic sensors drive yaw</text>
  <text x="473" y="114" font-size="9.5" fill="#3f3a2c">motors on a slewing ring gear to keep the</text>
  <text x="473" y="128" font-size="9.5" fill="#3f3a2c">nacelle aligned with wind direction.</text>
  <rect x="473" y="140" width="380" height="46" rx="4" fill="#b45309"/>
  <text x="663" y="159" font-size="9.5" font-weight="700" fill="#ffffff" text-anchor="middle">Each 1° of yaw misalignment ≈1.5%</text>
  <text x="663" y="175" font-size="9.5" font-weight="700" fill="#ffffff" text-anchor="middle">power loss (cos³ law)</text>
  <text x="473" y="204" font-size="9" fill="#5c5748">Small errors compound fast — yaw accuracy is a production metric, not just safety.</text>

  <!-- cable twist -->
  <rect x="24" y="255" width="852" height="115" rx="6" fill="#fdeaea" stroke="#a4231e" stroke-width="2"/>
  <text x="38" y="278" font-size="12.5" font-weight="700" fill="#8f1f1a">Cable twist — the yaw system's hard limit</text>
  <text x="38" y="300" font-size="10" fill="#5c5748">Cable twist accumulates as the nacelle yaws over time — a twist counter tracks cumulative angle.</text>
  <rect x="38" y="312" width="500" height="46" rx="4" fill="#8f1f1a"/>
  <text x="288" y="331" font-size="9.5" font-weight="700" fill="#ffffff" text-anchor="middle">±3 full turns (±1,080°) → turbine parks</text>
  <text x="288" y="347" font-size="9.5" font-weight="700" fill="#ffffff" text-anchor="middle">and runs an automatic unwind maneuver</text>
  <text x="564" y="335" font-size="9" font-weight="700" fill="#8f1f1a">Exceeding the hard stop can</text>
  <text x="564" y="349" font-size="9" font-weight="700" fill="#8f1f1a">sever power/control cables.</text>

  <rect x="24" y="380" width="852" height="80" rx="6" fill="#ffffff" stroke="#7a7256" stroke-width="1.5"/>
  <text x="38" y="403" font-size="11.5" font-weight="700" fill="#1e1b14">Pitch battery fails its capacity test at annual PM — the correct call</text>
  <text x="38" y="425" font-size="10" fill="#5c5748">Replace it before returning to service. Without backup, a grid-loss event during high wind can</text>
  <text x="38" y="439" font-size="10" fill="#5c5748">prevent emergency feathering — a direct overspeed risk, not a deferrable finding.</text>
</svg>
