<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="ui-monospace, Consolas, monospace">
  <rect width="900" height="480" fill="#fbf9f4"/>

  <text x="24" y="32" font-size="18" font-weight="700" fill="#1e1b14">Equipotential Bonding — NEC 680.26</text>
  <text x="24" y="52" font-size="12" fill="#5c5748">Bonding is NOT grounding — it creates an equal-potential island, it does not connect to earth ground.</text>

  <!-- bonded items row -->
  <text x="24" y="68" font-size="11" font-weight="700" fill="#8f1f1a">Everything metal within 5 ft of the water edge gets bonded:</text>
  <g font-size="10" font-weight="700">
    <rect x="24" y="76" width="134" height="44" rx="4" fill="#fdeaea" stroke="#a4231e" stroke-width="2"/><text x="32" y="96" fill="#8f1f1a">Ladder</text><text x="32" y="110" font-weight="400" font-size="8.5" fill="#8f1f1a">both legs</text>

    <rect x="168" y="76" width="134" height="44" rx="4" fill="#fdeaea" stroke="#a4231e" stroke-width="2"/><text x="176" y="96" fill="#8f1f1a">Handrail</text><text x="176" y="110" font-weight="400" font-size="8.5" fill="#8f1f1a">pool edge</text>

    <rect x="312" y="76" width="134" height="44" rx="4" fill="#fdeaea" stroke="#a4231e" stroke-width="2"/><text x="320" y="96" fill="#8f1f1a">Deck anchor</text><text x="320" y="110" font-weight="400" font-size="8.5" fill="#8f1f1a">board / slide</text>

    <rect x="456" y="76" width="134" height="44" rx="4" fill="#fdeaea" stroke="#a4231e" stroke-width="2"/><text x="464" y="96" fill="#8f1f1a">Light niche</text><text x="464" y="110" font-weight="400" font-size="8.5" fill="#8f1f1a">underwater fixture</text>

    <rect x="600" y="76" width="134" height="44" rx="4" fill="#fdeaea" stroke="#a4231e" stroke-width="2"/><text x="608" y="96" fill="#8f1f1a">Shell / rebar</text><text x="608" y="110" font-weight="400" font-size="8.5" fill="#8f1f1a">tied every ≤12 in</text>

    <rect x="744" y="76" width="134" height="44" rx="4" fill="#fdeaea" stroke="#a4231e" stroke-width="2"/><text x="752" y="96" fill="#8f1f1a">Pump/filter</text><text x="752" y="110" font-weight="400" font-size="8.5" fill="#8f1f1a">also grounded</text>
  </g>

  <!-- why this matters -->
  <rect x="24" y="140" width="410" height="190" rx="6" fill="#fdeaea" stroke="#a4231e" stroke-width="2"/>
  <text x="38" y="164" font-size="12.5" font-weight="700" fill="#8f1f1a">Why this matters</text>
  <text x="38" y="188" font-size="10.5" fill="#5c5748">Voltage gradients as small as 1–2 V in pool</text>
  <text x="38" y="202" font-size="10.5" fill="#5c5748">water can cause paralysis and drowning.</text>
  <text x="38" y="224" font-size="10.5" fill="#5c5748">Bonding puts all metal AND the water at the</text>
  <text x="38" y="238" font-size="10.5" fill="#5c5748">same potential — no voltage difference, no</text>
  <text x="38" y="252" font-size="10.5" fill="#5c5748">current through a person in the water.</text>
  <text x="38" y="278" font-size="10.5" font-weight="700" fill="#8f1f1a">Stray voltage can appear with zero wiring</text>
  <text x="38" y="292" font-size="10.5" font-weight="700" fill="#8f1f1a">errors — an electrician must trace the source.</text>
  <text x="38" y="314" font-size="9.5" fill="#8f1f1a">Pool shell / rebar carries the same bonding requirement as any metal fixture.</text>

  <!-- conductor spec -->
  <rect x="459" y="140" width="417" height="190" rx="6" fill="#eef3f7" stroke="#2a5f8f" stroke-width="2"/>
  <text x="473" y="164" font-size="12.5" font-weight="700" fill="#2a5f8f">Conductor spec</text>
  <text x="473" y="190" font-size="12" font-weight="700" fill="#1e1b14">#8 AWG solid copper minimum</text>
  <text x="473" y="209" font-size="10.5" fill="#5c5748">Aluminum is prohibited — corrosion risk in</text>
  <text x="473" y="223" font-size="10.5" fill="#5c5748">a wet, chlorinated environment.</text>
  <text x="473" y="245" font-size="10.5" font-weight="700" fill="#1e1b14">Concrete shells: bonded to rebar every</text>
  <text x="473" y="259" font-size="10.5" font-weight="700" fill="#1e1b14">≤12 inches — not just at a few tie points.</text>
  <text x="473" y="285" font-size="10.5" fill="#5c5748">Equipment (pump, filter, heater) housings</text>
  <text x="473" y="299" font-size="10.5" fill="#5c5748">get their own bonding jumper, separate</text>
  <text x="473" y="313" font-size="10.5" fill="#5c5748">from the equipment grounding conductor.</text>

  <rect x="24" y="345" width="852" height="80" rx="6" fill="#fff4e8" stroke="#d4802a" stroke-width="1.5"/>
  <text x="38" y="370" font-size="11" font-weight="700" fill="#7a3f14">Bonding ≠ grounding. The bonding conductor never connects to the service grounding</text>
  <text x="38" y="392" font-size="11" font-weight="700" fill="#7a3f14">electrode system — it&apos;s a separate, standalone equipotential safety system.</text>
  <text x="38" y="410" font-size="9.5" fill="#8a5010">A pool that "passes" a ground-fault test can still have a lethal bonding gap.</text>
</svg>
