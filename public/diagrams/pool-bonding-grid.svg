<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="ui-monospace, Consolas, monospace">
  <rect width="900" height="480" fill="#fbf9f4"/>

  <text x="24" y="32" font-size="18" font-weight="700" fill="#1e1b14">Equipotential Bonding — NEC 680.26</text>
  <text x="24" y="52" font-size="12" fill="#5c5748">Bonding is NOT grounding — it creates an equal-potential island, it does not connect to earth ground.</text>

  <!-- Pool top-down -->
  <ellipse cx="230" cy="250" rx="150" ry="100" fill="#e9f2fb" stroke="#0e7490" stroke-width="3"/>
  <text x="185" y="255" font-size="13" font-weight="700" fill="#0e7490">POOL WATER</text>

  <!-- bonding grid line around everything -->
  <g fill="none" stroke="#a4231e" stroke-width="2.5" stroke-dasharray="6 4">
    <ellipse cx="230" cy="250" rx="195" ry="145"/>
  </g>
  <text x="30" y="75" font-size="10.5" font-weight="700" fill="#a4231e">Bonding grid — all metal</text>
  <text x="30" y="88" font-size="10.5" font-weight="700" fill="#a4231e">within 5 ft of water edge</text>

  <!-- ladder -->
  <g stroke="#1e1b14" stroke-width="2.5">
    <line x1="230" y1="150" x2="230" y2="115"/>
    <line x1="215" y1="130" x2="245" y2="130"/>
  </g>
  <circle cx="230" cy="115" r="4" fill="#a4231e"/>
  <text x="248" y="118" font-size="10" font-weight="700" fill="#1e1b14">Ladder</text>

  <!-- handrail -->
  <g stroke="#1e1b14" stroke-width="2.5">
    <path d="M 330 175 L 355 155" />
  </g>
  <circle cx="355" cy="155" r="4" fill="#a4231e"/>
  <text x="365" y="150" font-size="10" font-weight="700" fill="#1e1b14">Handrail</text>

  <!-- deck anchor -->
  <rect x="90" y="345" width="18" height="12" fill="#1e1b14"/>
  <circle cx="99" cy="351" r="4" fill="#a4231e"/>
  <text x="35" y="378" font-size="10" font-weight="700" fill="#1e1b14">Deck anchor</text>

  <!-- light niche -->
  <circle cx="330" cy="330" r="10" fill="#f7c948" stroke="#1e1b14" stroke-width="1.5"/>
  <circle cx="330" cy="330" r="4" fill="#a4231e"/>
  <text x="345" y="345" font-size="10" font-weight="700" fill="#1e1b14">Light niche</text>

  <!-- rebar / shell -->
  <text x="150" y="330" font-size="10" font-weight="700" fill="#0e7490">Pool shell / rebar</text>
  <circle cx="230" cy="345" r="4" fill="#a4231e"/>

  <!-- equipment outside pool -->
  <rect x="420" y="345" width="120" height="55" rx="5" fill="#fdeec9" stroke="#7a3f14" stroke-width="2"/>
  <text x="432" y="365" font-size="10" font-weight="700" fill="#7a3f14">Pump / filter / heater</text>
  <text x="432" y="380" font-size="9" fill="#5c5748">metal housings — also</text>
  <text x="432" y="392" font-size="9" fill="#5c5748">bonded, not just grounded</text>
  <circle cx="425" cy="346" r="4" fill="#a4231e"/>
  <line x1="425" y1="346" x2="400" y2="320" stroke="#a4231e" stroke-width="2" stroke-dasharray="4 3"/>

  <!-- bonding conductor label -->
  <rect x="420" y="70" width="440" height="150" rx="6" fill="#fdeaea" stroke="#a4231e" stroke-width="2"/>
  <text x="435" y="95" font-size="12.5" font-weight="700" fill="#8f1f1a">Why this matters</text>
  <text x="435" y="116" font-size="10.5" fill="#5c5748">Voltage gradients as small as 1–2 V in pool</text>
  <text x="435" y="130" font-size="10.5" fill="#5c5748">water can cause paralysis and drowning.</text>
  <text x="435" y="150" font-size="10.5" fill="#5c5748">Bonding puts all metal AND the water at</text>
  <text x="435" y="164" font-size="10.5" fill="#5c5748">the same potential — no voltage difference,</text>
  <text x="435" y="178" font-size="10.5" fill="#5c5748">no current through a person in the water.</text>
  <text x="435" y="198" font-size="10.5" font-weight="700" fill="#8f1f1a">Stray voltage can appear with zero wiring</text>
  <text x="435" y="212" font-size="10.5" font-weight="700" fill="#8f1f1a">errors — an electrician must trace the source.</text>

  <rect x="420" y="235" width="440" height="90" rx="6" fill="#eef3f7" stroke="#2a5f8f" stroke-width="2"/>
  <text x="435" y="258" font-size="12" font-weight="700" fill="#2a5f8f">Conductor spec</text>
  <text x="435" y="278" font-size="11" fill="#1e1b14">#8 AWG solid copper minimum</text>
  <text x="435" y="295" font-size="10.5" fill="#5c5748">(aluminum prohibited — corrosion risk)</text>
  <text x="435" y="312" font-size="10.5" fill="#5c5748">Concrete shells: bonded to rebar every ≤12 in</text>

  <rect x="60" y="405" width="800" height="55" rx="5" fill="#fff4e8" stroke="#d4802a" stroke-width="1.5"/>
  <text x="75" y="427" font-size="11" font-weight="700" fill="#7a3f14">Bonding ≠ grounding. The bonding conductor never connects to the service grounding</text>
  <text x="75" y="444" font-size="11" font-weight="700" fill="#7a3f14">electrode system — it's a separate, standalone equipotential safety system.</text>
</svg>
