<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="ui-monospace, Consolas, monospace">
  <rect width="900" height="460" fill="#fbf9f4"/>

  <text x="24" y="32" font-size="18" font-weight="700" fill="#1e1b14">Three Filter Types — Finer Filtration, More Maintenance</text>

  <!-- Sand -->
  <rect x="40" y="60" width="260" height="330" rx="6" fill="#ffffff" stroke="#1e1b14" stroke-width="2.5"/>
  <text x="55" y="88" font-size="14" font-weight="700" fill="#1e1b14">Sand Filter</text>

  <rect x="70" y="105" width="200" height="140" fill="none" stroke="#1e1b14" stroke-width="2.5"/>
  <g fill="#e8dcc0">
    <rect x="72" y="107" width="196" height="100"/>
  </g>
  <g stroke="#c9a227" stroke-width="1">
    <circle cx="95" cy="130" r="2.5"/><circle cx="115" cy="145" r="2.5"/><circle cx="135" cy="125" r="2.5"/>
    <circle cx="155" cy="150" r="2.5"/><circle cx="175" cy="135" r="2.5"/><circle cx="195" cy="120" r="2.5"/>
    <circle cx="215" cy="145" r="2.5"/><circle cx="235" cy="130" r="2.5"/><circle cx="255" cy="150" r="2.5"/>
    <circle cx="105" cy="170" r="2.5"/><circle cx="145" cy="180" r="2.5"/><circle cx="185" cy="175" r="2.5"/>
    <circle cx="225" cy="185" r="2.5"/><circle cx="250" cy="175" r="2.5"/>
  </g>
  <line x1="72" y1="220" x2="268" y2="220" stroke="#7a7256" stroke-width="2"/>
  <text x="100" y="235" font-size="9.5" fill="#7a7256">lateral system</text>

  <rect x="70" y="258" width="200" height="34" rx="4" fill="#e9f2fb" stroke="#0e7490" stroke-width="2"/>
  <text x="85" y="280" font-size="13" font-weight="700" fill="#0e7490">20–40 microns</text>

  <text x="55" y="315" font-size="10.5" fill="#5c5748">Water flows down through</text>
  <text x="55" y="329" font-size="10.5" fill="#5c5748">silica sand or ZeoSand media</text>
  <text x="55" y="350" font-size="10.5" font-weight="700" fill="#1e1b14">Maintenance:</text>
  <text x="55" y="364" font-size="10.5" fill="#5c5748">Backwash every 2–6 weeks</text>

  <!-- Cartridge -->
  <rect x="320" y="60" width="260" height="330" rx="6" fill="#ffffff" stroke="#1e1b14" stroke-width="2.5"/>
  <text x="335" y="88" font-size="14" font-weight="700" fill="#1e1b14">Cartridge Filter</text>

  <g stroke="#0e7490" stroke-width="1.5" fill="none">
    <path d="M 400 105 L 400 245 M 415 105 L 415 245 M 430 105 L 430 245 M 445 105 L 445 245 M 460 105 L 460 245 M 475 105 L 475 245 M 490 105 L 490 245 M 500 105 L 500 245"/>
  </g>
  <rect x="395" y="100" width="110" height="150" rx="55" fill="none" stroke="#1e1b14" stroke-width="2.5"/>
  <text x="360" y="270" font-size="9.5" fill="#7a7256">pleated polyester element(s)</text>

  <rect x="350" y="258" width="200" height="34" rx="4" fill="#e9f2fb" stroke="#0e7490" stroke-width="2"/>
  <text x="365" y="280" font-size="13" font-weight="700" fill="#0e7490">10–15 microns</text>

  <text x="335" y="315" font-size="10.5" fill="#5c5748">No backwash valve needed —</text>
  <text x="335" y="329" font-size="10.5" fill="#5c5748">remove and hose to clean</text>
  <text x="335" y="350" font-size="10.5" font-weight="700" fill="#1e1b14">Maintenance:</text>
  <text x="335" y="364" font-size="10.5" fill="#5c5748">Clean every 4–6 weeks</text>

  <!-- DE -->
  <rect x="600" y="60" width="260" height="330" rx="6" fill="#ffffff" stroke="#1e1b14" stroke-width="2.5"/>
  <text x="615" y="88" font-size="14" font-weight="700" fill="#1e1b14">DE Filter</text>

  <g stroke="#7a3f14" stroke-width="1.5">
    <line x1="670" y1="105" x2="670" y2="245"/><line x1="690" y1="105" x2="690" y2="245"/>
    <line x1="710" y1="105" x2="710" y2="245"/><line x1="730" y1="105" x2="730" y2="245"/>
    <line x1="750" y1="105" x2="750" y2="245"/><line x1="770" y1="105" x2="770" y2="245"/>
  </g>
  <g fill="#fdeec9" opacity="0.7">
    <rect x="665" y="105" width="10" height="140"/><rect x="685" y="105" width="10" height="140"/>
    <rect x="705" y="105" width="10" height="140"/><rect x="725" y="105" width="10" height="140"/>
    <rect x="745" y="105" width="10" height="140"/><rect x="765" y="105" width="10" height="140"/>
  </g>
  <rect x="655" y="100" width="130" height="150" fill="none" stroke="#1e1b14" stroke-width="2.5"/>
  <text x="640" y="270" font-size="9.5" fill="#7a7256">fabric grids coated with DE powder</text>

  <rect x="630" y="258" width="200" height="34" rx="4" fill="#e9f2fb" stroke="#0e7490" stroke-width="2"/>
  <text x="645" y="280" font-size="13" font-weight="700" fill="#0e7490">3–5 microns (finest)</text>

  <text x="615" y="315" font-size="10.5" fill="#5c5748">Diatomaceous earth coats</text>
  <text x="615" y="329" font-size="10.5" fill="#5c5748">grids — clearest water</text>
  <text x="615" y="350" font-size="10.5" font-weight="700" fill="#1e1b14">Maintenance:</text>
  <text x="615" y="364" font-size="10.5" fill="#5c5748">Backwash monthly + recharge DE</text>

  <rect x="40" y="405" width="820" height="45" rx="5" fill="#fff4e8" stroke="#d4802a" stroke-width="1.5"/>
  <text x="55" y="425" font-size="11" font-weight="700" fill="#7a3f14">Never exceed the filter's rated max GPM — overpressure damages media/cartridges</text>
  <text x="55" y="440" font-size="11" font-weight="700" fill="#7a3f14">and lets unfiltered water bypass. NSF Standard 50 is the pool/spa quality benchmark.</text>
</svg>
