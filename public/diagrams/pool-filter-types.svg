<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="ui-monospace, Consolas, monospace">
  <rect width="900" height="460" fill="#fbf9f4"/>

  <text x="24" y="32" font-size="18" font-weight="700" fill="#1e1b14">Three Filter Types — Finer Filtration, More Maintenance</text>
  <text x="24" y="52" font-size="12" fill="#5c5748">Same job, three different media — the finer the filtration, the more attention it needs.</text>

  <!-- Sand -->
  <rect x="24" y="66" width="270" height="270" rx="6" fill="#ffffff" stroke="#1e1b14" stroke-width="2.5"/>
  <text x="38" y="90" font-size="14" font-weight="700" fill="#1e1b14">Sand Filter</text>

  <rect x="38" y="102" width="242" height="34" rx="4" fill="#e9f2fb" stroke="#0e7490" stroke-width="2"/>
  <text x="48" y="124" font-size="13" font-weight="700" fill="#0e7490">20–40 microns</text>

  <text x="38" y="158" font-size="10" fill="#5c5748">Water flows down through silica</text>
  <text x="38" y="172" font-size="10" fill="#5c5748">sand or ZeoSand media, filtering</text>
  <text x="38" y="186" font-size="10" fill="#5c5748">as it passes to the lateral system.</text>

  <rect x="38" y="205" width="242" height="52" rx="4" fill="#fff4e8" stroke="#d4802a" stroke-width="1.5"/>
  <text x="48" y="225" font-size="10" font-weight="700" fill="#7a3f14">Maintenance</text>
  <text x="48" y="243" font-size="10" fill="#7a3f14">Backwash every 2–6 weeks</text>

  <text x="38" y="285" font-size="9.5" fill="#5c5748">Coarsest media, lowest cost,</text>
  <text x="38" y="299" font-size="9.5" fill="#5c5748">most forgiving of neglect.</text>

  <!-- Cartridge -->
  <rect x="314" y="66" width="270" height="270" rx="6" fill="#ffffff" stroke="#1e1b14" stroke-width="2.5"/>
  <text x="328" y="90" font-size="14" font-weight="700" fill="#1e1b14">Cartridge Filter</text>

  <rect x="328" y="102" width="242" height="34" rx="4" fill="#e9f2fb" stroke="#0e7490" stroke-width="2"/>
  <text x="338" y="124" font-size="13" font-weight="700" fill="#0e7490">10–15 microns</text>

  <text x="328" y="158" font-size="10" fill="#5c5748">Pleated polyester element(s) —</text>
  <text x="328" y="172" font-size="10" fill="#5c5748">no backwash valve needed, remove</text>
  <text x="328" y="186" font-size="10" fill="#5c5748">the cartridge and hose it clean.</text>

  <rect x="328" y="205" width="242" height="52" rx="4" fill="#fff4e8" stroke="#d4802a" stroke-width="1.5"/>
  <text x="338" y="225" font-size="10" font-weight="700" fill="#7a3f14">Maintenance</text>
  <text x="338" y="243" font-size="10" fill="#7a3f14">Clean every 4–6 weeks</text>

  <text x="328" y="285" font-size="9.5" fill="#5c5748">No backwash water wasted —</text>
  <text x="328" y="299" font-size="9.5" fill="#5c5748">popular where water is metered.</text>

  <!-- DE -->
  <rect x="604" y="66" width="270" height="270" rx="6" fill="#ffffff" stroke="#1e1b14" stroke-width="2.5"/>
  <text x="618" y="90" font-size="14" font-weight="700" fill="#1e1b14">DE Filter</text>

  <rect x="618" y="102" width="242" height="34" rx="4" fill="#e9f2fb" stroke="#0e7490" stroke-width="2"/>
  <text x="628" y="124" font-size="13" font-weight="700" fill="#0e7490">3–5 microns (finest)</text>

  <text x="618" y="158" font-size="10" fill="#5c5748">Diatomaceous earth coats fabric</text>
  <text x="618" y="172" font-size="10" fill="#5c5748">grids inside the tank — produces</text>
  <text x="618" y="186" font-size="10" fill="#5c5748">the clearest water of the three.</text>

  <rect x="618" y="205" width="242" height="52" rx="4" fill="#fff4e8" stroke="#d4802a" stroke-width="1.5"/>
  <text x="628" y="225" font-size="10" font-weight="700" fill="#7a3f14">Maintenance</text>
  <text x="628" y="243" font-size="10" fill="#7a3f14">Backwash monthly + recharge DE</text>

  <text x="618" y="285" font-size="9.5" fill="#5c5748">Finest filtration, highest upkeep —</text>
  <text x="618" y="299" font-size="9.5" fill="#5c5748">spent DE must be handled per local rule.</text>

  <rect x="24" y="352" width="850" height="80" rx="6" fill="#fff4e8" stroke="#d4802a" stroke-width="1.5"/>
  <text x="38" y="377" font-size="11" font-weight="700" fill="#7a3f14">Never exceed the filter&apos;s rated max GPM — overpressure damages media/cartridges</text>
  <text x="38" y="397" font-size="11" font-weight="700" fill="#7a3f14">and lets unfiltered water bypass.</text>
  <text x="38" y="416" font-size="9.5" fill="#8a5010">NSF Standard 50 is the pool/spa filter quality benchmark across all three media types.</text>
</svg>
