<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="ui-monospace, Consolas, monospace">
  <rect width="900" height="480" fill="#fbf9f4"/>

  <text x="24" y="32" font-size="18" font-weight="700" fill="#1e1b14">Variable Speed Pump — Why Slower Is So Much Cheaper</text>
  <text x="24" y="52" font-size="12" fill="#5c5748">Power scales with the cube of speed — small speed cuts mean large savings.</text>

  <!-- component row -->
  <g font-size="10.5" font-weight="700">
    <rect x="24" y="66" width="270" height="46" rx="4" fill="#e9f2fb" stroke="#0e7490" stroke-width="2"/><text x="34" y="86" fill="#0e7490">Permanent magnet motor + VFD</text><text x="34" y="101" font-weight="400" font-size="9" fill="#4a6d8a">no capacitor failure mode</text>

    <rect x="310" y="66" width="270" height="46" rx="4" fill="#eef3f7" stroke="#7a7256" stroke-width="2"/><text x="320" y="86" fill="#5c5748">Impeller / volute</text><text x="320" y="101" font-weight="400" font-size="9" fill="#7a7256">converts motor torque to flow</text>

    <rect x="596" y="66" width="280" height="46" rx="4" fill="#fdeec9" stroke="#7a3f14" stroke-width="2"/><text x="606" y="86" fill="#7a3f14">Strainer basket</text><text x="606" y="101" font-weight="400" font-size="9" fill="#8a5010">catches debris before the impeller</text>
  </g>

  <rect x="24" y="122" width="852" height="32" rx="5" fill="#fff4e8" stroke="#d4802a" stroke-width="1.5"/>
  <text x="38" y="143" font-size="10.5" font-weight="700" fill="#7a3f14">DOE 2021: pool pumps &gt;1 HP for residential use must be variable speed — single-speed pumps above 1 HP can no longer be sold.</text>

  <!-- affinity laws panel -->
  <rect x="24" y="168" width="410" height="160" rx="6" fill="#e9f2fb" stroke="#0e7490" stroke-width="2"/>
  <text x="38" y="192" font-size="12.5" font-weight="700" fill="#0e7490">Pump affinity laws</text>
  <text x="38" y="218" font-size="13" font-weight="700" fill="#0e7490">Flow ∝ Speed</text>
  <text x="38" y="240" font-size="13" font-weight="700" fill="#0e7490">Head ∝ Speed²</text>
  <text x="38" y="262" font-size="13" font-weight="700" fill="#0e7490">Power ∝ Speed³</text>
  <text x="230" y="222" font-size="9.5" fill="#4a6d8a">Power is the one that</text>
  <text x="230" y="235" font-size="9.5" fill="#4a6d8a">matters for your bill.</text>
  <rect x="38" y="278" width="382" height="38" rx="4" fill="#fdeec9" stroke="#7a3f14" stroke-width="1.5"/>
  <text x="48" y="294" font-size="10" font-weight="700" fill="#7a3f14">Half speed = 1/8 power</text>
  <text x="48" y="309" font-size="9.5" fill="#5c5748">2,000 W at 3,450 RPM → 250 W at 1,725 RPM</text>

  <!-- operating ranges panel -->
  <rect x="459" y="168" width="417" height="160" rx="6" fill="#ffffff" stroke="#1e1b14" stroke-width="2"/>
  <text x="473" y="192" font-size="12.5" font-weight="700" fill="#1e1b14">Typical VSP operating ranges</text>

  <g font-size="10">
    <rect x="473" y="205" width="389" height="30" fill="#e9f2fb" stroke="#0e7490" stroke-width="1"/>
    <text x="483" y="224" fill="#0e7490" font-weight="700">Filtration</text>
    <text x="580" y="224" fill="#1e1b14">1,500–2,000 RPM — low flow, high efficiency</text>

    <rect x="473" y="237" width="389" height="30" fill="#fdeec9" stroke="#7a3f14" stroke-width="1"/>
    <text x="483" y="256" fill="#7a3f14" font-weight="700">Feature ops</text>
    <text x="580" y="256" fill="#1e1b14">2,500–3,000 RPM — jets, waterfalls</text>

    <rect x="473" y="269" width="389" height="30" fill="#fdeaea" stroke="#a4231e" stroke-width="1"/>
    <text x="483" y="288" fill="#8f1f1a" font-weight="700">Priming</text>
    <text x="580" y="288" fill="#1e1b14">3,450 RPM — full speed / vacuum</text>
  </g>
  <text x="473" y="316" font-size="9" fill="#5c5748">Match the range to the task — filtration never needs full speed.</text>

  <rect x="24" y="345" width="852" height="80" rx="6" fill="#ffffff" stroke="#1e1b14" stroke-width="1.5"/>
  <text x="38" y="368" font-size="11" font-weight="700" fill="#1e1b14">Cavitation (gravel-like noise, low flow, impeller erosion):</text>
  <text x="38" y="384" font-size="10.5" fill="#5c5748">air leak on suction, partially closed valve, or a clogged basket.</text>
  <text x="38" y="404" font-size="11" font-weight="700" fill="#1e1b14">Runs but zero flow, motor normal: air-bound — check priming, suction-side leaks, and stuck-open check valves.</text>
</svg>
