<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="ui-monospace, Consolas, monospace">
  <rect width="900" height="480" fill="#fbf9f4"/>

  <text x="24" y="32" font-size="18" font-weight="700" fill="#1e1b14">PUE — the Metric That Turns Infrastructure Into Dollars</text>

  <!-- formula -->
  <rect x="24" y="55" width="852" height="70" rx="6" fill="#eef3f7" stroke="#2563eb" stroke-width="2"/>
  <text x="38" y="82" font-size="15" font-weight="700" fill="#1e40af" font-family="ui-monospace,Consolas,monospace">PUE = Total Facility Power ÷ IT Equipment Power</text>
  <text x="38" y="108" font-size="9.5" fill="#3f3a2c">1.0 = theoretical perfection, all power to IT. Every fraction above 1.0 is overhead: cooling, lighting, conversion loss.</text>

  <!-- benchmarks -->
  <rect x="24" y="140" width="852" height="105" rx="6" fill="#ffffff" stroke="#7a7256" stroke-width="1.5"/>
  <text x="38" y="163" font-size="12" font-weight="700" fill="#1e1b14">Industry benchmark ladder</text>
  <g font-size="9.5" font-weight="700">
    <rect x="38" y="175" width="260" height="46" rx="4" fill="#e9f4ef" stroke="#059669"/><text x="168" y="196" text-anchor="middle" fill="#065f46">Hyperscale</text><text x="168" y="212" font-weight="400" font-size="8.5" text-anchor="middle" fill="#3f3a2c">1.10 – 1.15</text>

    <rect x="308" y="175" width="260" height="46" rx="4" fill="#fdeec9" stroke="#b45309"/><text x="438" y="196" text-anchor="middle" fill="#b45309">Typical colocation</text><text x="438" y="212" font-weight="400" font-size="8.5" text-anchor="middle" fill="#8a5010">1.4 – 1.6</text>

    <rect x="578" y="175" width="260" height="46" rx="4" fill="#fdeaea" stroke="#a4231e"/><text x="708" y="196" text-anchor="middle" fill="#8f1f1a">Older enterprise</text><text x="708" y="212" font-weight="400" font-size="8.5" text-anchor="middle" fill="#8f1f1a">1.8 – 2.5</text>
  </g>

  <!-- reading the trend -->
  <rect x="24" y="260" width="410" height="105" rx="6" fill="#fdeaea" stroke="#a4231e" stroke-width="2"/>
  <text x="38" y="283" font-size="12" font-weight="700" fill="#8f1f1a">A rising PUE means something</text>
  <text x="38" y="305" font-size="9.5" fill="#5c5748">Overhead growing faster than IT load —</text>
  <text x="38" y="319" font-size="9.5" fill="#5c5748">cooling degradation, aging UPS losses,</text>
  <text x="38" y="333" font-size="9.5" fill="#5c5748">or cooling wasted on underloaded zones.</text>
  <text x="38" y="353" font-size="9" fill="#5c5748">DCiE = 1/PUE × 100% — a PUE of 1.25 equals 80% DCiE.</text>

  <!-- financial impact -->
  <rect x="459" y="260" width="417" height="105" rx="6" fill="#e9f4ef" stroke="#059669" stroke-width="2"/>
  <text x="473" y="283" font-size="12" font-weight="700" fill="#065f46">Translating PUE to dollars</text>
  <text x="473" y="305" font-size="9.5" fill="#3f3a2c">10 MW facility at $0.07/kWh:</text>
  <rect x="473" y="317" width="290" height="26" rx="4" fill="#059669"/>
  <text x="618" y="335" font-size="9.5" font-weight="700" fill="#ffffff" text-anchor="middle">0.1 PUE improvement ≈ $500K/year</text>

  <rect x="24" y="380" width="852" height="80" rx="6" fill="#fff4e8" stroke="#d4802a" stroke-width="1.5"/>
  <text x="38" y="403" font-size="12" font-weight="700" fill="#7a3f14">PUE is a compliance metric now, not just an efficiency preference</text>
  <text x="38" y="425" font-size="10" fill="#5c5748">EU regulatory frameworks and some U.S. states are setting PUE thresholds for large data center permits —</text>
  <text x="38" y="439" font-size="10" fill="#5c5748">operations managers report and improve PUE as a regulatory obligation, on top of the cost-savings case.</text>
</svg>
