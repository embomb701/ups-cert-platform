<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="ui-monospace, Consolas, monospace">
  <rect width="900" height="460" fill="#fbf9f4"/>

  <text x="24" y="32" font-size="18" font-weight="700" fill="#1e1b14">The Operating Point — Where Pump Curve Meets System Curve</text>

  <!-- chart -->
  <rect x="24" y="55" width="500" height="280" rx="6" fill="#ffffff" stroke="#7a7256" stroke-width="1.5"/>
  <line x1="60" y1="300" x2="60" y2="80" stroke="#5c5748" stroke-width="1.5"/>
  <line x1="60" y1="300" x2="490" y2="300" stroke="#5c5748" stroke-width="1.5"/>
  <text x="30" y="90" font-size="9" fill="#5c5748">Head</text>
  <text x="450" y="318" font-size="9" fill="#5c5748">Flow (GPM)</text>

  <!-- pump curve (declining) -->
  <path d="M60,110 Q250,120 460,240" fill="none" stroke="#0284c7" stroke-width="2.5"/>
  <text x="330" y="150" font-size="9" font-weight="700" fill="#075985">Pump curve — head falls as flow rises</text>

  <!-- system curve (rising) -->
  <path d="M60,290 Q220,240 380,140" fill="none" stroke="#b45309" stroke-width="2.5"/>
  <text x="150" y="270" font-size="9" font-weight="700" fill="#b45309">System curve — friction rises with flow</text>

  <!-- BEP marker -->
  <circle cx="255" cy="150" r="6" fill="#059669"/>
  <text x="265" y="145" font-size="8.5" font-weight="700" fill="#065f46">BEP</text>

  <!-- operating point -->
  <circle cx="330" cy="175" r="6" fill="#a4231e"/>
  <line x1="330" y1="175" x2="330" y2="300" stroke="#a4231e" stroke-width="1" stroke-dasharray="3 2"/>
  <line x1="330" y1="175" x2="60" y2="175" stroke="#a4231e" stroke-width="1" stroke-dasharray="3 2"/>
  <text x="340" y="178" font-size="8.5" font-weight="700" fill="#8f1f1a">Operating point</text>

  <!-- explanation panel -->
  <rect x="549" y="55" width="327" height="280" rx="6" fill="#e9f4ef" stroke="#059669" stroke-width="2"/>
  <text x="563" y="78" font-size="12" font-weight="700" fill="#065f46">Best Efficiency Point (BEP)</text>
  <text x="563" y="100" font-size="9.5" fill="#3f3a2c">The flow rate at maximum pump</text>
  <text x="563" y="114" font-size="9.5" fill="#3f3a2c">efficiency — the design target.</text>
  <text x="563" y="136" font-size="9.5" font-weight="700" fill="#8f1f1a">Far from BEP: more vibration,</text>
  <text x="563" y="150" font-size="9.5" font-weight="700" fill="#8f1f1a">more heat, faster wear.</text>

  <text x="563" y="182" font-size="12" font-weight="700" fill="#1f5a8f">The operating point</text>
  <text x="563" y="204" font-size="9.5" fill="#3f3a2c">Where the pump curve and system</text>
  <text x="563" y="218" font-size="9.5" fill="#3f3a2c">curve intersect — that's where the</text>
  <text x="563" y="232" font-size="9.5" fill="#3f3a2c">pump will actually run.</text>
  <text x="563" y="254" font-size="9.5" font-weight="700" fill="#065f46">Design goal: put the operating point</text>
  <text x="563" y="268" font-size="9.5" font-weight="700" fill="#065f46">as close to BEP as the system allows.</text>

  <rect x="24" y="350" width="852" height="90" rx="6" fill="#fff4e8" stroke="#d4802a" stroke-width="1.5"/>
  <text x="38" y="373" font-size="12" font-weight="700" fill="#7a3f14">Reading the two curves together</text>
  <text x="38" y="395" font-size="10" fill="#5c5748">A pump curve is fixed by design and speed; the system curve is fixed by piping, elevation, and valve</text>
  <text x="38" y="409" font-size="10" fill="#5c5748">position. Change either one — a valve throttled, a filter clogging — and the operating point moves along the pump curve.</text>
</svg>
