<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="ui-monospace, Consolas, monospace">
  <rect width="900" height="460" fill="#fbf9f4"/>

  <text x="24" y="32" font-size="18" font-weight="700" fill="#1e1b14">Punch List to Acceptance — Closing a Project Out Cleanly</text>

  <!-- process chain -->
  <g font-size="9" font-weight="700">
    <rect x="24" y="55" width="195" height="55" rx="4" fill="#eef3f7" stroke="#0e7490" stroke-width="2"/><text x="121" y="80" text-anchor="middle" fill="#0e7490">Walkthrough</text><text x="121" y="95" font-weight="400" font-size="8" text-anchor="middle" fill="#5c5748">formal, with the customer</text>

    <rect x="239" y="55" width="195" height="55" rx="4" fill="#fdeec9" stroke="#b45309" stroke-width="2"/><text x="336" y="80" text-anchor="middle" fill="#b45309">Document items</text><text x="336" y="95" font-weight="400" font-size="8" text-anchor="middle" fill="#8a5010">description, location, owner, due date</text>

    <rect x="454" y="55" width="195" height="55" rx="4" fill="#fdeaea" stroke="#a4231e" stroke-width="2"/><text x="551" y="80" text-anchor="middle" fill="#8f1f1a">Resolve items</text><text x="551" y="95" font-weight="400" font-size="8" text-anchor="middle" fill="#8f1f1a">every item tracked to closure</text>

    <rect x="669" y="55" width="207" height="55" rx="4" fill="#e6f4f2" stroke="#0f766e" stroke-width="2"/><text x="772" y="80" text-anchor="middle" fill="#134e4a">Written acceptance</text><text x="772" y="95" font-weight="400" font-size="8" text-anchor="middle" fill="#3f3a2c">signed completion certificate</text>
  </g>
  <g stroke="#1e1b14" stroke-width="1.5" marker-end="url(#pl)">
    <line x1="219" y1="82" x2="237" y2="82"/><line x1="434" y1="82" x2="452" y2="82"/><line x1="649" y1="82" x2="667" y2="82"/>
  </g>

  <!-- punch list vs warranty -->
  <rect x="24" y="135" width="410" height="130" rx="6" fill="#fdeaea" stroke="#a4231e" stroke-width="2"/>
  <text x="38" y="158" font-size="12.5" font-weight="700" fill="#8f1f1a">Punch list item</text>
  <text x="38" y="180" font-size="9.5" fill="#5c5748">A deficiency from the ORIGINAL agreed</text>
  <text x="38" y="194" font-size="9.5" fill="#5c5748">scope — not yet complete or correct.</text>
  <text x="38" y="216" font-size="9.5" font-weight="700" fill="#8f1f1a">Must be resolved BEFORE final</text>
  <text x="38" y="230" font-size="9.5" font-weight="700" fill="#8f1f1a">acceptance is granted.</text>
  <text x="38" y="250" font-size="9" fill="#5c5748">Contractor's responsibility, part of the original scope.</text>

  <!-- warranty item -->
  <rect x="459" y="135" width="417" height="130" rx="6" fill="#eef3f7" stroke="#0e7490" stroke-width="2"/>
  <text x="473" y="158" font-size="12.5" font-weight="700" fill="#0e7490">Warranty item</text>
  <text x="473" y="180" font-size="9.5" fill="#3f3a2c">A FAILURE that occurs AFTER acceptance</text>
  <text x="473" y="194" font-size="9.5" fill="#3f3a2c">was already granted.</text>
  <text x="473" y="216" font-size="9.5" font-weight="700" fill="#1f5a8f">Covered under the warranty period,</text>
  <text x="473" y="230" font-size="9.5" font-weight="700" fill="#1f5a8f">not the original closeout process.</text>
  <text x="473" y="250" font-size="9" fill="#5c5748">Conflating punch list and warranty items causes payment/liability disputes.</text>

  <rect x="24" y="290" width="852" height="80" rx="6" fill="#fff4e8" stroke="#d4802a" stroke-width="1.5"/>
  <text x="38" y="313" font-size="12" font-weight="700" fill="#7a3f14">The written acceptance certificate is the finish line</text>
  <text x="38" y="335" font-size="10" fill="#5c5748">Certificate of Substantial Completion or Final Acceptance Sign-off — obtained only after every punch</text>
  <text x="38" y="349" font-size="10" fill="#5c5748">list item is resolved. Without it, the project isn't formally closed, regardless of how it feels on-site.</text>

  <rect x="24" y="385" width="852" height="42" rx="5" fill="#ffffff" stroke="#1e1b14" stroke-width="2"/>
  <text x="38" y="410" font-size="10.5" font-weight="700" fill="#1e1b14">Document every punch list item with owner and due date — a verbal "we'll get to it" is not a closeout plan.</text>

  <defs>
    <marker id="pl" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#1e1b14"/></marker>
  </defs>
</svg>
