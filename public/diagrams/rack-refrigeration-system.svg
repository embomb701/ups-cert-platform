<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="ui-monospace, Consolas, monospace">
  <rect width="900" height="480" fill="#fbf9f4"/>

  <text x="24" y="32" font-size="18" font-weight="700" fill="#1e1b14">Parallel Compressor Rack — One Suction Manifold, Many Loads</text>

  <!-- compressors on manifold -->
  <rect x="24" y="55" width="852" height="150" rx="6" fill="#e7f4f7" stroke="#0891b2" stroke-width="2"/>
  <text x="38" y="78" font-size="12.5" font-weight="700" fill="#0e6e85">Compressors share a common suction manifold</text>
  <g font-size="9.5" font-weight="700">
    <rect x="38" y="95" width="90" height="42" rx="4" fill="#0891b2"/><text x="83" y="120" text-anchor="middle" fill="#ffffff">Comp 1</text>
    <rect x="140" y="95" width="90" height="42" rx="4" fill="#0891b2"/><text x="185" y="120" text-anchor="middle" fill="#ffffff">Comp 2</text>
    <rect x="242" y="95" width="90" height="42" rx="4" fill="#0891b2"/><text x="287" y="120" text-anchor="middle" fill="#ffffff">Comp 3</text>
    <rect x="344" y="95" width="90" height="42" rx="4" fill="#0e6e85"/><text x="389" y="120" text-anchor="middle" fill="#ffffff">Comp N</text>
  </g>
  <line x1="38" y1="150" x2="434" y2="150" stroke="#0e6e85" stroke-width="3"/>
  <line x1="83" y1="137" x2="83" y2="150" stroke="#0e6e85" stroke-width="2"/><line x1="185" y1="137" x2="185" y2="150" stroke="#0e6e85" stroke-width="2"/>
  <line x1="287" y1="137" x2="287" y2="150" stroke="#0e6e85" stroke-width="2"/><line x1="389" y1="137" x2="389" y2="150" stroke="#0e6e85" stroke-width="2"/>
  <text x="38" y="168" font-size="9" font-weight="700" fill="#0e6e85">Common suction manifold — pulls from every case and walk-in at once</text>
  <text x="38" y="184" font-size="9.5" fill="#3f3a2c">Staged capacity: compressors cycle on/off or unload to match total store load in real time.</text>

  <g font-size="9.5" font-weight="700">
    <rect x="484" y="95" width="180" height="60" rx="4" fill="#ffffff" stroke="#7a7256" stroke-width="1.5"/><text x="494" y="116" fill="#1e1b14">Medium-temp rack</text><text x="494" y="132" font-weight="400" font-size="8.5" fill="#5c5748">~20–25°F evaporating</text><text x="494" y="145" font-weight="400" font-size="8.5" fill="#5c5748">dairy, produce</text>

    <rect x="684" y="95" width="176" height="60" rx="4" fill="#ffffff" stroke="#7a7256" stroke-width="1.5"/><text x="694" y="116" fill="#1e1b14">Low-temp rack</text><text x="694" y="132" font-weight="400" font-size="8.5" fill="#5c5748">~-25 to -20°F evaporating</text><text x="694" y="145" font-weight="400" font-size="8.5" fill="#5c5748">frozen food</text>
  </g>

  <!-- electronic controller -->
  <rect x="24" y="225" width="852" height="110" rx="6" fill="#ffffff" stroke="#7a7256" stroke-width="1.5"/>
  <text x="38" y="248" font-size="12.5" font-weight="700" fill="#1e1b14">Electronic rack controllers (Danfoss, Emerson/Copeland, Hussmann)</text>
  <g font-size="9.5" font-weight="700" fill="#0e6e85">
    <text x="50" y="272">• Compressor staging</text>
    <text x="280" y="272">• Floating head + suction pressure</text>
    <text x="590" y="272">• Defrost scheduling</text>
  </g>
  <text x="38" y="296" font-size="9.5" fill="#5c5748">Remote monitoring via Modbus, LonWorks, or Ethernet.</text>
  <text x="38" y="316" font-size="9.5" font-weight="700" fill="#0e6e85">Parallel racks beat single-compressor systems on part-load efficiency — staging precisely matches actual load.</text>

  <rect x="24" y="355" width="852" height="55" rx="5" fill="#fff4e8" stroke="#d4802a" stroke-width="1.5"/>
  <text x="38" y="378" font-size="10.5" font-weight="700" fill="#7a3f14">One dirty condenser or one stuck compressor unloader affects every case on that rack —</text>
  <text x="38" y="394" font-size="10.5" font-weight="700" fill="#7a3f14">rack diagnosis starts at the manifold, not at the individual case.</text>
</svg>
