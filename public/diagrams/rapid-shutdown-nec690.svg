<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="ui-monospace, Consolas, monospace">
  <rect width="900" height="480" fill="#fbf9f4"/>

  <text x="24" y="32" font-size="18" font-weight="700" fill="#1e1b14">NEC 690.12 Rapid Shutdown — Built for the Worst Day</text>

  <!-- the rule -->
  <rect x="24" y="55" width="852" height="80" rx="6" fill="#fdeaea" stroke="#a4231e" stroke-width="2"/>
  <text x="38" y="78" font-size="12.5" font-weight="700" fill="#8f1f1a">The firefighter provision</text>
  <text x="38" y="100" font-size="10" fill="#5c5748">Rooftop conductors must fall to safe voltage inside the array boundary — ≤80 V within 30 seconds of</text>
  <text x="38" y="114" font-size="10" fill="#5c5748">initiation — so crews can cut, vent, and walk roofs without meeting live 600 V home runs.</text>

  <!-- implementation -->
  <rect x="24" y="150" width="410" height="130" rx="6" fill="#fdf6d9" stroke="#ca8a04" stroke-width="2"/>
  <text x="38" y="173" font-size="12" font-weight="700" fill="#a16207">Implementation — module-level electronics</text>
  <text x="38" y="195" font-size="9.5" fill="#3f3a2c">Optimizers, micros, or dedicated MLRSD</text>
  <text x="38" y="209" font-size="9.5" fill="#3f3a2c">devices answer a transmitter's heartbeat.</text>
  <text x="38" y="231" font-size="9.5" font-weight="700" fill="#78350f">Initiation (marked RSD switch, or killing</text>
  <text x="38" y="245" font-size="9.5" font-weight="700" fill="#78350f">AC) silences the heartbeat — every module's</text>
  <text x="38" y="259" font-size="9.5" font-weight="700" fill="#78350f">electronics collapse their output.</text>

  <!-- service fault category -->
  <rect x="459" y="150" width="417" height="130" rx="6" fill="#eef3f7" stroke="#0e7490" stroke-width="2"/>
  <text x="473" y="173" font-size="12" font-weight="700" fill="#0e7490">RSD is a real service fault category</text>
  <text x="473" y="195" font-size="9.5" fill="#3f3a2c">Dead transmitter/power supply → whole array</text>
  <text x="473" y="209" font-size="9.5" fill="#3f3a2c">collapses — the "no DC voltage anywhere"</text>
  <text x="473" y="223" font-size="9.5" fill="#3f3a2c">mystery, obediently shut down, not failed.</text>
  <text x="473" y="245" font-size="9.5" font-weight="700" fill="#1f5a8f">Know the site's RSD scheme BEFORE diagnosing</text>
  <text x="473" y="259" font-size="9.5" font-weight="700" fill="#1f5a8f">the DC side — zero voltage may mean it's working.</text>

  <!-- testing -->
  <rect x="24" y="300" width="852" height="100" rx="6" fill="#ffffff" stroke="#7a7256" stroke-width="1.5"/>
  <text x="38" y="323" font-size="12" font-weight="700" fill="#1e1b14">Testing at commissioning and every PM</text>
  <g font-size="9.5" font-weight="700">
    <rect x="38" y="335" width="180" height="26" rx="4" fill="#f3efe2" stroke="#7a7256"/><text x="128" y="352" text-anchor="middle" fill="#1e1b14">1. Initiate</text>
    <rect x="230" y="335" width="220" height="26" rx="4" fill="#f3efe2" stroke="#7a7256"/><text x="340" y="352" text-anchor="middle" fill="#1e1b14">2. Verify collapse at boundary</text>
    <rect x="462" y="335" width="180" height="26" rx="4" fill="#f3efe2" stroke="#7a7256"/><text x="552" y="352" text-anchor="middle" fill="#1e1b14">3. Restore</text>
    <rect x="654" y="335" width="200" height="26" rx="4" fill="#f3efe2" stroke="#7a7256"/><text x="754" y="352" text-anchor="middle" fill="#1e1b14">4. Verify handshake</text>
  </g>
  <text x="38" y="382" font-size="9.5" font-weight="700" fill="#8f1f1a">The system that exists for the worst day gets tested on the good ones.</text>

  <rect x="24" y="410" width="852" height="55" rx="5" fill="#fff4e8" stroke="#d4802a" stroke-width="1.5"/>
  <text x="38" y="430" font-size="10.5" font-weight="700" fill="#7a3f14">Article 690 shapes conductor sizing too — the 1.56 stack on Isc (125% continuous sun ×</text>
  <text x="38" y="447" font-size="10.5" font-weight="700" fill="#7a3f14">125% continuous-duty conductors) that makes the DC side legal.</text>
</svg>
