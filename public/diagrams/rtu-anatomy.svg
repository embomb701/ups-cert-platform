<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="ui-monospace, Consolas, monospace">
  <rect width="900" height="480" fill="#fbf9f4"/>

  <text x="24" y="32" font-size="18" font-weight="700" fill="#1e1b14">Rooftop Unit — the Entire System on a Curb</text>
  <text x="24" y="52" font-size="12" fill="#5c5748">Everything a split system spreads across two locations lives in one cabinet, staged in independent circuits.</text>

  <!-- section row -->
  <g font-size="10" font-weight="700">
    <rect x="24" y="66" width="163" height="58" rx="4" fill="#e9f2fb" stroke="#0e7490" stroke-width="2"/><text x="34" y="86" fill="#0e7490">Condenser section</text><text x="34" y="101" font-weight="400" font-size="8.5" fill="#4a6d8a">2+ compressors,</text><text x="34" y="113" font-weight="400" font-size="8.5" fill="#4a6d8a">separate circuits</text>

    <rect x="197" y="66" width="163" height="58" rx="4" fill="#fdeec9" stroke="#7a3f14" stroke-width="2"/><text x="207" y="86" fill="#7a3f14">Evaporator coil</text><text x="207" y="101" font-weight="400" font-size="8.5" fill="#8a5010">+ blower fan in</text><text x="207" y="113" font-weight="400" font-size="8.5" fill="#8a5010">the airstream</text>

    <rect x="370" y="66" width="163" height="58" rx="4" fill="#fdeaea" stroke="#a4231e" stroke-width="2"/><text x="380" y="86" fill="#8f1f1a">Gas heat section</text><text x="380" y="101" font-weight="400" font-size="8.5" fill="#8f1f1a">or electric strips /</text><text x="380" y="113" font-weight="400" font-size="8.5" fill="#8f1f1a">heat pump circuit</text>

    <rect x="543" y="66" width="163" height="58" rx="4" fill="#eef3f7" stroke="#2a5f8f" stroke-width="2"/><text x="553" y="86" fill="#2a5f8f">Filters + outdoor-</text><text x="553" y="101" font-weight="400" font-size="8.5" fill="#4a6d8a">air hood + control</text><text x="553" y="113" font-weight="400" font-size="8.5" fill="#4a6d8a">panel</text>

    <rect x="716" y="66" width="160" height="58" rx="4" fill="#fdeec9" stroke="#7a3f14" stroke-width="2.5"/><text x="726" y="86" fill="#7a3f14">Staged capacity</text><text x="726" y="101" font-weight="400" font-size="8.5" fill="#8a5010">circuits run and fail</text><text x="726" y="113" font-weight="400" font-size="8.5" fill="#8a5010">independently</text>
  </g>

  <rect x="24" y="132" width="852" height="30" rx="5" fill="#ffffff" stroke="#7a7256" stroke-width="1.5"/>
  <text x="38" y="152" font-size="10.5" fill="#5c5748">Roof curb — supply and return ducts drop straight through the curb into the space below.</text>

  <rect x="24" y="172" width="852" height="34" rx="5" fill="#fdeec9" stroke="#7a3f14" stroke-width="1.5"/>
  <text x="38" y="193" font-size="10.5" font-weight="700" fill="#7a3f14">Half of "weak RTU" complaints are one dead stage — check each circuit's pressures and amps separately.</text>

  <!-- safety panel -->
  <rect x="24" y="218" width="410" height="200" rx="6" fill="#fdeaea" stroke="#a4231e" stroke-width="2"/>
  <text x="38" y="242" font-size="12.5" font-weight="700" fill="#8f1f1a">Roof safety first</text>
  <text x="38" y="265" font-size="10" fill="#5c5748">Ladder/hatch discipline, unprotected edges,</text>
  <text x="38" y="279" font-size="10" fill="#5c5748">weather exposure.</text>
  <text x="38" y="301" font-size="10" font-weight="700" fill="#8f1f1a">208/230/460V 3-phase — LOTO at the unit</text>
  <text x="38" y="315" font-size="10" font-weight="700" fill="#8f1f1a">disconnect applies on a roof exactly as anywhere.</text>
  <text x="38" y="337" font-size="9.5" fill="#5c5748">Belt-drive pulleys (fingers), spring-loaded panels</text>
  <text x="38" y="351" font-size="9.5" fill="#5c5748">in wind, hot roofs — hydrate.</text>
  <text x="38" y="373" font-size="9.5" fill="#8f1f1a">A rooftop call is a fall-protection call before it's an HVAC call.</text>

  <!-- PM panel -->
  <rect x="459" y="218" width="417" height="200" rx="6" fill="#eef3f7" stroke="#2a5f8f" stroke-width="2"/>
  <text x="473" y="242" font-size="12.5" font-weight="700" fill="#2a5f8f">PM rhythm</text>
  <text x="473" y="265" font-size="10" fill="#1e1b14">Filters, belt condition and tension, pulley</text>
  <text x="473" y="279" font-size="10" fill="#1e1b14">alignment, bearings, both coils cleaned.</text>
  <text x="473" y="301" font-size="10" fill="#1e1b14">Condensate traps matched to cabinet</text>
  <text x="473" y="315" font-size="10" fill="#1e1b14">pressure, per-circuit electrical checked.</text>
  <text x="473" y="337" font-size="10" font-weight="700" fill="#2a5f8f">Heat exchanger check before every</text>
  <text x="473" y="351" font-size="10" font-weight="700" fill="#2a5f8f">heating season — not after the first call.</text>

  <rect x="24" y="435" width="852" height="35" rx="5" fill="#fff4e8" stroke="#d4802a" stroke-width="1.5"/>
  <text x="38" y="457" font-size="10.5" font-weight="700" fill="#7a3f14">Everything in one cabinet means one bad connection can take down what looks like two problems at once.</text>
</svg>
