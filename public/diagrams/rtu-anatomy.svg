<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="ui-monospace, Consolas, monospace">
  <rect width="900" height="460" fill="#fbf9f4"/>

  <text x="24" y="32" font-size="18" font-weight="700" fill="#1e1b14">Rooftop Unit — The Entire System on a Curb</text>

  <!-- RTU cabinet -->
  <rect x="60" y="60" width="620" height="180" rx="6" fill="#ffffff" stroke="#1e1b14" stroke-width="3"/>

  <!-- condenser section -->
  <rect x="75" y="75" width="140" height="150" rx="4" fill="#e9f2fb" stroke="#0e7490" stroke-width="2"/>
  <text x="85" y="98" font-size="10.5" font-weight="700" fill="#0e7490">Condenser section</text>
  <circle cx="110" cy="140" r="18" fill="none" stroke="#0e7490" stroke-width="2"/>
  <circle cx="180" cy="140" r="18" fill="none" stroke="#0e7490" stroke-width="2"/>
  <text x="85" y="200" font-size="9.5" fill="#5c5748">2+ compressors,</text>
  <text x="85" y="213" font-size="9.5" fill="#5c5748">separate circuits</text>

  <!-- evap + blower -->
  <rect x="225" y="75" width="140" height="150" rx="4" fill="#fdeec9" stroke="#7a3f14" stroke-width="2"/>
  <text x="235" y="98" font-size="10.5" font-weight="700" fill="#7a3f14">Evaporator coil</text>
  <text x="235" y="112" font-size="9.5" fill="#5c5748">+ blower in airstream</text>
  <circle cx="295" cy="160" r="25" fill="none" stroke="#7a3f14" stroke-width="2"/>
  <path d="M 295 160 L 310 148 M 295 160 L 313 163 M 295 160 L 300 178" stroke="#7a3f14" stroke-width="1.5"/>

  <!-- gas heat section -->
  <rect x="375" y="75" width="140" height="150" rx="4" fill="#fdeaea" stroke="#a4231e" stroke-width="2"/>
  <text x="385" y="98" font-size="10.5" font-weight="700" fill="#a4231e">Gas heat section</text>
  <text x="385" y="112" font-size="9.5" fill="#5c5748">(or electric strips /</text>
  <text x="385" y="125" font-size="9.5" fill="#5c5748">heat pump circuit)</text>
  <text x="385" y="200" font-size="9.5" fill="#5c5748">multi-stage gas</text>
  <text x="385" y="213" font-size="9.5" fill="#5c5748">valves / burner racks</text>

  <!-- outdoor air hood + controls -->
  <rect x="525" y="75" width="155" height="150" rx="4" fill="#eef3f7" stroke="#2a5f8f" stroke-width="2"/>
  <text x="535" y="98" font-size="10.5" font-weight="700" fill="#2a5f8f">Filters + outdoor-</text>
  <text x="535" y="112" font-size="10.5" font-weight="700" fill="#2a5f8f">air hood</text>
  <text x="535" y="140" font-size="9.5" fill="#5c5748">often neglected</text>
  <text x="535" y="153" font-size="9.5" fill="#5c5748">into collapse</text>
  <text x="535" y="185" font-size="10" font-weight="700" fill="#2a5f8f">Control panel</text>

  <!-- roof curb -->
  <path d="M 100 240 L 640 240 L 610 280 L 130 280 Z" fill="#e8e2d0" stroke="#1e1b14" stroke-width="2"/>
  <text x="300" y="264" font-size="10.5" font-weight="700" fill="#7a7256">Roof curb — supply/return ducts drop through</text>

  <!-- staging callout -->
  <rect x="710" y="60" width="150" height="180" rx="6" fill="#fdeec9" stroke="#7a3f14" stroke-width="2"/>
  <text x="722" y="83" font-size="11.5" font-weight="700" fill="#7a3f14">Staged capacity</text>
  <text x="722" y="105" font-size="9.5" fill="#5c5748">Circuits are</text>
  <text x="722" y="118" font-size="9.5" fill="#5c5748">independent —</text>
  <text x="722" y="131" font-size="9.5" fill="#5c5748">check each one's</text>
  <text x="722" y="144" font-size="9.5" fill="#5c5748">pressures and amps</text>
  <text x="722" y="157" font-size="9.5" fill="#5c5748">separately.</text>
  <text x="722" y="180" font-size="9.5" font-weight="700" fill="#a4231e">Half of "weak RTU"</text>
  <text x="722" y="193" font-size="9.5" font-weight="700" fill="#a4231e">complaints are one</text>
  <text x="722" y="206" font-size="9.5" font-weight="700" fill="#a4231e">dead stage.</text>

  <!-- safety + PM callouts -->
  <rect x="60" y="300" width="400" height="130" rx="6" fill="#fdeaea" stroke="#a4231e" stroke-width="2"/>
  <text x="75" y="323" font-size="12" font-weight="700" fill="#8f1f1a">Roof safety first</text>
  <text x="75" y="343" font-size="10" fill="#5c5748">Ladder/hatch discipline, unprotected</text>
  <text x="75" y="357" font-size="10" fill="#5c5748">edges, weather exposure. 208/230/460V</text>
  <text x="75" y="371" font-size="10" fill="#5c5748">3-phase — LOTO at the unit disconnect</text>
  <text x="75" y="385" font-size="10" fill="#5c5748">applies on a roof exactly as anywhere.</text>
  <text x="75" y="405" font-size="9.5" fill="#5c5748">Belt-drive pulleys (fingers), spring-loaded</text>
  <text x="75" y="418" font-size="9.5" fill="#5c5748">panels in wind, hot roofs — hydrate.</text>

  <rect x="480" y="300" width="380" height="130" rx="6" fill="#eef3f7" stroke="#2a5f8f" stroke-width="2"/>
  <text x="495" y="323" font-size="12" font-weight="700" fill="#2a5f8f">PM rhythm</text>
  <text x="495" y="343" font-size="10" fill="#5c5748">Filters, belt condition + tension,</text>
  <text x="495" y="357" font-size="10" fill="#5c5748">pulley alignment, bearings, both coils</text>
  <text x="495" y="371" font-size="10" fill="#5c5748">cleaned, condensate traps matched to</text>
  <text x="495" y="385" font-size="10" fill="#5c5748">cabinet pressure, per-circuit electrical,</text>
  <text x="495" y="399" font-size="10" fill="#5c5748">heat exchanger check before every</text>
  <text x="495" y="413" font-size="10" fill="#5c5748">heating season.</text>
</svg>
