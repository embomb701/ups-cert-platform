<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="ui-monospace, Consolas, monospace">
  <rect width="900" height="460" fill="#fbf9f4"/>

  <text x="24" y="32" font-size="18" font-weight="700" fill="#1e1b14">Salt Chlorine Generator — Electrolysis Cell</text>

  <!-- cell cutaway -->
  <rect x="50" y="70" width="330" height="230" rx="6" fill="#ffffff" stroke="#1e1b14" stroke-width="2.5"/>
  <text x="65" y="95" font-size="13" font-weight="700" fill="#1e1b14">Cell Cross-Section</text>

  <rect x="80" y="115" width="270" height="120" rx="4" fill="#e9f2fb" stroke="#0e7490" stroke-width="2"/>
  <!-- electrode plates -->
  <g stroke="#7a7256" stroke-width="4">
    <line x1="110" y1="120" x2="110" y2="230"/>
    <line x1="140" y1="120" x2="140" y2="230"/>
    <line x1="170" y1="120" x2="170" y2="230"/>
    <line x1="200" y1="120" x2="200" y2="230"/>
    <line x1="230" y1="120" x2="230" y2="230"/>
    <line x1="260" y1="120" x2="260" y2="230"/>
    <line x1="290" y1="120" x2="290" y2="230"/>
    <line x1="320" y1="120" x2="320" y2="230"/>
  </g>
  <text x="95" y="250" font-size="9.5" fill="#5c5748">Titanium ruthenium-oxide coated plates</text>

  <!-- flow arrows -->
  <path d="M 60 175 L 78 175" stroke="#0e7490" stroke-width="2.5" marker-end="url(#af)"/>
  <text x="55" y="195" font-size="9.5" fill="#0e7490">salt water in</text>
  <path d="M 352 175 L 370 175" stroke="#0e7490" stroke-width="2.5" marker-end="url(#af)"/>
  <text x="330" y="195" font-size="9" fill="#0e7490">HOCl out</text>

  <rect x="65" y="265" width="300" height="26" rx="4" fill="#fdeec9" stroke="#7a3f14" stroke-width="1.5"/>
  <text x="78" y="282" font-size="10.5" font-weight="700" fill="#7a3f14">NaCl + electrolysis → Cl₂ → HOCl (active sanitizer)</text>

  <!-- salt range -->
  <rect x="420" y="70" width="440" height="80" rx="6" fill="#e9f2fb" stroke="#0e7490" stroke-width="2"/>
  <text x="435" y="93" font-size="12.5" font-weight="700" fill="#0e7490">Required salt level</text>
  <text x="435" y="115" font-size="15" font-weight="700" fill="#1e1b14">2,700–3,400 ppm</text>
  <text x="435" y="135" font-size="10" fill="#5c5748">(seawater ≈ 35,000 ppm — this is mild)</text>
  <text x="650" y="108" font-size="9.5" fill="#5c5748">Below range: low-salt</text>
  <text x="650" y="121" font-size="9.5" fill="#5c5748">lockout. Above range:</text>
  <text x="650" y="134" font-size="9.5" fill="#5c5748">efficiency drops and</text>
  <text x="650" y="147" font-size="9.5" fill="#5c5748">corrosion risk rises.</text>

  <!-- self cleaning -->
  <text x="420" y="180" font-size="13" font-weight="700" fill="#1e1b14">Self-Cleaning: Polarity Reversal</text>

  <rect x="420" y="195" width="200" height="80" rx="5" fill="#fdeec9" stroke="#7a3f14" stroke-width="2"/>
  <text x="432" y="215" font-size="10.5" font-weight="700" fill="#7a3f14">Forward polarity</text>
  <text x="432" y="233" font-size="9.5" fill="#5c5748">Calcium scale deposits</text>
  <text x="432" y="246" font-size="9.5" fill="#5c5748">on the cathode plate</text>
  <text x="432" y="264" font-size="9.5" fill="#5c5748">during normal operation</text>

  <path d="M 630 235 L 655 235" stroke="#1e1b14" stroke-width="2" marker-end="url(#af)"/>

  <rect x="660" y="195" width="200" height="80" rx="5" fill="#eef3f7" stroke="#2a5f8f" stroke-width="2"/>
  <text x="672" y="215" font-size="10.5" font-weight="700" fill="#2a5f8f">Reversed (every few hrs)</text>
  <text x="672" y="233" font-size="9.5" fill="#5c5748">Former cathode becomes</text>
  <text x="672" y="246" font-size="9.5" fill="#5c5748">anode — scale is</text>
  <text x="672" y="264" font-size="9.5" fill="#5c5748">electrochemically released</text>

  <rect x="420" y="290" width="440" height="60" rx="5" fill="#fdeaea" stroke="#a4231e" stroke-width="1.5"/>
  <text x="432" y="311" font-size="10.5" font-weight="700" fill="#8f1f1a">Manual cleaning (scale beyond self-clean):</text>
  <text x="432" y="327" font-size="10" fill="#5c5748">soak in 1:10 muriatic acid:water, 15–30 min.</text>
  <text x="432" y="341" font-size="10" fill="#5c5748">Never use abrasives — damages the coating.</text>

  <rect x="50" y="365" width="810" height="80" rx="6" fill="#ffffff" stroke="#1e1b14" stroke-width="2"/>
  <text x="65" y="388" font-size="12" font-weight="700" fill="#1e1b14">Low chlorine output, salt level correct — check before replacing the cell:</text>
  <text x="65" y="410" font-size="10.5" fill="#5c5748">1. Cell age (7,000–15,000 hrs / 3–7 yrs typical life)   2. Water temp &lt;60°F cuts output sharply</text>
  <text x="65" y="428" font-size="10.5" fill="#5c5748">3. High CYA stabilizer level   4. High bather load or algae demand</text>

  <defs>
    <marker id="af" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1e1b14"/>
    </marker>
  </defs>
</svg>
