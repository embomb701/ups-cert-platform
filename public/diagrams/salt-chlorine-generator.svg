<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="ui-monospace, Consolas, monospace">
  <rect width="900" height="480" fill="#fbf9f4"/>

  <text x="24" y="32" font-size="18" font-weight="700" fill="#1e1b14">Salt Chlorine Generator — Electrolysis Cell</text>
  <text x="24" y="52" font-size="12" fill="#5c5748">Salt water in, active sanitizer out — the cell makes chlorine on demand, on site.</text>

  <!-- process row -->
  <g font-size="10.5" font-weight="700">
    <rect x="24" y="66" width="260" height="48" rx="4" fill="#e9f2fb" stroke="#0e7490" stroke-width="2"/><text x="34" y="88" fill="#0e7490">Salt water in</text><text x="34" y="103" font-weight="400" font-size="9" fill="#4a6d8a">2,700–3,400 ppm NaCl solution</text>

    <rect x="298" y="66" width="300" height="48" rx="4" fill="#eef3f7" stroke="#7a7256" stroke-width="2"/><text x="308" y="88" fill="#5c5748">Electrolysis cell</text><text x="308" y="103" font-weight="400" font-size="9" fill="#7a7256">Ti / ruthenium-oxide coated plates</text>

    <rect x="612" y="66" width="264" height="48" rx="4" fill="#fdeec9" stroke="#7a3f14" stroke-width="2.5"/><text x="622" y="88" fill="#7a3f14">HOCl out</text><text x="622" y="103" font-weight="400" font-size="9" fill="#8a5010">active sanitizer produced on-site</text>
  </g>
  <g stroke="#1e1b14" stroke-width="1.5" marker-end="url(#sc)">
    <line x1="284" y1="90" x2="296" y2="90"/><line x1="598" y1="90" x2="610" y2="90"/>
  </g>

  <rect x="24" y="122" width="852" height="30" rx="5" fill="#fdeec9" stroke="#7a3f14" stroke-width="1.5"/>
  <text x="38" y="142" font-size="10.5" font-weight="700" fill="#7a3f14">NaCl + electrolysis → Cl₂ → HOCl (active sanitizer)</text>

  <!-- required salt level -->
  <rect x="24" y="162" width="410" height="190" rx="6" fill="#e9f2fb" stroke="#0e7490" stroke-width="2"/>
  <text x="38" y="186" font-size="12.5" font-weight="700" fill="#0e7490">Required salt level</text>
  <text x="38" y="216" font-size="17" font-weight="700" fill="#1e1b14">2,700–3,400 ppm</text>
  <text x="38" y="236" font-size="9.5" fill="#5c5748">Seawater ≈ 35,000 ppm — this is mild.</text>
  <text x="38" y="262" font-size="10" font-weight="700" fill="#1e1b14">Below range:</text>
  <text x="130" y="262" font-size="10" fill="#5c5748">low-salt lockout, no output</text>
  <text x="38" y="280" font-size="10" font-weight="700" fill="#1e1b14">Above range:</text>
  <text x="130" y="280" font-size="10" fill="#5c5748">efficiency drops, corrosion risk rises</text>
  <text x="38" y="306" font-size="9.5" fill="#4a6d8a">Test salt level before troubleshooting output —</text>
  <text x="38" y="320" font-size="9.5" fill="#4a6d8a">it&apos;s the first variable to rule out.</text>
  <text x="38" y="338" font-size="9.5" fill="#4a6d8a">A generator reading &quot;low salt&quot; with correct ppm points to a bad sensor cell.</text>

  <!-- self-cleaning -->
  <rect x="459" y="162" width="417" height="190" rx="6" fill="#ffffff" stroke="#1e1b14" stroke-width="2"/>
  <text x="473" y="186" font-size="12.5" font-weight="700" fill="#1e1b14">Self-cleaning: polarity reversal</text>

  <rect x="473" y="198" width="175" height="70" rx="5" fill="#fdeec9" stroke="#7a3f14" stroke-width="2"/>
  <text x="483" y="217" font-size="10" font-weight="700" fill="#7a3f14">Forward polarity</text>
  <text x="483" y="234" font-size="9" fill="#5c5748">Calcium scale deposits on</text>
  <text x="483" y="247" font-size="9" fill="#5c5748">the cathode plate during</text>
  <text x="483" y="260" font-size="9" fill="#5c5748">normal operation.</text>

  <line x1="648" y1="233" x2="672" y2="233" stroke="#1e1b14" stroke-width="2" marker-end="url(#sc)"/>

  <rect x="678" y="198" width="185" height="70" rx="5" fill="#eef3f7" stroke="#2a5f8f" stroke-width="2"/>
  <text x="688" y="217" font-size="10" font-weight="700" fill="#2a5f8f">Reversed (every few hrs)</text>
  <text x="688" y="234" font-size="9" fill="#5c5748">Former cathode becomes</text>
  <text x="688" y="247" font-size="9" fill="#5c5748">anode — scale is electro-</text>
  <text x="688" y="260" font-size="9" fill="#5c5748">chemically released.</text>

  <rect x="473" y="278" width="390" height="60" rx="5" fill="#fdeaea" stroke="#a4231e" stroke-width="1.5"/>
  <text x="483" y="298" font-size="10" font-weight="700" fill="#8f1f1a">Manual cleaning (scale beyond self-clean):</text>
  <text x="483" y="314" font-size="9.5" fill="#5c5748">Soak in 1:10 muriatic acid:water, 15–30 min.</text>
  <text x="483" y="328" font-size="9.5" fill="#5c5748">Never use abrasives — damages the coating.</text>

  <rect x="24" y="368" width="852" height="90" rx="6" fill="#ffffff" stroke="#1e1b14" stroke-width="2"/>
  <text x="38" y="391" font-size="12" font-weight="700" fill="#1e1b14">Low chlorine output, salt level correct — check before replacing the cell:</text>
  <text x="38" y="413" font-size="10.5" fill="#5c5748">1. Cell age (7,000–15,000 hrs / 3–7 yrs typical life)   2. Water temp &lt;60°F cuts output sharply</text>
  <text x="38" y="432" font-size="10.5" fill="#5c5748">3. High CYA stabilizer level   4. High bather load or algae demand</text>
  <text x="38" y="450" font-size="9.5" fill="#7a7256">Replace the cell only after these four are ruled out — it's the most expensive part in the system.</text>

  <defs>
    <marker id="sc" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#1e1b14"/>
    </marker>
  </defs>
</svg>
