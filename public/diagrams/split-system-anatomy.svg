<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="ui-monospace, Consolas, monospace">
  <rect width="900" height="480" fill="#fbf9f4"/>

  <text x="24" y="32" font-size="18" font-weight="700" fill="#1e1b14">Split System — Two Boxes, One Circuit</text>
  <text x="24" y="52" font-size="12" fill="#5c5748">The same refrigeration circuit as an RTU, split across two locations by a line set.</text>

  <!-- line set -->
  <g font-size="10.5" font-weight="700">
    <rect x="24" y="64" width="410" height="42" rx="4" fill="#eef3f7" stroke="#2a5f8f" stroke-width="2"/>
    <text x="34" y="84" fill="#2a5f8f">Suction line</text><text x="34" y="99" font-weight="400" font-size="9" fill="#4a6d8a">insulated end to end — bare in a hot attic = capacity loss</text>

    <rect x="459" y="64" width="417" height="42" rx="4" fill="#fdeaea" stroke="#a4231e" stroke-width="2"/>
    <text x="469" y="84" fill="#8f1f1a">Liquid line</text><text x="469" y="99" font-weight="400" font-size="9" fill="#8f1f1a">flare/brazed joints = leak sites</text>
  </g>

  <!-- Indoor Section -->
  <rect x="24" y="118" width="410" height="270" rx="6" fill="#ffffff" stroke="#1e1b14" stroke-width="2.5"/>
  <text x="38" y="142" font-size="13" font-weight="700" fill="#1e1b14">Indoor Section</text>

  <rect x="38" y="152" width="382" height="58" rx="5" fill="#e9f2fb" stroke="#0f766e" stroke-width="2"/>
  <text x="48" y="172" font-size="10.5" font-weight="700" fill="#0f766e">Evaporator coil</text>
  <text x="48" y="188" font-size="9.5" fill="#4a6d8a">On the furnace or in an air handler —</text>
  <text x="48" y="202" font-size="9.5" fill="#7a7256">a dusty A-coil is a starved return.</text>

  <rect x="38" y="216" width="382" height="78" rx="5" fill="#fdeec9" stroke="#7a3f14" stroke-width="2"/>
  <text x="48" y="236" font-size="10.5" font-weight="700" fill="#7a3f14">Condensate system</text>
  <text x="48" y="252" font-size="9.5" fill="#5c5748">Primary drain with trap, plus a secondary</text>
  <text x="48" y="266" font-size="9.5" fill="#5c5748">drain, overflow pan, or float switch.</text>
  <text x="48" y="283" font-size="9.5" font-weight="700" fill="#a4231e">A tripped float switch reads as a "dead" system.</text>

  <rect x="38" y="304" width="382" height="70" rx="5" fill="#fdeaea" stroke="#a4231e" stroke-width="1.5"/>
  <text x="48" y="324" font-size="10" font-weight="700" fill="#8f1f1a">Clogged condensate drain is among the most</text>
  <text x="48" y="338" font-size="10" font-weight="700" fill="#8f1f1a">common summer calls —</text>
  <text x="48" y="358" font-size="10" font-weight="700" fill="#8f1f1a">a float switch is a 2-minute fix.</text>

  <!-- Outdoor Unit -->
  <rect x="459" y="118" width="417" height="270" rx="6" fill="#ffffff" stroke="#1e1b14" stroke-width="2.5"/>
  <text x="473" y="142" font-size="13" font-weight="700" fill="#1e1b14">Outdoor Unit</text>

  <rect x="473" y="152" width="389" height="66" rx="5" fill="#eef3f7" stroke="#1e1b14" stroke-width="2"/>
  <text x="483" y="172" font-size="10.5" font-weight="700" fill="#1e1b14">Condenser fan + condenser coil</text>
  <text x="483" y="188" font-size="9.5" fill="#5c5748">Cottonwood, grass clippings, and dog-run</text>
  <text x="483" y="202" font-size="9.5" fill="#7a7256">dust foul the coil — clean it every season.</text>

  <rect x="473" y="224" width="389" height="70" rx="5" fill="#fdeec9" stroke="#7a3f14" stroke-width="2.5"/>
  <text x="483" y="244" font-size="10.5" font-weight="700" fill="#7a3f14">Dual run capacitor</text>
  <text x="483" y="260" font-size="9.5" fill="#5c5748">Fan + compressor in one can —</text>
  <text x="483" y="276" font-size="9.5" font-weight="700" fill="#a4231e">the single most-replaced part in residential AC.</text>
  <text x="483" y="289" font-size="9" fill="#a4231e">Test, don&apos;t guess.</text>

  <rect x="473" y="300" width="389" height="60" rx="5" fill="#eef3f7" stroke="#2a5f8f" stroke-width="2"/>
  <text x="483" y="320" font-size="10.5" font-weight="700" fill="#2a5f8f">Two service valves</text>
  <text x="483" y="336" font-size="9.5" fill="#5c5748">Your gauge connections and the system&apos;s</text>
  <text x="483" y="350" font-size="9.5" fill="#5c5748">isolation points for pump-down or recovery.</text>

  <rect x="24" y="405" width="852" height="55" rx="5" fill="#fff4e8" stroke="#d4802a" stroke-width="1.5"/>
  <text x="38" y="426" font-size="10.5" font-weight="700" fill="#7a3f14">Bare suction line through a hot attic causes capacity loss and sweating, not liquid slugging.</text>
  <text x="38" y="443" font-size="10.5" font-weight="700" fill="#7a3f14">Length/elevation limits and oil return come from the manufacturer, not guesswork.</text>
</svg>
