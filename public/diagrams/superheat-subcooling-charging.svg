<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="ui-monospace, Consolas, monospace">
  <rect width="900" height="480" fill="#fbf9f4"/>

  <text x="24" y="32" font-size="18" font-weight="700" fill="#1e1b14">Superheat &amp; Subcooling — Two Numbers, Measured at Two Different Places</text>

  <!-- superheat -->
  <rect x="24" y="55" width="410" height="165" rx="6" fill="#e9f4ef" stroke="#059669" stroke-width="2"/>
  <text x="38" y="78" font-size="13" font-weight="700" fill="#065f46">Superheat — at the suction line</text>
  <text x="38" y="100" font-size="10" fill="#3f3a2c">Vapor temperature ABOVE saturation temp</text>
  <text x="38" y="114" font-size="10" fill="#3f3a2c">at the evaporator outlet pressure.</text>
  <rect x="38" y="126" width="180" height="26" rx="4" fill="#059669"/>
  <text x="128" y="143" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">Target: 8–12°F</text>
  <text x="38" y="170" font-size="9.5" font-weight="700" fill="#065f46">Too high → undercharged / restricted</text>
  <text x="38" y="184" font-size="9.5" font-weight="700" fill="#065f46">liquid line</text>
  <text x="38" y="202" font-size="9.5" font-weight="700" fill="#8f1f1a">Too low → liquid slugging the compressor</text>

  <!-- subcooling -->
  <rect x="459" y="55" width="417" height="165" rx="6" fill="#eef3f7" stroke="#0e7490" stroke-width="2"/>
  <text x="473" y="78" font-size="13" font-weight="700" fill="#0e7490">Subcooling — at the liquid line</text>
  <text x="473" y="100" font-size="10" fill="#3f3a2c">Liquid temperature BELOW saturation temp</text>
  <text x="473" y="114" font-size="10" fill="#3f3a2c">at the condenser outlet, leaving the condenser.</text>
  <rect x="473" y="126" width="180" height="26" rx="4" fill="#0e7490"/>
  <text x="563" y="143" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">Target: 10–15°F</text>
  <text x="473" y="170" font-size="9.5" font-weight="700" fill="#1f5a8f">Too low → flash gas forms before the</text>
  <text x="473" y="184" font-size="9.5" font-weight="700" fill="#1f5a8f">metering device — erratic TXV, lost capacity</text>

  <!-- diagnostic signature -->
  <rect x="24" y="235" width="852" height="70" rx="6" fill="#fdeaea" stroke="#a4231e" stroke-width="2"/>
  <text x="38" y="258" font-size="12" font-weight="700" fill="#8f1f1a">Classic undercharge signature</text>
  <text x="38" y="280" font-size="10.5" fill="#5c5748">35°F superheat (vs. target 8–12°F) + 4°F subcooling (vs. target 10–15°F) on a fixed-orifice</text>
  <text x="38" y="294" font-size="10.5" fill="#5c5748">system = not enough refrigerant to fully cool the condenser or feed the evaporator.</text>

  <!-- charging methods -->
  <g font-size="9.5" font-weight="700">
    <rect x="24" y="320" width="410" height="90" rx="4" fill="#ffffff" stroke="#7a7256" stroke-width="1.5"/>
    <text x="38" y="342" fill="#1e1b14">Charge by weight</text>
    <text x="38" y="360" font-weight="400" font-size="9.5" fill="#5c5748">New installs — evacuate to ≤500 microns,</text>
    <text x="38" y="374" font-weight="400" font-size="9.5" fill="#5c5748">weigh in the exact nameplate charge.</text>
    <text x="38" y="394" font-weight="400" font-size="9.5" fill="#5c5748">Most accurate method available.</text>

    <rect x="459" y="320" width="417" height="90" rx="4" fill="#ffffff" stroke="#7a7256" stroke-width="1.5"/>
    <text x="473" y="342" fill="#1e1b14">Charge by superheat</text>
    <text x="473" y="360" font-weight="400" font-size="9.5" fill="#5c5748">Field method, fixed-orifice residential systems —</text>
    <text x="473" y="374" font-weight="400" font-size="9.5" fill="#5c5748">manufacturer chart: outdoor WB + indoor DB →</text>
    <text x="473" y="388" font-weight="400" font-size="9.5" fill="#5c5748">target superheat.</text>
  </g>

  <rect x="24" y="422" width="852" height="42" rx="5" fill="#fff4e8" stroke="#d4802a" stroke-width="1.5"/>
  <text x="38" y="447" font-size="10.5" font-weight="700" fill="#7a3f14">R-410A and R-32 are zeotropic blends — always charge as LIQUID (invert cylinder or liquid-port adapter) to avoid fractionation.</text>
</svg>
