<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="ui-monospace, Consolas, monospace">
  <rect width="900" height="480" fill="#fbf9f4"/>

  <text x="24" y="32" font-size="18" font-weight="700" fill="#1e1b14">From Nameplate Watts to Delivered kWh — the Real-World Chain</text>

  <!-- PSH -->
  <rect x="24" y="55" width="410" height="115" rx="6" fill="#fdeec9" stroke="#b45309" stroke-width="2"/>
  <text x="38" y="78" font-size="12.5" font-weight="700" fill="#b45309">Peak sun hours (PSH)</text>
  <text x="38" y="100" font-size="9.5" fill="#5c5748">Equivalent hours of 1000 W/m² irradiance</text>
  <text x="38" y="114" font-size="9.5" fill="#5c5748">that deliver the same daily energy as the</text>
  <text x="38" y="128" font-size="9.5" fill="#5c5748">actual varying irradiance across the day.</text>
  <text x="38" y="150" font-size="9.5" font-weight="700" fill="#8a5010">NREL PVWatts (TMY data) is the industry-standard</text>
  <text x="38" y="164" font-size="9.5" font-weight="700" fill="#8a5010">production estimate tool for residential proposals.</text>

  <!-- shading / MLPE -->
  <rect x="459" y="55" width="417" height="115" rx="6" fill="#fdeaea" stroke="#a4231e" stroke-width="2"/>
  <text x="473" y="78" font-size="12.5" font-weight="700" fill="#8f1f1a">Shading — the disproportionate loss</text>
  <text x="473" y="100" font-size="9.5" fill="#5c5748">Series strings share one current — one</text>
  <text x="473" y="114" font-size="9.5" fill="#5c5748">shaded sub-string drags the whole string down.</text>
  <text x="473" y="136" font-size="9.5" font-weight="700" fill="#8f1f1a">MLPE (optimizers/microinverters) give per-module</text>
  <text x="473" y="150" font-size="9.5" font-weight="700" fill="#8f1f1a">MPPT — the fix for shaded or complex roofs.</text>

  <!-- tilt/azimuth -->
  <rect x="24" y="190" width="410" height="90" rx="6" fill="#eef3f7" stroke="#0e7490" stroke-width="2"/>
  <text x="38" y="213" font-size="12" font-weight="700" fill="#0e7490">Tilt &amp; azimuth</text>
  <text x="38" y="235" font-size="9.5" fill="#5c5748">Northern Hemisphere: south-facing at latitude</text>
  <text x="38" y="249" font-size="9.5" fill="#5c5748">tilt = maximum annual energy.</text>
  <text x="38" y="264" font-size="9.5" font-weight="700" fill="#1f5a8f">East/west orientation costs ~15–20% annually.</text>

  <!-- derate stack -->
  <rect x="459" y="190" width="417" height="90" rx="6" fill="#ffffff" stroke="#7a7256" stroke-width="1.5"/>
  <text x="473" y="213" font-size="12" font-weight="700" fill="#1e1b14">Derate factor stack</text>
  <text x="473" y="235" font-size="9" fill="#5c5748">Soiling 2–5% · Wiring 2% · Inverter 96–98% eff.</text>
  <text x="473" y="249" font-size="9" fill="#5c5748">Mismatch 1–2% · Availability 1% · Aging 0.5%/yr</text>
  <text x="473" y="266" font-size="9.5" font-weight="700" fill="#1e1b14">Typical system-level derate: 0.77–0.85</text>

  <!-- worked example -->
  <rect x="24" y="300" width="852" height="90" rx="6" fill="#e9f4ef" stroke="#059669" stroke-width="2"/>
  <text x="38" y="323" font-size="12" font-weight="700" fill="#065f46">Worked example — Phoenix, AZ</text>
  <text x="38" y="349" font-size="10.5" fill="#3f3a2c">10 kW (STC) × 6.5 PSH = 65 kWh/day at STC</text>
  <text x="38" y="368" font-size="10.5" font-weight="700" fill="#065f46">× 0.82 derate = 53.3 kWh/day actual → ≈19,455 kWh/year</text>

  <rect x="24" y="405" width="852" height="55" rx="5" fill="#fff4e8" stroke="#d4802a" stroke-width="1.5"/>
  <text x="38" y="428" font-size="10.5" font-weight="700" fill="#7a3f14">STC (1000 W/m², 25°C cell, AM1.5) is the nameplate reference — PTC (1000 W/m², 20°C ambient, 1 m/s wind)</text>
  <text x="38" y="444" font-size="10.5" font-weight="700" fill="#7a3f14">runs 10–15% below STC and better represents real field output.</text>
</svg>
