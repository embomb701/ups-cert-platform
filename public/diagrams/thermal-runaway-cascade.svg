<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="ui-monospace, Consolas, monospace">
  <rect width="900" height="480" fill="#fbf9f4"/>

  <text x="24" y="32" font-size="18" font-weight="700" fill="#1e1b14">Thermal Runaway — the Hazard That Writes Every BESS Rule</text>

  <!-- cascade chain -->
  <g font-size="9.5" font-weight="700">
    <rect x="24" y="55" width="195" height="55" rx="4" fill="#fdeec9" stroke="#b45309" stroke-width="2"/><text x="121" y="78" text-anchor="middle" fill="#b45309">Abuse</text><text x="121" y="94" font-weight="400" font-size="8" text-anchor="middle" fill="#5c5748">overcharge, crush, puncture, heat</text>

    <rect x="239" y="55" width="195" height="55" rx="4" fill="#fdeec9" stroke="#b45309" stroke-width="2"/><text x="336" y="78" text-anchor="middle" fill="#b45309">Exothermic breakdown</text><text x="336" y="94" font-weight="400" font-size="8" text-anchor="middle" fill="#5c5748">heat + flammable gas released</text>

    <rect x="454" y="55" width="195" height="55" rx="4" fill="#fdeaea" stroke="#a4231e" stroke-width="2"/><text x="551" y="78" text-anchor="middle" fill="#8f1f1a">Self-accelerating</text><text x="551" y="94" font-weight="400" font-size="8" text-anchor="middle" fill="#5c5748">temperature rises faster</text>

    <rect x="669" y="55" width="207" height="55" rx="4" fill="#fdeaea" stroke="#a4231e" stroke-width="2.5"/><text x="772" y="78" text-anchor="middle" fill="#8f1f1a">Propagation</text><text x="772" y="94" font-weight="400" font-size="8" text-anchor="middle" fill="#5c5748">cell → cell → module cascade</text>
  </g>
  <g stroke="#1e1b14" stroke-width="1.5" marker-end="url(#tr)">
    <line x1="219" y1="82" x2="237" y2="82"/><line x1="434" y1="82" x2="452" y2="82"/><line x1="649" y1="82" x2="667" y2="82"/>
  </g>

  <!-- why smothering fails -->
  <rect x="24" y="130" width="410" height="120" rx="6" fill="#fdeaea" stroke="#a4231e" stroke-width="2"/>
  <text x="38" y="153" font-size="12" font-weight="700" fill="#8f1f1a">Why smothering fails</text>
  <text x="38" y="175" font-size="9.5" fill="#5c5748">Once started, runaway does not need external</text>
  <text x="38" y="189" font-size="9.5" fill="#5c5748">oxygen — the cell's own chemistry supplies it.</text>
  <text x="38" y="211" font-size="9.5" font-weight="700" fill="#8f1f1a">Water's job is COOLING neighbors to stop</text>
  <text x="38" y="225" font-size="9.5" font-weight="700" fill="#8f1f1a">propagation, not extinguishing the chemistry.</text>
  <text x="38" y="242" font-size="8.5" fill="#5c5748">"Extinguished" battery fires reignite hours or days later — stranded energy.</text>

  <!-- prevention layers -->
  <rect x="459" y="130" width="417" height="120" rx="6" fill="#e9f4ef" stroke="#059669" stroke-width="2"/>
  <text x="473" y="153" font-size="12" font-weight="700" fill="#065f46">Prevention — the layers you service</text>
  <g font-size="9.5" font-weight="700" fill="#065f46">
    <text x="485" y="176">• BMS operating window (first fence)</text>
    <text x="485" y="192">• Mechanical protection (impact clearances)</text>
    <text x="485" y="208">• Thermal management (cooling, ambient limits)</text>
    <text x="485" y="224">• Charge discipline (never charge frozen/swollen/damaged)</text>
  </g>

  <!-- field trigger awareness -->
  <rect x="24" y="270" width="852" height="105" rx="6" fill="#ffffff" stroke="#7a7256" stroke-width="1.5"/>
  <text x="38" y="293" font-size="12" font-weight="700" fill="#1e1b14">Field trigger-awareness — the walkaround catalog</text>
  <g font-size="9.5" font-weight="700">
    <rect x="38" y="305" width="195" height="36" rx="4" fill="#fdeaea" stroke="#a4231e"/><text x="135" y="323" text-anchor="middle" fill="#8f1f1a">Swelling</text><text x="135" y="336" font-weight="400" font-size="7.5" text-anchor="middle" fill="#5c5748">venting-pressure evidence</text>

    <rect x="245" y="305" width="195" height="36" rx="4" fill="#fdeec9" stroke="#b45309"/><text x="342" y="323" text-anchor="middle" fill="#b45309">Impact/drops</text><text x="342" y="336" font-weight="400" font-size="7.5" text-anchor="middle" fill="#5c5748">quarantine even if it "seems fine"</text>

    <rect x="452" y="305" width="195" height="36" rx="4" fill="#fdeec9" stroke="#b45309"/><text x="549" y="323" text-anchor="middle" fill="#b45309">Heat complaints</text><text x="549" y="336" font-weight="400" font-size="7.5" text-anchor="middle" fill="#5c5748">BMS temp-fault history</text>

    <rect x="659" y="305" width="197" height="36" rx="4" fill="#eef3f7" stroke="#0e7490"/><text x="757" y="323" text-anchor="middle" fill="#0e7490">Water exposure</text><text x="757" y="336" font-weight="400" font-size="7.5" text-anchor="middle" fill="#5c5748">flooded packs are compromised</text>
  </g>
  <text x="38" y="362" font-size="9" fill="#5c5748">LFP's higher trigger temperature is WHY it dominates stationary storage — resistant, not immune.</text>

  <rect x="24" y="392" width="852" height="46" rx="5" fill="#fff4e8" stroke="#d4802a" stroke-width="1.5"/>
  <text x="38" y="420" font-size="10.5" font-weight="700" fill="#7a3f14">Lithium is safely serviceable exactly as long as its rules are respected — the same sentence the gas modules teach, with a different fuel.</text>

  <defs>
    <marker id="tr" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#1e1b14"/>
    </marker>
  </defs>
</svg>
