<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="ui-monospace, Consolas, monospace">
  <rect width="900" height="480" fill="#fbf9f4"/>

  <text x="24" y="32" font-size="18" font-weight="700" fill="#1e1b14">Metering Devices — TXV's Mechanical Balance vs. EEV's Electronic Control</text>

  <!-- TXV -->
  <rect x="24" y="55" width="410" height="215" rx="6" fill="#ffffff" stroke="#7a7256" stroke-width="1.5"/>
  <text x="38" y="78" font-size="13" font-weight="700" fill="#1e1b14">TXV — three pressures balance</text>
  <g font-size="9" font-weight="700">
    <rect x="38" y="90" width="118" height="30" rx="4" fill="#e7f4f7" stroke="#0891b2"/><text x="97" y="106" text-anchor="middle" fill="#0e6e85">Bulb pressure</text><text x="97" y="116" font-weight="400" font-size="7" text-anchor="middle" fill="#5c5748">suction line temp</text>

    <rect x="164" y="90" width="118" height="30" rx="4" fill="#fdeec9" stroke="#b45309"/><text x="223" y="106" text-anchor="middle" fill="#b45309">Evap. pressure</text><text x="223" y="116" font-weight="400" font-size="7" text-anchor="middle" fill="#5c5748">opposes bulb</text>

    <rect x="290" y="90" width="118" height="30" rx="4" fill="#fdeec9" stroke="#b45309"/><text x="349" y="106" text-anchor="middle" fill="#b45309">Spring pressure</text><text x="349" y="116" font-weight="400" font-size="7" text-anchor="middle" fill="#5c5748">superheat setpoint</text>
  </g>
  <text x="38" y="142" font-size="9.5" fill="#3f3a2c">Bulb pressure &gt; (evap + spring) → valve opens wider.</text>
  <text x="38" y="156" font-size="9.5" fill="#3f3a2c">Evap + spring dominate → valve closes.</text>
  <rect x="38" y="168" width="358" height="28" rx="4" fill="#0891b2"/>
  <text x="217" y="187" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">Target superheat: 8–12°F</text>
  <text x="38" y="212" font-size="9.5" font-weight="700" fill="#8f1f1a">External equalizer required on high-pressure-drop</text>
  <text x="38" y="226" font-size="9.5" font-weight="700" fill="#8f1f1a">coils — senses true outlet pressure, not inlet.</text>
  <text x="38" y="248" font-size="9.5" fill="#5c5748">Hunting = mislocated bulb, bad adjustment,</text>
  <text x="38" y="261" font-size="9.5" fill="#5c5748">or contaminated/discharged power element.</text>

  <!-- EEV -->
  <rect x="459" y="55" width="417" height="215" rx="6" fill="#e7f4f7" stroke="#0891b2" stroke-width="2"/>
  <text x="473" y="78" font-size="13" font-weight="700" fill="#0e6e85">EEV — stepper motor, case controller</text>
  <text x="473" y="100" font-size="9.5" fill="#3f3a2c">Case controller reads suction temperature +</text>
  <text x="473" y="114" font-size="9.5" fill="#3f3a2c">pressure sensors, calculates superheat in real</text>
  <text x="473" y="128" font-size="9.5" fill="#3f3a2c">time, positions the stepper motor accordingly.</text>
  <rect x="473" y="140" width="380" height="28" rx="4" fill="#0e6e85"/>
  <text x="663" y="159" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">Target superheat: 3–5°F — tighter than TXV</text>
  <text x="473" y="184" font-size="9.5" font-weight="700" fill="#0e6e85">Faster response, wider operating range than</text>
  <text x="473" y="198" font-size="9.5" font-weight="700" fill="#0e6e85">a mechanical TXV can achieve.</text>
  <text x="473" y="220" font-size="9.5" fill="#5c5748">Communicates via LonWorks/Modbus to the rack</text>
  <text x="473" y="234" font-size="9.5" fill="#5c5748">controller — enables demand defrost and</text>
  <text x="473" y="248" font-size="9.5" fill="#5c5748">precise load balancing across multiple cases.</text>

  <rect x="24" y="290" width="852" height="80" rx="6" fill="#fdeec9" stroke="#b45309" stroke-width="2"/>
  <text x="38" y="313" font-size="12" font-weight="700" fill="#b45309">Why EEVs dominate new rack systems</text>
  <text x="38" y="335" font-size="10" fill="#5c5748">Centralized monitoring, alarm management, and demand defrost scheduling across dozens of display</text>
  <text x="38" y="349" font-size="10" fill="#5c5748">cases are only practical with electronic superheat control — a TXV has no network connection to report through.</text>

  <rect x="24" y="386" width="852" height="55" rx="5" fill="#ffffff" stroke="#1e1b14" stroke-width="2"/>
  <text x="38" y="409" font-size="10.5" font-weight="700" fill="#1e1b14">Both metering devices exist to do one job: hold enough liquid back to prevent flooding, while feeding</text>
  <text x="38" y="425" font-size="10.5" font-weight="700" fill="#1e1b14">enough to keep the evaporator wetted — the difference is precision and how fast each can react.</text>
</svg>
