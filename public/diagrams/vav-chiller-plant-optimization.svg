<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="ui-monospace, Consolas, monospace">
  <rect width="900" height="480" fill="#fbf9f4"/>

  <text x="24" y="32" font-size="18" font-weight="700" fill="#1e1b14">VAV Box to Chiller Plant — Optimizing the Whole Chain, Not Just One Box</text>

  <!-- VAV box -->
  <rect x="24" y="55" width="410" height="145" rx="6" fill="#eef3f7" stroke="#0e7490" stroke-width="2"/>
  <text x="38" y="78" font-size="12.5" font-weight="700" fill="#0e7490">VAV terminal box</text>
  <text x="38" y="100" font-size="9.5" fill="#5c5748">Damper actuator modulates airflow —</text>
  <text x="38" y="114" font-size="9.5" fill="#5c5748">controlled by zone DDC vs. temp setpoint.</text>
  <text x="38" y="136" font-size="9.5" font-weight="700" fill="#1f5a8f">Minimum flow = ventilation floor.</text>
  <text x="38" y="150" font-size="9.5" font-weight="700" fill="#1f5a8f">Maximum flow = noise/draft limit.</text>
  <text x="38" y="172" font-size="9.5" fill="#5c5748">Reheat coil fires only at minimum airflow —</text>
  <text x="38" y="186" font-size="9.5" fill="#5c5748">provides heat without opening the damper further.</text>

  <!-- DSP reset -->
  <rect x="459" y="55" width="417" height="145" rx="6" fill="#fdeec9" stroke="#b45309" stroke-width="2"/>
  <text x="473" y="78" font-size="12.5" font-weight="700" fill="#b45309">Duct static pressure (DSP) + fan speed</text>
  <text x="473" y="100" font-size="9.5" fill="#5c5748">Fan speed holds target DSP — typically</text>
  <text x="473" y="114" font-size="9.5" fill="#5c5748">0.8–1.5 in. WC. Boxes closing → DSP rises → fan slows.</text>
  <text x="473" y="136" font-size="9.5" font-weight="700" fill="#8a5010">DSP reset (Gdln 36) trims setpoint down</text>
  <text x="473" y="150" font-size="9.5" font-weight="700" fill="#8a5010">when boxes run nearly wide open.</text>
  <rect x="473" y="162" width="230" height="24" rx="4" fill="#b45309"/>
  <text x="588" y="178" font-size="9.5" font-weight="700" fill="#ffffff" text-anchor="middle">Fan power ∝ speed³ — VFDs matter</text>

  <!-- CHWS reset -->
  <rect x="24" y="220" width="410" height="130" rx="6" fill="#e9f4ef" stroke="#059669" stroke-width="2"/>
  <text x="38" y="243" font-size="12.5" font-weight="700" fill="#065f46">Chilled water supply (CHWS) reset</text>
  <text x="38" y="265" font-size="9.5" fill="#3f3a2c">Raise CHWS setpoint at low load →</text>
  <text x="38" y="279" font-size="9.5" fill="#3f3a2c">reduces refrigeration "lift" between</text>
  <text x="38" y="293" font-size="9.5" fill="#3f3a2c">chilled water and condenser water.</text>
  <text x="38" y="315" font-size="9.5" font-weight="700" fill="#065f46">Lower lift = better chiller efficiency</text>
  <text x="38" y="329" font-size="9.5" font-weight="700" fill="#065f46">(lower kW/ton) at the same cooling output.</text>

  <!-- chiller efficiency -->
  <rect x="459" y="220" width="417" height="130" rx="6" fill="#ffffff" stroke="#7a7256" stroke-width="1.5"/>
  <text x="473" y="243" font-size="12.5" font-weight="700" fill="#1e1b14">Chiller efficiency metrics</text>
  <text x="473" y="265" font-size="9.5" fill="#5c5748">kW/ton — lower is better. Modern centrifugal</text>
  <text x="473" y="279" font-size="9.5" fill="#5c5748">chillers: 0.30–0.50 kW/ton at design conditions.</text>
  <text x="473" y="301" font-size="9.5" font-weight="700" fill="#1e1b14">IPLV — weighted efficiency across 100/75/50/25%</text>
  <text x="473" y="315" font-size="9.5" font-weight="700" fill="#1e1b14">load, since most operating hours are part-load.</text>

  <rect x="24" y="370" width="852" height="78" rx="6" fill="#fdeaea" stroke="#a4231e" stroke-width="2"/>
  <text x="38" y="393" font-size="12" font-weight="700" fill="#8f1f1a">Plant optimization ≠ chiller optimization</text>
  <text x="38" y="415" font-size="10" fill="#5c5748">The goal is minimum TOTAL plant energy — chillers + towers + pumps together. Staging chillers/towers at</text>
  <text x="38" y="429" font-size="10" fill="#5c5748">their most efficient loading and variable primary flow (VPF) pumping often beats chasing a single chiller's peak COP.</text>
</svg>
