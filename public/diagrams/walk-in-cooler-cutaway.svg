<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="ui-monospace, Consolas, monospace">
  <rect width="900" height="480" fill="#fbf9f4"/>

  <text x="24" y="32" font-size="18" font-weight="700" fill="#1e1b14">Walk-In Cooler / Freezer — Key Components</text>
  <text x="24" y="52" font-size="12" fill="#5c5748">One box, one door, one coil inside, one condensing unit outside — the temperature range drives every design detail.</text>

  <!-- component row -->
  <g font-size="10" font-weight="700">
    <rect x="24" y="68" width="204" height="55" rx="4" fill="#eef3f7" stroke="#2a5f8f" stroke-width="2"/><text x="34" y="90" fill="#2a5f8f">Insulated panel walls</text><text x="34" y="105" font-weight="400" font-size="8.5" fill="#4a6d8a">foam-core panels locked</text><text x="34" y="117" font-weight="400" font-size="8.5" fill="#4a6d8a">together, camlock fasteners</text>

    <rect x="243" y="68" width="204" height="55" rx="4" fill="#fdeec9" stroke="#7a3f14" stroke-width="2"/><text x="253" y="90" fill="#7a3f14">Door gasket</text><text x="253" y="105" font-weight="400" font-size="8.5" fill="#8a5010">freezers: heated door frame</text><text x="253" y="117" font-weight="400" font-size="8.5" fill="#8a5010">keeps the gasket from freezing shut</text>

    <rect x="462" y="68" width="204" height="55" rx="4" fill="#eef3f7" stroke="#2a5f8f" stroke-width="2"/><text x="472" y="90" fill="#2a5f8f">Evaporator coil unit</text><text x="472" y="105" font-weight="400" font-size="8.5" fill="#4a6d8a">ceiling-mounted, fan-driven,</text><text x="472" y="117" font-weight="400" font-size="8.5" fill="#4a6d8a">inside the box</text>

    <rect x="681" y="68" width="195" height="55" rx="4" fill="#eef3f7" stroke="#2a5f8f" stroke-width="2"/><text x="691" y="90" fill="#2a5f8f">Pressure-relief port</text><text x="691" y="105" font-weight="400" font-size="8.5" fill="#4a6d8a">heated on freezers to</text><text x="691" y="117" font-weight="400" font-size="8.5" fill="#4a6d8a">prevent ice-blocking</text>
  </g>

  <!-- line set panel -->
  <rect x="24" y="145" width="410" height="140" rx="6" fill="#fff4e8" stroke="#d4802a" stroke-width="2"/>
  <text x="38" y="168" font-size="12.5" font-weight="700" fill="#7a3f14">Refrigerant line set</text>
  <text x="38" y="191" font-size="10" font-weight="700" fill="#7a3f14">Hot gas / liquid line</text>
  <text x="38" y="205" font-size="9.5" fill="#5c5748">runs from the condensing unit to the</text>
  <text x="38" y="218" font-size="9.5" fill="#5c5748">evaporator, through the wall penetration</text>
  <text x="38" y="240" font-size="10" font-weight="700" fill="#1f5a8f">Suction line</text>
  <text x="38" y="254" font-size="9.5" fill="#5c5748">returns low-pressure vapor to the</text>
  <text x="38" y="267" font-size="9.5" fill="#5c5748">compressor — insulate the full run to</text>
  <text x="38" y="280" font-size="9.5" fill="#5c5748">prevent condensation and capacity loss.</text>

  <!-- condensing unit panel -->
  <rect x="459" y="145" width="417" height="140" rx="6" fill="#eef3f7" stroke="#2a5f8f" stroke-width="2"/>
  <text x="473" y="168" font-size="12.5" font-weight="700" fill="#2a5f8f">Condensing unit</text>
  <text x="473" y="191" font-size="10" fill="#1e1b14">Compressor + condenser coil, mounted</text>
  <text x="473" y="205" font-size="10" fill="#1e1b14">on the roof, on the ground, or on top</text>
  <text x="473" y="219" font-size="10" fill="#1e1b14">of the box — always outside the</text>
  <text x="473" y="233" font-size="10" fill="#1e1b14">refrigerated space.</text>
  <text x="473" y="255" font-size="9.5" font-weight="700" fill="#1f5a8f">Rejects the heat pulled out of the box</text>
  <text x="473" y="269" font-size="9.5" font-weight="700" fill="#1f5a8f">to the outside air — condenser airflow</text>
  <text x="473" y="283" font-size="9.5" font-weight="700" fill="#1f5a8f">restriction is the most common field fault.</text>

  <!-- temp range comparison -->
  <rect x="24" y="305" width="410" height="60" rx="6" fill="#ffffff" stroke="#7a7256" stroke-width="1.5"/>
  <text x="38" y="330" font-size="13" font-weight="700" fill="#1e1b14">Cooler: 35–38°F</text>
  <text x="38" y="350" font-size="9.5" fill="#5c5748">Standard evaporator, standard door — no active defrost needed.</text>

  <rect x="459" y="305" width="417" height="60" rx="6" fill="#ffffff" stroke="#7a7256" stroke-width="1.5"/>
  <text x="473" y="330" font-size="13" font-weight="700" fill="#1e1b14">Freezer: −10 to 0°F</text>
  <text x="473" y="350" font-size="9.5" fill="#5c5748">Active defrost, heated port, heated door frame all become necessary.</text>

  <rect x="24" y="385" width="852" height="60" rx="6" fill="#fff4e8" stroke="#d4802a" stroke-width="1.5"/>
  <text x="38" y="410" font-size="11" font-weight="700" fill="#7a3f14">The gap between cooler and freezer temperature ranges drives every design difference on this diagram —</text>
  <text x="38" y="428" font-size="11" font-weight="700" fill="#7a3f14">defrost method, port heaters, and frame heaters all exist because water freezes below 32°F, oil doesn&apos;t.</text>
</svg>
