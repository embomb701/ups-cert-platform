<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="ui-monospace, Consolas, monospace">
  <rect width="900" height="480" fill="#fbf9f4"/>

  <text x="24" y="32" font-size="18" font-weight="700" fill="#1e1b14">WUE and Economization — Free Cooling Depends on the Weather</text>

  <!-- WUE formula -->
  <rect x="24" y="55" width="852" height="55" rx="6" fill="#eef3f7" stroke="#2563eb" stroke-width="2"/>
  <text x="38" y="82" font-size="13.5" font-weight="700" fill="#1e40af" font-family="ui-monospace,Consolas,monospace">WUE = Annual Site Water Use (L) ÷ IT Equipment Energy (kWh)</text>
  <text x="600" y="82" font-size="9.5" fill="#3f3a2c">0 = no water use at all</text>

  <!-- 3 economization types -->
  <g font-size="9.5" font-weight="700">
    <rect x="24" y="125" width="272" height="115" rx="6" fill="#e9f4ef" stroke="#059669" stroke-width="2"/>
    <text x="38" y="148" fill="#065f46">Air-side (direct)</text>
    <text x="38" y="170" font-weight="400" font-size="9" fill="#3f3a2c">Outdoor air cools the data</text>
    <text x="38" y="183" font-weight="400" font-size="9" fill="#3f3a2c">center directly when within</text>
    <text x="38" y="196" font-weight="400" font-size="9" fill="#3f3a2c">the ASHRAE thermal envelope.</text>
    <text x="38" y="218" font-weight="700" font-size="8.5" fill="#065f46">65°F outdoors = no reason to run a chiller</text>

    <rect x="314" y="125" width="272" height="115" rx="6" fill="#fdeec9" stroke="#b45309" stroke-width="2"/>
    <text x="328" y="148" fill="#b45309">Air-side (indirect)</text>
    <text x="328" y="170" font-weight="400" font-size="9" fill="#3f3a2c">Heat exchanger transfers heat</text>
    <text x="328" y="183" font-weight="400" font-size="9" fill="#3f3a2c">without mixing airstreams.</text>
    <text x="328" y="218" font-weight="700" font-size="8.5" fill="#8a5010">For polluted/humid climates</text>

    <rect x="604" y="125" width="272" height="115" rx="6" fill="#eef3f7" stroke="#0e7490" stroke-width="2"/>
    <text x="618" y="148" fill="#0e7490">Water-side</text>
    <text x="618" y="170" font-weight="400" font-size="9" fill="#3f3a2c">Cooling tower water cools the</text>
    <text x="618" y="183" font-weight="400" font-size="9" fill="#3f3a2c">chilled water loop via heat</text>
    <text x="618" y="196" font-weight="400" font-size="9" fill="#3f3a2c">exchanger — chiller bypassed.</text>
    <text x="618" y="218" font-weight="700" font-size="8.5" fill="#1f5a8f">Full compressor energy saved</text>
  </g>

  <!-- economizer hours -->
  <rect x="24" y="255" width="410" height="90" rx="6" fill="#ffffff" stroke="#7a7256" stroke-width="1.5"/>
  <text x="38" y="278" font-size="12" font-weight="700" fill="#1e1b14">Economizer hours — the climate KPI</text>
  <text x="38" y="300" font-size="9.5" fill="#5c5748">Seattle: 6,000–8,000 hr/year.</text>
  <text x="38" y="314" font-size="9.5" fill="#5c5748">Phoenix: only 1,000–2,000 hr/year.</text>
  <text x="38" y="330" font-size="8.5" fill="#5c5748">Climate dominates the economization opportunity.</text>

  <!-- legionella -->
  <rect x="459" y="255" width="417" height="90" rx="6" fill="#fdeaea" stroke="#a4231e" stroke-width="2"/>
  <text x="473" y="278" font-size="12" font-weight="700" fill="#8f1f1a">Cooling tower Legionella management</text>
  <text x="473" y="300" font-size="9.5" fill="#5c5748">ASHRAE 188 requires a formal Water</text>
  <text x="473" y="314" font-size="9.5" fill="#5c5748">Management Plan and regular risk assessment.</text>
  <text x="473" y="330" font-size="8.5" font-weight="700" fill="#8f1f1a">A public health crisis AND an existential business risk.</text>

  <rect x="24" y="365" width="852" height="95" rx="6" fill="#fff4e8" stroke="#d4802a" stroke-width="1.5"/>
  <text x="38" y="388" font-size="12" font-weight="700" fill="#7a3f14">More economizer hours = lower PUE, directly</text>
  <text x="38" y="410" font-size="10" fill="#5c5748">Every hour running on free cooling instead of mechanical chilling reduces the overhead power in the</text>
  <text x="38" y="424" font-size="10" fill="#5c5748">PUE calculation — Google and Microsoft now publish WUE and economizer utilization as standard</text>
  <text x="38" y="438" font-size="10" fill="#5c5748">sustainability reporting, and that transparency is becoming the industry expectation.</text>
</svg>
